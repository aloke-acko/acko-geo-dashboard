<!DOCTYPE html>
<html lang="en" data-variant="editorial">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ACKO GMC AI Visibility Dashboard</title>
<style>
/* ==========================================================================
   ACKO GEO Dashboard — Design System
   Three variants on a shared dark base. Switch via [data-variant] on <html>.
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* ACKO purple anchor */
  --acko-50:  #f3f0ff;
  --acko-100: #e6dfff;
  --acko-200: #cdbcff;
  --acko-300: #b39aff;
  --acko-400: #9577ff;
  --acko-500: #7c5cff;   /* primary */
  --acko-600: #6a47f0;
  --acko-700: #5734d4;
  --acko-800: #4527a8;
  --acko-900: #2f1c75;
  --acko-orange: #FF6B00;

  /* Neutrals — deep ink */
  --ink-0:  #06060c;
  --ink-1:  #0a0a14;
  --ink-2:  #0f0f1c;
  --ink-3:  #141425;
  --ink-4:  #1c1c30;
  --ink-5:  #25253d;
  --ink-6:  #34344f;
  --ink-7:  #4a4a6a;

  --fg-0:  #ffffff;
  --fg-1:  #e8e8f5;
  --fg-2:  #b8b8d0;
  --fg-3:  #8a8aa8;
  --fg-4:  #5e5e80;

  --good: #4ade80;
  --bad:  #ff6470;
  --warn: #ffb547;
  --info: #5aa9ff;

  --radius-sm: 6px;
  --radius:    10px;
  --radius-lg: 16px;
  --radius-xl: 22px;

  /* Typography defaults (overridden per variant) */
  --font-sans: 'Geist', -apple-system, system-ui, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --font-display: 'Geist', sans-serif;

  --tracking-tight: -0.02em;
  --tracking-normal: 0;
  --tracking-wide: 0.08em;

  /* Card surface defaults */
  --surface: var(--ink-2);
  --surface-2: var(--ink-3);
  --surface-3: var(--ink-4);
  --border: rgba(255,255,255,0.06);
  --border-strong: rgba(255,255,255,0.12);

  --shadow-sm: 0 1px 2px rgba(0,0,0,0.35);
  --shadow:    0 8px 24px rgba(0,0,0,0.4);
  --shadow-lg: 0 24px 60px rgba(0,0,0,0.5);
}

html, body {
  background: var(--ink-0);
  color: var(--fg-1);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* =========================================================================
   VARIANT A — EDITORIAL (default)
   Confident, generous, large display type, subtle gradient washes.
   ========================================================================= */
[data-variant="editorial"] {
  --surface: #0d0d18;
  --surface-2: #14142a;
  --surface-3: #1a1a36;
  --border: rgba(124,92,255,0.10);
  --border-strong: rgba(124,92,255,0.22);
  --font-display: 'Instrument Serif', 'Geist', serif;
}
[data-variant="editorial"] body {
  background:
    radial-gradient(1200px 600px at 0% -10%, rgba(124,92,255,0.18), transparent 60%),
    radial-gradient(900px 500px at 100% 110%, rgba(106,71,240,0.10), transparent 60%),
    var(--ink-0);
  background-attachment: fixed;
}

/* =========================================================================
   VARIANT B — TERMINAL (dense, monospace, hairline rules)
   ========================================================================= */
[data-variant="terminal"] {
  --surface: #08080f;
  --surface-2: #0c0c18;
  --surface-3: #11111f;
  --border: rgba(255,255,255,0.08);
  --border-strong: rgba(124,92,255,0.35);
  --font-sans: 'Geist Mono', ui-monospace, monospace;
  --font-display: 'Geist Mono', monospace;
  --radius: 2px;
  --radius-sm: 0;
  --radius-lg: 4px;
  --radius-xl: 4px;
}
[data-variant="terminal"] body {
  background: var(--ink-0);
}
[data-variant="terminal"] .card { box-shadow: none; }

/* =========================================================================
   VARIANT C — GLOW (soft glassy cards, purple aura)
   ========================================================================= */
[data-variant="glow"] {
  --surface: rgba(20,20,38,0.7);
  --surface-2: rgba(28,28,52,0.7);
  --surface-3: rgba(36,36,68,0.7);
  --border: rgba(255,255,255,0.06);
  --border-strong: rgba(124,92,255,0.4);
  --radius: 18px;
  --radius-lg: 24px;
  --radius-xl: 28px;
}
[data-variant="glow"] body {
  background:
    radial-gradient(900px 500px at 15% 0%, rgba(124,92,255,0.25), transparent 55%),
    radial-gradient(800px 600px at 85% 100%, rgba(60,40,180,0.20), transparent 55%),
    radial-gradient(600px 400px at 50% 50%, rgba(124,92,255,0.06), transparent 60%),
    #050510;
  background-attachment: fixed;
}
[data-variant="glow"] .card {
  backdrop-filter: blur(20px) saturate(140%);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
  background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
  border: 1px solid var(--border);
  box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 30px 60px -20px rgba(0,0,0,0.6);
}
[data-variant="glow"] .kpi { position: relative; overflow: hidden; }
[data-variant="glow"] .kpi::after {
  content: ""; position: absolute; inset: -1px; border-radius: inherit; pointer-events: none;
  background: radial-gradient(400px 200px at var(--mx, 50%) 0%, rgba(124,92,255,0.18), transparent 60%);
}

/* =========================================================================
   APP SHELL
   ========================================================================= */
.app {
  display: grid;
  grid-template-columns: 208px minmax(0, 1fr);
  min-height: 100vh;
}
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: relative; height: auto; }
}
.sidebar {
  position: sticky; top: 0; height: 100vh;
  border-right: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(124,92,255,0.04), transparent 40%), var(--ink-1);
  display: flex; flex-direction: column;
  padding: 22px 16px;
  z-index: 5;
}
[data-variant="terminal"] .sidebar { background: var(--ink-1); }
[data-variant="glow"] .sidebar {
  background: linear-gradient(180deg, rgba(124,92,255,0.08), rgba(0,0,0,0.4));
  backdrop-filter: blur(14px);
}

.sidebar-brand {
  display: flex; align-items: center; gap: 10px;
  padding: 4px 6px 22px 6px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}
.sidebar-brand .acko-wordmark {
  height: 28px; width: auto; display: block;
  color: var(--fg-0);
}
.src-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--fg-2);
  white-space: nowrap;
}

.nav-section {
  margin-bottom: 18px;
}
.nav-section-label {
  text-transform: uppercase; letter-spacing: 0.12em; font-size: 10px;
  color: var(--fg-4); padding: 0 8px 6px; font-weight: 600;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 8px;
  color: var(--fg-2); font-size: 13px; cursor: pointer;
  user-select: none;
  border: 1px solid transparent;
  transition: background .15s ease, color .15s ease, border-color .15s ease;
  white-space: nowrap;
}
.nav-item > span:first-of-type { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.nav-item:hover { background: rgba(255,255,255,0.04); color: var(--fg-1); }
.nav-item.active {
  background: linear-gradient(180deg, rgba(124,92,255,0.16), rgba(124,92,255,0.06));
  color: var(--fg-0);
  border-color: rgba(124,92,255,0.25);
}
.nav-item svg { width: 16px; height: 16px; flex: 0 0 16px; opacity: 0.85; }
.nav-item .badge {
  margin-left: auto; font-size: 10px; padding: 2px 6px; border-radius: 999px;
  background: rgba(124,92,255,0.18); color: var(--acko-200);
  font-family: var(--font-mono); font-weight: 600;
}

.sidebar-footer {
  margin-top: auto;
  padding: 12px;
  border-top: 1px solid var(--border);
  font-size: 11px; color: var(--fg-4);
  display: flex; align-items: flex-start; gap: 8px;
}
.sidebar-footer > div { min-width: 0; flex: 1; }
.sidebar-footer > div > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-footer .dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--good);
  box-shadow: 0 0 8px var(--good);
}

/* Main content */
.main { min-width: 0; padding: 28px 32px 80px; max-width: 100%; overflow-x: hidden; }
@media (max-width: 1100px) { .main { padding: 22px 20px 60px; } }
[data-variant="terminal"] .main { padding: 18px 24px 60px; }

/* =========================================================================
   HEADER
   ========================================================================= */
.page-header {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 24px;
  padding-bottom: 22px; margin-bottom: 22px;
  border-bottom: 1px solid var(--border);
  flex-wrap: nowrap;
}
.page-title {
  font-family: var(--font-display);
  font-size: 28px; font-weight: 600; letter-spacing: var(--tracking-tight);
  line-height: 1.1;
  color: var(--fg-0);
}
[data-variant="editorial"] .page-title {
  font-size: 36px; font-weight: 400; letter-spacing: -0.02em;
}
[data-variant="editorial"] .page-title em {
  font-style: italic; color: var(--acko-300); font-weight: 400;
}
[data-variant="terminal"] .page-title {
  font-size: 22px; text-transform: uppercase; letter-spacing: 0.04em;
}
[data-variant="terminal"] .page-title em { font-style: normal; color: var(--acko-400); }

.page-subtitle {
  margin-top: 8px; color: var(--fg-3); font-size: 13px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
}
.page-subtitle .pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  color: var(--fg-2); font-size: 12px;
  font-family: var(--font-mono);
  white-space: nowrap;
}
.page-subtitle .pill .key { color: var(--fg-4); }
.page-subtitle .pill svg { width: 12px; height: 12px; }

.page-header-left { min-width: 0; flex: 1 1 auto; }
.page-header-left .page-subtitle { row-gap: 8px; }
.header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 14px; border-radius: var(--radius);
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border-strong);
  color: var(--fg-1); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all .15s ease;
  font-family: inherit;
}
.btn:hover { background: rgba(255,255,255,0.08); }
.btn svg { width: 14px; height: 14px; }
.btn.primary {
  background: linear-gradient(180deg, var(--acko-500), var(--acko-700));
  border-color: var(--acko-600);
  color: white;
  box-shadow: 0 6px 18px -4px rgba(124,92,255,0.45);
}
.btn.primary:hover { filter: brightness(1.08); }

/* Period bar */
.period-bar {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 10px 16px; margin-bottom: 22px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 12px;
}
.period-bar .date-pill { white-space: nowrap; }
.period-bar .label {
  text-transform: uppercase; font-size: 10px; letter-spacing: 0.14em;
  color: var(--fg-4); font-weight: 600; padding-right: 4px;
}
.date-pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 12px; border-radius: var(--radius-sm);
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--fg-1); font-family: var(--font-mono); font-size: 12px; cursor: pointer;
}
.date-pill:hover { border-color: var(--border-strong); }
.date-pill svg { width: 12px; height: 12px; opacity: 0.7; }
.range-presets { display: flex; gap: 4px; }
.range-preset {
  padding: 6px 10px; border-radius: var(--radius-sm);
  background: transparent; border: 1px solid transparent;
  color: var(--fg-3); font-size: 11px; cursor: pointer; font-family: var(--font-mono);
}
.range-preset:hover { color: var(--fg-1); }
.range-preset.active { background: rgba(124,92,255,0.14); color: var(--acko-200); border-color: rgba(124,92,255,0.3); }
.compare-toggle {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;
  font-size: 12px; color: var(--fg-2);
  white-space: nowrap;
}
.period-bar .updated {
  margin-left: auto; color: var(--fg-4); font-size: 11px; font-family: var(--font-mono);
  white-space: nowrap;
}
.compare-toggle .switch {
  width: 28px; height: 16px; border-radius: 999px; background: var(--ink-5); position: relative;
  transition: background .15s;
}
.compare-toggle .switch::after {
  content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px;
  border-radius: 50%; background: var(--fg-2); transition: all .15s;
}
.compare-toggle.on .switch { background: var(--acko-600); }
.compare-toggle.on .switch::after { left: 14px; background: white; }

/* =========================================================================
   CARDS
   ========================================================================= */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}
.card-header {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  padding: 18px 22px 12px;
  flex-wrap: wrap;
}
.card-header > div:first-child { min-width: 0; flex: 1; }
.card-title {
  font-size: 14px; font-weight: 600; letter-spacing: -0.01em;
  color: var(--fg-0); display: flex; align-items: center; gap: 10px;
  flex-wrap: wrap;
  min-width: 0;
}
.card-title > span:not(.accent):not(.count) { white-space: nowrap; }
[data-variant="editorial"] .card-title {
  font-family: var(--font-display); font-weight: 400; font-size: 20px; letter-spacing: -0.01em;
}
[data-variant="editorial"] .card-title em { font-style: italic; color: var(--acko-300); }
[data-variant="terminal"] .card-title {
  text-transform: uppercase; font-size: 12px; letter-spacing: 0.12em; font-weight: 600;
}
.card-title .accent {
  display: inline-block; width: 4px; height: 16px; background: var(--acko-500); border-radius: 2px;
}
[data-variant="editorial"] .card-title .accent { display: none; }
.card-subtitle { color: var(--fg-3); font-size: 12px; }
.card-actions { display: flex; gap: 6px; align-items: center; }
.card-body { padding: 6px 22px 22px; }
.card-body.flush { padding: 0; }

/* =========================================================================
   KPI TILES
   ========================================================================= */
.kpi-grid {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px;
  margin-bottom: 28px;
}
@media (max-width: 760px)  { .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi-value { word-break: break-word; }

.kpi {
  position: relative;
  padding: 18px 18px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.kpi.acko {
  border-color: rgba(124,92,255,0.3);
  background: linear-gradient(180deg, rgba(124,92,255,0.08), transparent 50%), var(--surface);
}
[data-variant="terminal"] .kpi.acko {
  background: var(--surface);
  border-color: var(--acko-700);
  border-left: 3px solid var(--acko-500);
}
.kpi-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--fg-3); font-weight: 600;
  display: flex; align-items: center; gap: 6px;
}
.kpi-label .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--acko-500); box-shadow: 0 0 8px var(--acko-500);
}
.kpi-value {
  margin-top: 14px;
  font-family: var(--font-display);
  font-size: 36px; font-weight: 600;
  letter-spacing: -0.03em; line-height: 1;
  color: var(--fg-0);
  font-variant-numeric: tabular-nums;
}
[data-variant="editorial"] .kpi-value {
  font-weight: 400; font-size: 44px; letter-spacing: -0.02em;
}
[data-variant="editorial"] .kpi-value .unit {
  font-style: italic; color: var(--acko-300); font-size: 0.7em;
}
[data-variant="terminal"] .kpi-value {
  font-size: 32px; font-weight: 500;
}
.kpi-value .unit { color: var(--acko-300); margin-left: 2px; }
.kpi-value.text { font-size: 26px; letter-spacing: -0.01em; }
[data-variant="editorial"] .kpi-value.text { font-size: 32px; }
.kpi-caption {
  margin-top: 10px; color: var(--fg-3); font-size: 12px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.kpi-spark {
  display: block;
  height: 26px; width: 100%; margin-top: 8px; opacity: 0.85;
}
.kpi-delta {
  display: inline-flex; align-items: center; gap: 3px;
  font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  padding: 2px 6px; border-radius: 4px;
}
.kpi-delta.up   { color: var(--good); background: rgba(74,222,128,0.10); }
.kpi-delta.down { color: var(--bad);  background: rgba(255,100,112,0.10); }
.kpi-delta svg { width: 10px; height: 10px; }

/* =========================================================================
   BAR CHART (horizontal)
   ========================================================================= */
.bars { display: flex; flex-direction: column; gap: 4px; }
.bar-row {
  display: grid; grid-template-columns: 130px 1fr 64px;
  align-items: center; gap: 14px;
  padding: 6px 4px;
  border-radius: 6px;
  cursor: pointer;
  transition: background .12s;
}
.bar-row:hover { background: rgba(255,255,255,0.03); }
.bar-row.acko .bar-name { color: var(--acko-300); font-weight: 600; }
.bar-name {
  font-size: 13px; color: var(--fg-2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-variant-numeric: tabular-nums;
}
.bar-track {
  height: 22px; background: rgba(255,255,255,0.03);
  border-radius: 4px; overflow: hidden; position: relative;
}
[data-variant="terminal"] .bar-track {
  height: 14px; border-radius: 0;
  background: rgba(255,255,255,0.04);
}
.bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #4d8eff, #5aa9ff);
  border-radius: inherit;
  position: relative;
  transition: width .6s cubic-bezier(.2,.8,.2,1);
}
.bar-row.acko .bar-fill {
  background: linear-gradient(90deg, var(--acko-600), var(--acko-400));
  box-shadow: 0 0 16px rgba(124,92,255,0.4);
}
[data-variant="terminal"] .bar-fill {
  background: var(--info);
}
[data-variant="terminal"] .bar-row.acko .bar-fill { background: var(--acko-500); box-shadow: none; }
.bar-value {
  font-family: var(--font-mono); font-size: 12px; color: var(--fg-1);
  text-align: right; font-variant-numeric: tabular-nums; font-weight: 500;
}
.bar-row.acko .bar-value { color: var(--acko-200); }

/* =========================================================================
   TABLES
   ========================================================================= */
.table-wrap { overflow-x: auto; max-height: 680px; overflow-y: auto; }
.table-wrap::-webkit-scrollbar { width: 6px; }
.table-wrap::-webkit-scrollbar-track { background: var(--ink-2); border-radius: 3px; }
.table-wrap::-webkit-scrollbar-thumb { background: var(--ink-6); border-radius: 3px; }
.table-wrap::-webkit-scrollbar-thumb:hover { background: var(--ink-7); }
.table thead { position: sticky; top: 0; z-index: 5; background: var(--surface); }
.table {
  width: 100%; border-collapse: collapse;
  font-size: 13px;
}
.table th {
  text-align: left; font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.12em; color: var(--fg-3); font-weight: 600;
  padding: 12px 16px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  user-select: none;
}
.table th.sortable { cursor: pointer; }
.table th.sortable:hover { color: var(--fg-1); }
.table th .sort-arrow {
  display: inline-block; margin-left: 4px; opacity: 0.6;
  font-size: 9px;
}
.table td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  color: var(--fg-1);
  vertical-align: middle;
}
.table tr:last-child td { border-bottom: none; }
.table tr:hover td { background: rgba(124,92,255,0.04); }
.table tr.acko td { background: rgba(124,92,255,0.06); }
.table tr.acko td:first-child { box-shadow: inset 3px 0 0 var(--acko-500); }
.table .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.table .url {
  color: var(--acko-300); font-family: var(--font-mono); font-size: 12px;
  display: inline-flex; align-items: center; gap: 6px;
  max-width: 100%;
}
.table .url > span.urltext {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  max-width: 380px; display: inline-block; vertical-align: bottom;
}
.table .url svg { flex-shrink: 0; opacity: 0.6; width: 11px; height: 11px; }
.table .url:hover { text-decoration: underline; }
.table svg { width: 14px; height: 14px; }
.table .url svg { width: 11px; height: 11px; }

.cell-num-pill {
  display: inline-block;

.row-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 24px; }

.section-title {
  font-family: var(--font-display);
  font-size: 22px; font-weight: 600; letter-spacing: -0.01em;
  margin: 12px 0 14px; color: var(--fg-0);
  display: flex; align-items: baseline; gap: 12px;
}
[data-variant="editorial"] .section-title {
  font-size: 32px; font-weight: 400;
}
[data-variant="editorial"] .section-title em { font-style: italic; color: var(--acko-300); }
[data-variant="terminal"] .section-title {
  font-size: 13px; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600;
}
.section-title .count {
  font-family: var(--font-mono); font-size: 13px; color: var(--fg-4); font-weight: 400;
}

/* Filter bar */
.filter-bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 14px 22px;
  border-bottom: 1px solid var(--border);
}
.search {
  position: relative; flex: 1; min-width: 240px; max-width: 340px;
}
.search input {
  width: 100%; padding: 8px 12px 8px 32px; border-radius: var(--radius-sm);
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--fg-1); font-size: 13px; font-family: inherit;
  outline: none; transition: border-color .15s;
}
.search input:focus { border-color: var(--acko-600); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--fg-4); }

.filter-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: var(--radius-sm);
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--fg-2); font-size: 12px; cursor: pointer;
  user-select: none;
  font-family: inherit;
}
.filter-chip:hover { color: var(--fg-1); border-color: var(--border-strong); }
.filter-chip.active {
  background: rgba(124,92,255,0.14); color: var(--acko-200); border-color: rgba(124,92,255,0.35);
}
.filter-chip .ct {
  font-family: var(--font-mono); font-size: 10px; opacity: 0.7;
}

/* Volume bucket (small inline bar in table) */
.vol-cell {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 12px;
  font-weight: 500;
}
.vol-cell .vbar {
  width: 60px; height: 4px; border-radius: 999px;
  background: rgba(255,255,255,0.05); position: relative; overflow: hidden;
}
.vol-cell .vbar > span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--info); border-radius: inherit; }
.vol-cell.high   .vbar > span { background: var(--bad); }
.vol-cell.med    .vbar > span { background: var(--warn); }
.vol-cell.low    .vbar > span { background: var(--info); }

/* Drill-down panel */
.drawer-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55);
  backdrop-filter: blur(6px); z-index: 50;
  display: flex; justify-content: flex-end;
  animation: fade .18s ease;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.drawer {
  width: min(780px, 65%); height: 100%;
  background: var(--surface);
  border-left: 1px solid var(--border-strong);
  overflow-y: auto;
  animation: slidein .22s cubic-bezier(.2,.8,.2,1);
}
@keyframes slidein { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.drawer-head {
  padding: 22px 26px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
}
.drawer-head h3 {
  font-family: var(--font-display); font-size: 22px; font-weight: 600;
  letter-spacing: -0.01em; line-height: 1.2;
}
[data-variant="editorial"] .drawer-head h3 { font-weight: 400; font-size: 28px; }
.drawer-head .close {
  background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: var(--radius-sm);
  width: 32px; height: 32px; display: grid; place-items: center; cursor: pointer; color: var(--fg-2);
}
.drawer-body { padding: 22px 26px; display: flex; flex-direction: column; gap: 22px; }
.drawer-stat-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;
}
.drawer-stat {
  padding: 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius);
}
.drawer-stat .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--fg-3); font-weight: 600; }
.drawer-stat .val {
  font-family: var(--font-display); font-size: 24px; font-weight: 600; margin-top: 6px;
  letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
}
.drawer-response-wrap {
  display: grid; grid-template-columns: 1fr 280px; gap: 0;
  border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
  min-height: 200px;
}
@media (max-width: 700px) { .drawer-response-wrap { grid-template-columns: 1fr; } }
.drawer-response {
  padding: 18px 20px; font-size: 13px; line-height: 1.75; color: var(--fg-2);
  white-space: pre-wrap; word-break: break-word; max-height: 480px; overflow-y: auto;
  background: var(--surface-2);
}
.drawer-response::-webkit-scrollbar { width: 5px; }
.drawer-response::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
.drawer-cited-sidebar {
  padding: 16px 18px; border-left: 1px solid var(--border);
  background: var(--surface); overflow-y: auto; max-height: 480px;
}
.drawer-cited-sidebar h4 {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em;

.cited-link {
  display: block; padding: 10px 12px; margin-bottom: 8px;

.cited-link .cited-title { color: var(--fg-2); display: block; margin-bottom: 4px; font-weight: 500; }
.cited-link .cited-url { color: var(--fg-4); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }

.cited-link.acko-link .cited-url { color: var(--acko-orange, #FF6B00); }
.drawer-no-response { padding: 30px; text-align: center; color: var(--fg-4); font-size: 13px; font-style: italic; }

   GAP ANALYSIS — quadrant
   ========================================================================= */

  position: relative;
  padding: 0;
  height: 460px;
}
.quadrant-svg { width: 100%; height: 100%; display: block; }
.quad-legend {

.priority-list { display: flex; flex-direction: column; }
.priority-item {
  display: grid; grid-template-columns: 28px 1fr auto auto; gap: 14px;
  padding: 12px 22px; align-items: center;
  border-bottom: 1px solid var(--border);
  cursor: pointer; transition: background .12s;

.priority-prompt { font-size: 13px; color: var(--fg-1); line-height: 1.4; }
.priority-vol { font-family: var(--font-mono); font-size: 12px; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.priority-tag {

ver per employee  \n> Annual premium = \u20b98,000 per employee\n\nThe company's base premium would b\u2026",

s , which is particularly valuable in a corporate plan.\n    \n  * Maternity cover , if your\u2026",

talization, follow the notification/pre-authorisation deadline in your particular p\u2026",

m-rent limits\n    \n  * ICU limits\n    \n  * Disease-specific sub-limits\n    \n \u2026",

      "response": "HR can use a Group Mediclaim (GMC) policy as more than just an insurance benefit \u2014it can become a tool for employee wellbeing, retention, cost control, and engagement.\n\n### 1\\. Improve the policy itself\n\nHR should review claims data and employee feedback before renewal and negotiate for benefits that employees actually use:\n\n  * Higher base sum insured where current limits are inadequate\n    \n  * Voluntary top-up/super top-up at employee cost\n    \n  * Better maternity and newborn coverage\n    \n  * OPD and diagnostic benefits\n    \n  * Day-care procedures\n    \n  * Mental-health coverage\n    \n  * Chronic disease management\n    \n  * Coverage for parents, where financially viable\n    \n  * Reduced sub-limits and unnecessary exclusions\n    \n  * Large, quality cashless hospital network\n\nThis is particularly important because medical costs are rising and many employer plans still focus heavily on hospitalisation rather than outpatient and preventive care. [www.expresshealthcare.in](https://www.expresshealthcare.in/news/surge-in-hospitalisations-and-claims-drives-employer-health-benefit-reset/452190/?utm_source=chatgpt.com) \n\n### 2\\. Use GMC for preventive healthcare\n\nInstead of waiting for employees to make claims, HR can connect the policy with:\n\n  * Annual health check-ups\n    \n  * Health-risk assessments\n    \n  * Vaccination drives\n    \n  * Diabetes/BP/cholesterol screening\n    \n  * Women's health programs\n    \n  * Nutrition and fitness programs\n    \n  * Preventive consultations\n\nIRDAI has specifically issued guidelines concerning wellness and preventive features in health insurance. [irdai.gov.in](https://irdai.gov.in/en/guidelines?_com_irdai_document_media_IRDAIDocumentMediaPortlet_cur=1&_com_irdai_document_media_IRDAIDocumentMediaPortlet_delta=60&_com_irdai_document_media_IRDAIDocumentMediaPortlet_orderByCol=SubTitle_sortable&_com_irdai_document_media_IRDAIDocumentMediaPortlet_orderByType=desc&p_p_ p%20Health%20Insurance.pdf?utm_source=chatgpt.com) \n\n  5. The insurer\u2026",

      "response": "In India, group medical insurance (GMC) typically costs an employer around \u20b95,000\u2013\u20b915,000 per employee per year for standard employee coverage. The exact price varies substantially based on coverage and employee demographics.\n\nA useful 2026 benchmark is:\n\nCoverage\\| Approx. annual cost / employee  \n\\---\\|---  \nEmployee only, \u20b92\u20133 lakh cover\\| \u20b93,000\u2013\u20b96,000  \nEmployee only, \u20b95 lakh cover\\| \u20b95,000\u2013\u20b99,000  \nEmployee + spouse + 2 children, \u20b95 lakh\\| \u20b97,000\u2013\u20b915,000  \nEmployee + family + parents\\| \u20b915,000\u2013\u20b930,000+\n  \nOne 2026 market estimate puts a \u20b93 lakh family cover (employee + spouse + two children) around \u20b96,000\u2013\u20b98,000 per employee/year , while adding parents can take the cost to \u20b915,000+. [Employee Health Insurance Cost Per Employee in India: 2026 Pricing Guide](https://www.plumhq.com/blog/employee-health-insurance-cost-per-employee-india?utm_source=chatgpt.com) Another recent estimate gives roughly \u20b910,000\u2013\u20b927,000 for employee-only cover , depending on company size and location, with family coverage reaching \u20b945,000 in some metro/large-company cases. [assets-eu.researchsquare.com](https://assets-eu.researchsquare.com/files/rs-7877923/v1_covered_8de8a966-1cd1-4772-b1ee-9592d96b6aac.pdf?c=1760930363&utm_source=chatgpt.com) \n\n### For budgeting a company\n\nIf you're budgeting for, say, 100 employees , I'd use:\n\n  * Basic GMC: \u20b95\u20137 lakh/year\n    \n  * Good \u20b95 lakh family floater: \u20b98\u201312 lakh/year\n    \n  * Comprehensive family + parents: \u20b915\u201325 lakh+/year\n\nThe biggest pricing factors are average employee age, number/age of dependants, sum insured, whether parents are covered, location, past claims, maternity benefits, and room-rent/other limits.\n\nAlso, medical costs in India are rising quickly\u2014Aon's 2026 estimate puts India's medical-cost trend at 11\\.5% , so group premiums can rise materially at renewal. [www.expresshealthcare.in](https://www.expresshealthcare.in/news/india-outpaces-global-average-with-2026-medical-trend-at-11-5-percent-aon-reports/451884/?utm_source=chatg\u2026",

      "response": "## What Is Corporate Insurance?\n\nCorporate insurance is a broad term for insurance policies that protect a business, its employees, assets, and operations against financial losses arising from unexpected events. It is essentially a risk-management tool that helps a company remain financially stable when accidents, property damage, lawsuits, employee-related incidents, cyberattacks, or other disruptions occur. [irdai.gov.in](https://irdai.gov.in/non-life2?utm_source=chatgpt.com) [www.tataaig.com](https://www.tataaig.com/knowledge-center/group-health-insurance/corporate-insurance?utm_source=chatgpt.com) \n\nIt is not necessarily one single policy. A company can combine different types of insurance depending on its size, industry, assets, employees, and specific risks.\n\n### Common Types of Corporate Insurance\n\n  1. Group Health Insurance \u2013 Provides medical coverage to employees and, depending on the plan, their dependants. IRDAI recognizes health insurance as covering medical, surgical, hospital and related benefits. [irdai.gov.in](https://irdai.gov.in/faqs-on-health-insurance-regulations?utm_source=chatgpt.com) \n     \n  2. Property Insurance \u2013 Protects buildings, equipment, inventory and other business property against covered events such as fire, flood or earthquake.\n     \n  3. Public Liability Insurance \u2013 Helps protect a business against covered third-party injury or property-damage claims.\n     \n  4. Professional Indemnity Insurance \u2013 Provides protection against certain claims arising from professional errors, omissions or negligence.\n     \n  5. Group Personal Accident Insurance \u2013 Provides specified benefits when covered employees suffer accidental injury or death.\n     \n  6. Cyber Insurance \u2013 Helps cover certain costs associated with cyber incidents, such as data breaches, recovery and legal expenses. [www.tataaig.com](https://www.tataaig.com/knowledge-center/group-health-insurance/corporate-insurance?utm_source=chatgpt.com) \n     \n  7. Employee/Workers' Compensatio\u2026",

      "response": "In India, group health insurance is generally available to people who belong to a defined group with a common relationship\u2014not simply to anyone who wants to buy a group policy.\n\n### Who is usually eligible?\n\n  1. Employees of an organization  \n     Employees of companies, schools, factories, banks, NGOs, and other organizations can typically be covered under an employer-sponsored group health policy. [irdai.gov.in](https://irdai.gov.in/documents/37343/931203/UIIHLGP21251V022021_2020-2021.pdf/1016f2e6-25fd-7f0e-a426-d71ac3813c48?t=1668590261125&version=1.1&utm_source=chatgpt.com) [irdai.gov.in](https://irdai.gov.in/documents/37343/365525/%E0%A4%9C%E0%A5%80%E0%A4%B5%E0%A4%A8%2B%E0%A4%AC%E0%A5%80%E0%A4%AE%E0%A4%BE%2B%E0%A4%89%E0%A4%A4%E0%A5%8D%E0%A4%AA%E0%A4%BE%E0%A4%A6%E0%A5%8B%E0%A4%82%2B%E0%A4%B8%E0%A4%82%E0%A4%AC%E0%A4%82%E0%A4%A7%E0%A5%80%2B%E0%A4%AE%E0%A4%BE%E0%A4%B8%E0%A5%8D%E0%A4%9F%E0%A4%B0%2B%E0%A4%AA%E0%A4%B0%E0%A4%BF%E0%A4%AA%E0%A4%A4%E0%A5%8D%E0%A4%B0%2B_%2BMaster%2BCircular%2Bon%2BLife%2BInsurance%2BProducts.pdf/d7ca89f3-b894-8c93-3e53-d8caf67a8ba6?t=1733233494424&version=2.1&utm_source=chatgpt.com) \n     \n  2. Family members/dependents of employees  \n     Depending on the policy, coverage may extend to:\n\n * Spouse or partner\n   \n * Dependent children\n   \n * Parents or parents-in-law\n   \n * In some policies, dependent siblings or other specified family members\n\nThe exact age and dependency conditions vary by policy. [irdai.gov.in](https://irdai.gov.in/documents/37343/931203/UIIHLGP21251V022021_2020-2021.pdf/1016f2e6-25fd-7f0e-a426-d71ac3813c48?t=1668590261125&version=1.1&utm_source=chatgpt.com) \n\n  3. Members of certain non-employer groups  \n     IRDAI permits group health insurance for qualifying non-employer groups, such as professional/trade associations, cooperative societies, government agencies, and certain parent groups of school or college students. [irdai.gov.in](https://irdai.gov.in/documents/37343/36       "response": "If you mean group medical insurance provided by an employer , it generally works like a shared health-insurance policy covering employees and, depending on the employer's plan, their spouse, children, and sometimes parents.\n\n### What group medical insurance commonly covers\n\n  * Hospitalisation: Room charges, nursing, ICU, doctor/surgeon fees, medicines, diagnostics, operation-theatre expenses, etc., subject to the policy's limits. [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/HP1617/AMHI_GroupAssuranceHealthPlan.pdf?utm_source=chatgpt.com) \n    \n  * Day-care procedures: Treatments that don't require a traditional 24-hour hospital stay but are covered under the policy.\n    \n  * Pre- and post-hospitalisation expenses: Doctor consultations, tests and medicines for a specified period before and after hospitalisation, if included.\n    \n  * Accidental injuries: Hospital treatment arising from accidents is generally covered, subject to the policy terms.\n    \n  * Specified treatments/add-ons: Employer plans may offer maternity, newborn coverage, domiciliary treatment, OPD, dental/vision benefits, or mental-health-related coverage\u2014but these aren't automatically included in every plan. IRDAI requires insurers to offer products/add-ons addressing a broad range of needs, but the particular employer plan determines what's actually included. [irdai.gov.in](https://irdai.gov.in/health-dept?utm_source=chatgpt.com) \n    \n  * Cashless treatment: At eligible/network hospitals, the insurer may settle admissible expenses directly with the hospital.\n\n### Common exclusions or limitations\n\nThe exact exclusions vary substantially between employer policies, but watch for:\n\n  1. Pre-existing diseases during a waiting period \u2014 although group policies can be more generous than individual policies, you need to check whether your employer's plan waives the waiting period. IRDAI says PED coverage is subject to the policy's terms and waiting period. [irdai.gov.in](https://i\u2026",

      "response": "If you're an employer in India with 10\u201350 employees, a group health insurance (GHI) policy can be one of the most useful employee benefits\u2014but the cheapest policy is often not the best one.\n\nIRDAI permits employer\u2013employee group health insurance products, including one-year renewable group health policies. [irdai.gov.in](https://irdai.gov.in/documents/37343/991022/%E0%A4%85%E0%A4%82%E0%A4%97%E0%A5%8D%E0%A4%B0%E0%A5%87%E0%A4%9C%E0%A5%80%2B-%2B%E0%A4%9C%E0%A5%80%E0%A4%B5%E0%A4%A8%2B%E0%A4%AC%E0%A5%80%E0%A4%AE%E0%A4%BE%2B%E0%A4%89%E0%A4%A4%E0%A5%8D%E0%A4%AA%E0%A4%BE%E0%A4%A6%E0%A5%8B%E0%A4%82%2B%E0%A4%B8%E0%A4%82%E0%A4%AC%E0%A4%82%E0%A4%A7%E0%A5%80%2B%E0%A4%AE%E0%A4%BE%E0%A4%B8%E0%A5%8D%E0%A4%9F%E0%A4%B0%2B%E0%A4%AA%E0%A4%B0%E0%A4%BF%E0%A4%AA%E0%A4%A4%E0%A5%8D%E0%A4%B0%2B_%2BMaster%2BCircular%2Bon%2BLife%2BInsurance%2BProducts%2B-%2BEnglish.pdf/56f5b93b-a7c6-30cf-1734-0537e2d8676d?download=true&t=1733233169949&version=1.0&utm_source=chatgpt.com) \n\n### What employers should know\n\n1\\. There generally isn't a single \"10\u201350 employee\" standard policy.  \nInsurers have their own underwriting rules, minimum group sizes, pricing and eligibility conditions. Some products may accept relatively small groups\u2014for example, an IRDAI-filed group policy specifies a minimum group size of 7\u2014but you need to check the particular insurer/product. [irdai.gov.in](https://irdai.gov.in/documents/37343/931203/UIIHLGP21251V022021_2020-2021.pdf/1016f2e6-25fd-7f0e-a426-d71ac3813c48?t=1668590261125&version=1.1&utm_source=chatgpt.com) \n\n2\\. Decide what you're actually covering.  \nFor a small company, a sensible starting structure might be:\n\n*   Employee: \u20b93\u201310 lakh sum insured\n    \n*   Spouse + children: included\n    \n*   Parents/parents-in-law: optional, often employee-paid\n    \n*   Maternity: include if relevant to your workforce\n    \n*   Newborn coverage: check the exact terms\n    \n*   Room-rent limits: ideally none or generous\n    \n*   No/low co-payment\n    \n*   Minimal disease-specific sub-limits\u2026",

      "response": "If you're an employer in India with 10\u201350 employees, a Group Mediclaim / Group Health Insurance (GHI) policy can be one of the most useful employee benefits\u2014but the cheapest policy is rarely the best one.\n\n### 1\\. First: is Group Mediclaim mandatory?\n\nNo, not generally. Having 10\u201350 employees does not by itself create a statutory obligation to buy a private group mediclaim policy.\n\nHowever, ESI/ESIC is a separate matter. Depending on your establishment, location and employee wages, you may have to register under ESIC. ESIC currently states that covered employees earning up to \u20b921,000/month (\u20b925,000 for persons with disabilities) can fall within coverage, and many establishments have a 10-employee threshold. [www.esic.gov.in](https://www.esic.gov.in/attachments/publicationfile/4bba80675aa61f0e8c9f7f57c155b185.pdf?utm_source=chatgpt.com) \n\nSo don't treat private GHI as a substitute for an applicable ESIC obligation.\n\n### 2\\. Can a 10-person company buy group insurance?\n\nYes, potentially. There is no universal IRDAI rule saying a company must have 20/50 employees to have employer-employee group health insurance. Insurers, however, set their own underwriting/minimum-group requirements.\n\nIRDAI expressly permits employer-employee group health insurance products, including one-year renewable group health policies. [irdai.gov.in](https://irdai.gov.in/documents/37343/365525/%E0%A4%9C%E0%A5%80%E0%A4%B5%E0%A4%A8%2B%E0%A4%AC%E0%A5%80%E0%A4%AE%E0%A4%BE%2B%E0%A4%89%E0%A4%A4%E0%A5%8D%E0%A4%AA%E0%A4%BE%E0%A4%A6%E0%A5%8B%E0%A4%82%2B%E0%A4%B8%E0%A4%82%E0%A4%AC%E0%A4%82%E0%A4%A7%E0%A5%80%2B%E0%A4%AE%E0%A4%BE%E0%A4%B8%E0%A5%8D%E0%A4%9F%E0%A4%B0%2B%E0%A4%AA%E0%A4%B0%E0%A4%BF%E0%A4%AA%E0%A4%A4%E0%A5%8D%E0%A4%B0%2B_%2BMaster%2BCircular%2Bon%2BLife%2BInsurance%2BProducts.pdf/d7ca89f3-b894-8c93-3e53-d8caf67a8ba6?t=1733233494424&version=2.1&utm_source=chatgpt.com) \n\nFor a small company, compare insurers/brokers specifically on their minimum group size, underwriting rules and claims experienc\u2026",

      "response": "If you mean group health insurance provided by an employer in India , it generally works like a regular health insurance policy, but the employer buys one policy covering a group of employees and often their eligible dependants.\n\n### What it commonly covers\n\n  * Hospitalisation expenses \u2014 room charges, ICU, doctor/surgeon fees, medicines, diagnostics, etc., subject to the policy's limits.\n    \n  * Pre- and post-hospitalisation \u2014 medical expenses incurred for a specified number of days before and after hospitalisation.\n    \n  * Day-care procedures \u2014 treatments that don't require a 24-hour hospital stay but are covered under the policy.\n    \n  * Emergency treatment/accidents \u2014 usually covered subject to the policy terms.\n    \n  * Pre-existing diseases \u2014 this is an important advantage of many employer group policies: they may cover pre-existing conditions from the beginning or with fewer restrictions than an individual policy. The exact terms depend on the employer's negotiated policy.\n    \n  * Maternity benefits \u2014 often included in employer policies, sometimes with separate limits or waiting periods.\n    \n  * Newborn/infant cover \u2014 frequently available under maternity benefits, subject to conditions.\n    \n  * Ambulance charges and sometimes domiciliary treatment , depending on the plan.\n    \n  * Cashless treatment at the insurer's network hospitals.\n\nIRDAI-published group-policy documents illustrate that coverage and exclusions can vary considerably between products, so the employer's actual policy wording and benefit schedule matter more than the generic description. [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/Max15/Group%20Health%20Insurance.pdf?utm_source=chatgpt.com) [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/SBI15/Group%20Health%20Insurance%20Policy.pdf?utm_source=chatgpt.com) \n\n### Common exclusions\n\nTypical exclusions include:\n       "response": "Group Mediclaim for Employees is a group health insurance policy provided by an employer to its employees. Instead of each employee buying an individual health policy, the company takes one policy covering a defined group of employees. IRDAI recognizes employer\u2013employee group health insurance as a valid category of group insurance. ([IRDAI](https://irdai.gov.in/health-dept?utm_source=chatgpt.com))\n\n### How it works\n\nFor example, suppose a company provides:\n\n- \u20b95 lakh sum insured per employee\n- Coverage for the employee's spouse and children\n- Optional coverage for parents\n- Cashless treatment at eligible network hospitals\n\nIf an employee is hospitalized for a covered treatment, the insurer pays eligible medical expenses up to the applicable coverage limit, subject to the policy's terms, exclusions, deductibles and sub-limits.\n\n### Key benefits for employees\n\n1. Financial protection  \n   Helps protect employees from large hospitalization and medical bills.\n   \n2. Employer-paid or subsidized premium  \n   In many companies, the employer pays all or a substantial portion of the premium, making the benefit cheaper for employees than buying equivalent individual coverage.\n   \n3. Family coverage  \n   Many corporate plans allow employees to include spouses, children and sometimes parents, although the exact eligibility and premium depend on the employer's policy.\n   \n4. Cashless hospitalization  \n   Where the policy permits it, employees can receive treatment at network hospitals without paying the entire eligible hospital bill upfront.\n   \n5. Potentially broader employer-negotiated coverage  \n   Corporate policies can be customized by the employer. Depending on the plan, they may include features such as maternity benefits, daycare procedures, pre-existing-condition coverage, room-rent provisions and other benefits.\n   \n6. Convenience  \n   Employees generally don't have to individually negotiate or purchase the policy; HR or the insurer/TPA handles enrollment and administr\u2026",

exclusions can materially reduce the practical value of the cover.\n\nIRDAI notes that group health p\u2026",

      "response": "For an Indian startup, the best group medical insurance (GMC) plan is usually not the cheapest plan with the highest headline sum insured. The important question is: what will employees actually receive when they have a serious hospitalization?\n\nHere\u2019s a practical framework for choosing one.\n\n### 1\\. Start with the employee profile\n\nBefore getting quotes, define:\n\n- Number of employees and expected growth over 12\u201324 months\n- Employee age distribution\n- Cities where employees live\n- Whether spouses/children are included\n- Whether parents are included\n- Whether founders/directors are included\n- Expected employee turnover\n- Whether you want maternity coverage\n- Whether you want OPD, dental/vision or wellness benefits\n\nThis matters because a 15-person SaaS startup with mostly 25\u201335-year-olds has a very different risk profile from a 40-person company with employees and parents in multiple cities.\n\n### 2\\. Choose the sum insured carefully\n\nAs a starting point, I'd generally compare \u20b95 lakh, \u20b910 lakh and \u20b915 lakh per employee/family, rather than automatically accepting a \u20b92\u20133 lakh plan.\n\nMedical costs are rising quickly in India; recent reporting puts medical inflation around 12\u201314% annually, which makes low limits increasingly easy to exhaust. ([Reuters](https://www.reuters.com/legal/litigation/india-plans-insurance-reforms-rein-healthcare-costs-sources-say-2026-08-12/?utm_source=chatgpt.com))\n\nA useful structure for a cost-conscious startup can be:\n\n\u20b95\u201310 lakh base GMC + optional employee-paid top-up\n\nThat can be more economical than giving everyone a very large base policy.\n\n### 3\\. Look beyond the \u20b910 lakh headline\n\nThese are the clauses I'd scrutinize most closely:\n\n|Feature|What I'd look for|\n|---|---|\n|Room rent|Preferably no restrictive room-rent cap|\n|ICU|No low sub-limit|\n|Co-pay|Ideally 0% for employees|\n|Disease sub-limits|Avoid restrictive caps|\n|Pre-existing diseases|Day-one coverage is highly valuable|\n|Waiting periods|Minimize/eliminate where possible|\n|Pre\u2026",

      "response": "Yes \u2014 group health insurance in India can cover physiotherapy, but it depends on the specific employer/group policy. There is no blanket rule that every group health policy covers all physiotherapy expenses. IRDAI says coverage depends on the policy\u2019s terms, exclusions, limits and whether OPD/homecare/day-care benefits are included. ([IRDAI](https://irdai.gov.in/health-dept?utm_source=chatgpt.com))\n\n### When physiotherapy is commonly covered\n\n- After hospitalization: Physiotherapy prescribed as part of recovery from surgery, fracture, injury, etc. is often covered under post-hospitalization expenses, subject to the policy's time limit and sub-limits.\n- Before hospitalization: It may be covered if the policy specifically includes pre-hospitalization expenses and the physiotherapy is medically necessary.\n- OPD physiotherapy: This is not automatically covered. Your group policy needs to have an OPD/physiotherapy benefit or a relevant rider.\n- Home physiotherapy: Some policies cover it under homecare/domiciliary benefits, but again, this depends on the wording.\n\nFor example, an IRDAI-hosted group policy wording explicitly included medically necessary, doctor-advised physiotherapy within its pre- and post-hospitalization benefits. ([IRDAI](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/HP1617/MBHI-GroupHealthSecure.pdf?utm_source=chatgpt.com))\n\n### What to check in your employer policy\n\nLook in the Group Mediclaim Policy / Policy Wordings / Customer Information Sheet for:\n\n1. Physiotherapy\n2. Pre- and post-hospitalization expenses\n3. OPD treatment\n4. Rehabilitation\n5. Home healthcare\n6. Sub-limit per session/day or annual limit\n7. Whether a doctor's prescription is required\n8. Whether treatment must be at a network provider\n\nIf you tell me the name of your insurer and your employer's group health plan (e.g., Star Health, HDFC ERGO, ICICI Lombard, New India, etc.), I can look up the specific policy wording and tell you whether physiotherapy is covered and under what \u2026",

r a major hospitalization or for a family with several members. \u2026",

sufficient\n\n * A \u20b92\u20135 lakh group cover can sound reasonable but may b\u2026",

      "response": "In India, group health insurance typically costs an employer around \u20b94,000\u2013\u20b920,000 per employee per year, but the range can be much wider depending on coverage and employee demographics. Current 2026 market estimates put it roughly as follows: [www.plumhq.com](https://www.plumhq.com/blog/employee-health-insurance-cost-per-employee-india?utm_source=chatgpt.com) \n\n|Typical plan|Approx. annual premium / employee|\n|---|---|\n|\u20b93\u20135 lakh, employee-only|\u20b94,000\u2013\u20b99,000|\n|\u20b95\u201310 lakh, employee + family|\u20b99,000\u2013\u20b918,000|\n|\u20b910 lakh+, family + maternity/OPD etc.|\u20b918,000\u2013\u20b930,000+|\n|Basic SME plan|\u20b94,000\u2013\u20b97,000|\n\nFor example, for 100 employees:\n\n*   Basic \u20b95 lakh cover: roughly \u20b95\u20139 lakh/year\n    \n*   Good mid-range family cover: roughly \u20b99\u201318 lakh/year\n    \n*   Comprehensive cover: \u20b918\u201330 lakh+/year\n    \n\nA separate FY2024\u201325 market estimate shows metro companies paying approximately \u20b914,000\u2013\u20b927,000 per employee for employee-only coverage, depending on company size, illustrating how much the employee profile and policy design can change the quote. [assets-eu.researchsquare.com](https://assets-eu.researchsquare.com/files/rs-7877923/v1_covered_8de8a966-1cd1-4772-b1ee-9592d96b6aac.pdf?c=1760930363&utm_source=chatgpt.com) \n\n### What drives the price most?\n\n1.  Sum insured \u2014 \u20b93 lakh vs \u20b95 lakh vs \u20b910 lakh.\n    \n2.  Who is covered \u2014 employee only vs spouse/kids vs parents.\n    \n3.  Average employee age \u2014 older groups cost substantially more.\n    \n4.  Maternity coverage and limits.\n    \n5.  Pre-existing disease coverage / waiting periods.\n    \n6.  OPD, dental, vision and mental-health benefits.\n    \n7.  Previous claims history of the company.\n    \n8.  Number of employees \u2014 larger groups can generally negotiate better rates. [www.zurichkotak.com](http ies|Government employee/member or other defined be\u2026",

      "response": "Group medical insurance in India is a health-insurance policy purchased for a group of people\u2014most commonly employees of a company. Instead of every employee buying a separate policy, the employer takes a group health insurance policy from an insurer and employees become members/insured persons under that policy. IRDAI permits group health insurance products for employer\u2013employee groups. [irdai.gov.in](https://irdai.gov.in/documents/37343/365525/%E0%A4%9C%E0%A5%80%E0%A4%B5%E0%A4%A8%2B%E0%A4%AC%E0%A5%80%E0%A4%AE%E0%A4%BE%2B%E0%A4%89%E0%A4%A4%E0%A5%8D%E0%A4%AA%E0%A4%BE%E0%A4%A6%E0%A5%8B%E0%A4%82%2B%E0%A4%B8%E0%A4%82%E0%A4%AC%E0%A4%82%E0%A4%A7%E0%A5%80%2B%E0%A4%AE%E0%A4%BE%E0%A4%B8%E0%A5%8D%E0%A4%9F%E0%A4%B0%2B%E0%A4%AA%E0%A4%B0%E0%A4%BF%E0%A4%AA%E0%A4%A4%E0%A5%8D%E0%A4%B0%2B_%2BMaster%2BCircular%2Bon%2BLife%2BInsurance%2BProducts.pdf/d7ca89f3-b894-8c93-3e53-d8caf67a8ba6?t=1733233494424&version=2.1&utm_source=chatgpt.com) [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/Max15/Group%20Health%20Insurance.pdf?utm_source=chatgpt.com) \n\n### How it works\n\nA typical employer-sponsored plan works like this:\n\n  1. Company buys the policy  \n     The employer negotiates with an insurer and chooses the coverage\u2014say \u20b95 lakh per employee, hospitalisation benefits, maternity, etc.\n     \n  2. Employees are enrolled  \n     Eligible employees are added to the policy. Depending on the plan, their spouse, children, parents or parents-in-law may also be included. The exact eligible family members depend on the policy terms. [irdai.gov.in](https://irdai.gov.in/documents/37343/931203/UIIHLGP21251V022021_2020-2021.pdf/1016f2e6-25fd-7f0e-a426-d71ac3813c48?t=1668590261125&version=1.1&utm_source=chatgpt.com) \n     \n  3. Employer pays the premium  \n     Often the employer pays the entire premium. Some companies pay for employee coverage but let employees pay an additional amount to cover parents or other dependants.\n     \n  4. You receive a health-insurance card/certificate \u2026",

      "response": "If you mean group health/mediclaim insurance provided by an employer in India , a reasonable 2026 budgeting range is:\n\nCoverage\\| Approx. annual premium / employee  \n\\---\\|---  \nBasic \u20b92\u20133 lakh\\| \u20b93,000\u2013\u20b97,000  \nStandard \u20b93\u20135 lakh\\| \u20b97,000\u2013\u20b912,000  \nMid-tier \u20b95\u201310 lakh\\| \u20b912,000\u2013\u20b918,000  \nComprehensive \u20b910 lakh+ with add-ons\\| \u20b918,000\u2013\u20b930,000+\n  \nThese are market estimates; actual quotes vary substantially with employee age, company size, location, claims history, dependants, and benefits such as maternity, OPD and parent coverage. [www.onsurity.com](https://www.onsurity.com/blog/group-health-insurance-cost-per-employee-in-india/?utm_source=chatgpt.com) [www.wisemonk.io](https://www.wisemonk.io/blogs/group-health-insurance-india?utm_source=chatgpt.com) \n\nFor budgeting purposes, I'd use \u20b98,000\u2013\u20b915,000 per employee/year for a fairly normal corporate plan with around \u20b93\u20135 lakh coverage. For example, 100 employees would mean roughly \u20b98\u201315 lakh/year before any applicable taxes/fees.\n\nIf you tell me (1) number of employees, (2) average age, (3) desired cover\u2014\u20b93L/\u20b95L/\u20b910L, and (4) whether spouse/children/parents should be included , I can estimate a much more realistic per-employee premium for your company.",

y or use an IRDAI-licensed insurance broker/corporate agent. Ask for the same benefi\u2026",

      "response": "Yes. An employer in India can generally claim the premium paid for a group mediclaim/health-insurance policy for its employees as a business deduction.\n\n### Employer's tax treatment\n\nUnder Section 36(1)(ib) of the Income-tax Act, the premium paid by an employer to provide health insurance for employees is specifically deductible, provided:\n\n*   the insurance covers the health of employees;\n    \n*   the policy is under a scheme approved by the Central Government or IRDAI; and\n    \n*   the premium is paid through a mode other than cash. [www.incometaxindia.gov.in](https://www.incometaxindia.gov.in/w/section-36-58?utm_source=chatgpt.com) \n    \n\nSo, for example, if a company pays \u20b910 lakh toward an employee group health insurance policy, that \u20b910 lakh can generally be claimed as a deductible business expense, subject to the applicable conditions.\n\n### What about the employee?\n\nThis is separate from the company's deduction. An employer-paid group health insurance premium is generally not treated as a taxable perquisite in the employee's hands when it falls within the prescribed health-insurance exemption. The Income Tax Department specifically states that employer-paid health-insurance premiums under an approved scheme are tax-exempt for the employee. [www.incometaxindia.gov.in](https://www.incometaxindia.gov.in/en/income-from-salary?utm_source=chatgpt.com) \n\nHowever, the employee generally cannot also claim the employer-paid premium under Section 80D, because the employee hasn't personally borne that premium.\n\n### One important distinction\n\nIf the company provides coverage for employees' parents/family members, the tax treatment can become more nuanced, particularly where the employee contributes toward the additional premium. The exact accounting and tax treatment should be checked based on who bears the premium and how the policy is structured.\n\nIf you tell me whether you're asking about (1) corporate income-tax deduction, (2) GST input-tax credit on the mediclaim pre\u2026",

      "response": "In India, group medical insurance generally means a health insurance policy covering a defined group of people under one master policy. IRDAI permits insurers to offer group health products on both indemnity and benefit bases. [irdai.gov.in](https://irdai.gov.in/health-dept?utm_source=chatgpt.com) [irdai.gov.in](https://irdai.gov.in/web/guest/circulars?filterDepartment=HLT&filtersApplied=true&utm_source=chatgpt.com) \n\n### Main types of group medical insurance\n\nType\\| Who is covered?\\| Typical use  \n\\---\\|---\\|---  \n1\\. Employer\u2013Employee Group Mediclaim (GMC)\\|  Employees of a company\\| Corporate employee health benefits  \n2\\. Group Family Floater\\|  Employee + eligible dependents\\| Covers spouse, children and sometimes parents  \n3\\. Group Health Insurance with Parent Cover\\|  Employees + parents/in-laws\\| Employer benefit where parents can be added  \n4\\. Group Personal Accident (GPA)\\|  Employees/members of a group\\| Accident-related death, disability and sometimes medical expenses  \n5\\. Group Top-Up / Super Top-Up\\|  Members already having base group cover\\| Increases protection beyond the employer's basic sum insured  \n6\\. Group Critical Illness\\|  Employees/group members\\| Pays a predefined lump sum upon diagnosis of specified critical illnesses  \n7\\. Group Hospital Cash / Benefit Plans\\|  Employees/group members\\| Fixed daily or event-based cash benefit during hospitalization  \n8\\. Association/Affinity Group Health Plans\\|  Members of an eligible association or organisation\\| Professional associations, institutions, member organisations, etc.\n  \n### Another important classification\n\nGroup health plans can also be divided by how claims are paid :\n\n  * Indemnity: reimburses eligible actual medical expenses up to the sum insured.\n    \n  * Benefit: pays a predetermined lump sum when the insured event occurs, irrespective of the actual hospital bill. [irdai.gov.in](https://irdai.gov.in/health-dept?utm_source=chatgpt.com) \n\n### For an employee, the most common structu\u2026",

rporate agent. Give them:\n   - Company name and industry\n   - Number \u2026",

      "vol": 10,

      "brands": [],
      "response": "In India, group insurance schemes are policies that cover a defined group of people under a common master policy\u2014most commonly employees of an organisation. The main types are:\n\n|Group insurance scheme|What it covers|Typical beneficiaries|\n|---|---|---|\n|1\\. Group Health Insurance (GHI)|Hospitalisation and medical expenses, often with options for maternity, parents, OPD, etc.|Employees and sometimes dependants|\n|2\\. Group Term Life Insurance (GTL)|Pays a lump sum to the nominee if an insured employee dies during the policy term|Employees|\n|3\\. Group Personal Accident (GPA)|Accidental death and specified permanent/temporary disabilities|Employees|\n|4\\. Group Gratuity Insurance|Helps employers fund gratuity liabilities payable to eligible employees|Employees covered under employer's gratuity arrangement|\n|5\\. Group Superannuation/Pension Scheme|Provides retirement or pension-related benefits|Employees|\n|6\\. Group Travel Insurance|Covers employees travelling for business, including certain medical and travel-related risks|Employees travelling domestically/internationally|\n|7\\. Group Credit Life Insurance|Covers outstanding loan liability on specified events, particularly death of the borrower|Borrowers/members of a lending group|\n|8\\. Group Critical Illness / Group Benefit Covers|Pays a predetermined amount on diagnosis of specified critical illnesses, depending on policy terms|Employees/members|\n|9\\. Group Loan Protection / Asset-related Covers|Protects a lender or group against specified risks associated with loans/assets|Borrowers, lenders or members|\n\n### 1\\. Group Health Insurance\nThis is probably the most common employer-sponsored group insurance in India. An employer purchases one policy covering a defined employee group, and the cover may be extended to spouses, children and/or parents.\n\nHealth insurance can broadly be indemnity-based (reimburses eligible medical expenses) or benefit-based (pays a predetermined amount when the insured event occurs). IRDAI confi\u2026",

      "response": "For an Indian startup, the right group health insurance (GHI) plan is less about finding the cheapest premium and more about balancing employee coverage, claims experience, flexibility, and cost predictability.\n\nIRDAI permits employer\u2013employee group health products, including one-year renewable group health insurance. ([IRDAI](https://irdai.gov.in/documents/37343/365525/%E0%A4%9C%E0%A5%80%E0%A4%B5%E0%A4%A8%2B%E0%A4%AC%E0%A5%80%E0%A4%AE%E0%A4%BE%2B%E0%A4%89%E0%A4%A4%E0%A5%8D%E0%A4%AA%E0%A4%BE%E0%A4%A6%E0%A5%8B%E0%A4%82%2B%E0%A4%B8%E0%A4%82%E0%A4%AC%E0%A4%82%E0%A4%A7%E0%A5%80%2B%E0%A4%AE%E0%A4%BE%E0%A4%B8%E0%A5%8D%E0%A4%9F%E0%A4%B0%2B%E0%A4%AA%E0%A4%B0%E0%A4%BF%E0%A4%AA%E0%A4%A4%E0%A5%8D%E0%A4%B0%2B_%2BMaster%2BCircular%2Bon%2BLife%2BInsurance%2BProducts.pdf/d7ca89f3-b894-8c93-3e53-d8caf67a8ba6?t=1733233494424&version=2.1&utm_source=chatgpt.com))\n\n### 1\\. Start with your employee profile\n\nBefore asking insurers for quotes, define:\n\n- Number of employees now and expected headcount in 12\u201324 months\n- Employee age distribution\n- Locations/cities where employees live\n- Whether you want employee-only or employee + spouse/children/parents\n- Whether founders/directors should have the same cover\n- Your annual benefits budget per employee\n\nFor a startup, I'd usually make employee + spouse + dependent children the core benefit and consider parents/parents-in-law as optional employee-paid or partially subsidized cover. Adding parents can substantially increase premiums.\n\n### 2\\. Decide the sum insured carefully\n\nA common mistake is choosing \u20b93\u20135 lakh simply because it's inexpensive.\n\nFor a modern startup workforce, I'd compare at least:\n\n|Option|When it makes sense|\n|---|---|\n|\u20b95 lakh|Tight budget / very small team|\n|\u20b97.5\u201310 lakh|Stronger mainstream employee benefit|\n|\u20b910\u201315 lakh|Higher-paying tech/professional workforce|\n|Base + super top-up|Good way to control premium while offering higher protection|\n\nDon't evaluate the headline sum insured alone. A \u20b910 lakh policy with restri\u2026",

      "response": "In India, group insurance is insurance that an employer buys for a defined group of employees\u2014usually as part of the employee benefits package. The employer is typically the master policyholder , while employees (and sometimes their dependants) are the insured members.\n\nIRDAI expressly permits employer\u2013employee group products including group term life, group health, group personal accident-related products, and certain other group insurance products. [irdai.gov.in](https://irdai.gov.in/documents/37343/365525/%E0%A4%9C%E0%A5%80%E0%A4%B5%E0%A4%A8%2B%E0%A4%AC%E0%A5%80%E0%A4%AE%E0%A4%BE%2B%E0%A4%89%E0%A4%A4%E0%A5%8D%E0%A4%AA%E0%A4%BE%E0%A4%A6%E0%A5%8B%E0%A4%82%2B%E0%A4%B8%E0%A4%82%E0%A4%AC%E0%A4%82%E0%A4%A7%E0%A5%80%2B%E0%A4%AE%E0%A4%BE%E0%A4%B8%E0%A5%8D%E0%A4%9F%E0%A4%B0%2B%E0%A4%AA%E0%A4%B0%E0%A4%BF%E0%A4%AA%E0%A4%A4%E0%A5%8D%E0%A4%B0%2B_%2BMaster%2BCircular%2Bon%2BLife%2BInsurance%2BProducts.pdf/d7ca89f3-b894-8c93-3e53-d8caf67a8ba6?t=1733233494424&version=2.1&utm_source=chatgpt.com) \n\n### 1\\. How it works\n\nA typical arrangement looks like this:\n\nEmployer \u2192 Insurance company \u2192 Employees/dependants\n\n  1. Employer selects a policy\n\n * Decides which employees are eligible.\n   \n * Chooses coverage amounts and benefits.\n   \n * Negotiates the premium with the insurer.\n\n  2. Employer pays the premium\n\n * It can pay 100% of the premium , or\n   \n * the employee can contribute part of it, particularly for dependant coverage or additional benefits.\n\n  3. Employees are enrolled\n\n * The insurer receives employee/member information.\n   \n * Employees receive an insurance certificate/e-card or access to the insurer's portal.\n\n  4. Employee uses the insurance\n\n * For health insurance, for example, the employee can generally use cashless hospitalisation at network hospitals or submit a reimbursement claim, subject to the policy terms.\n\n  5. Employer administers the group\n\n * New employees can be added.\n   \n * Employees leaving the company are removed.\n   \n * Changes are reported to the\u2026",

shless hospital in the insurer's network, subject to the p\u2026",

      "response": "*   In India, group insurance is insurance purchased by a group or organization under a master policy, with individual members covered under it. Common types include:\n    \n    |Type of group insurance|What it covers|Typical users|\n    |---|---|---|\n    |1\\. Group Health Insurance|Hospitalisation, medical expenses, daycare treatments, etc., depending on the policy|Employers, associations, institutions|\n    |2\\. Group Term Life Insurance|Pays a death benefit to the nominee if an insured member dies during the policy term|Employers and employee groups|\n    |3\\. Group Personal Accident (GPA)|Accidental death and disability; may also include accident-related medical expenses|Companies, associations, banks, schools|\n    |4\\. Group Critical Illness Insurance|Lump-sum benefit on diagnosis of specified critical illnesses|Employers/employee groups|\n    |5\\. Group Credit Life Insurance|Helps cover an outstanding loan if the insured borrower dies|Banks, NBFCs and lending institutions|\n    |6\\. Group Travel Insurance|Covers specified travel-related risks for members travelling together|Corporate/business groups, institutions|\n    |7\\. Group Annuity / Retirement Plans|Provides retirement or pension-related benefits to a group|Employers and employee groups|\n    |8\\. Group Microinsurance|Low-cost insurance designed for specified lower-income/homogeneous groups|Cooperatives, associations and other eligible groups|\n    |9\\. Government-sponsored Group Insurance|Insurance benefits provided under government-sponsored schemes|Eligible government-defined groups|\n    \n    IRDAI's current life-insurance product framework specifically permits several of these categories, including group term, group fund-based, group credit life, group health, group annuity, microinsurance and government-sponsored group insurance. It also distinguishes employer\u2013employee groups from non-employer homogeneous groups. I IRDAI\n    \n    ### For employees, the most common combination\n    \n    If you're asking from a\u2026",

      "prompt": "group insurance scheme for startups in India: how to choose the right plan?",
      "vol": 10,
      "mentioned": false,
      "cited": false,
      "brands": [],
      "response": "If by group insurance you mean employee health insurance (Group Mediclaim/GHI), the right plan for an Indian startup is usually the one that balances meaningful employee coverage, predictable cost, and easy claims administration \u2014not simply the lowest premium.\n\nIRDAI\u2019s current framework is important here; its 2024 Master Circular on Health Insurance Business sets the regulatory baseline for health policies. [Circulars - IRDAI](https://irdai.gov.in/web/guest/circulars?filterDepartment=HLT&filtersApplied=true&utm_source=chatgpt.com)\n\n### 1\\. Start with your employee profile\n\nBefore asking insurers for quotes, decide:\n\n  * Number of employees and expected hiring over the next 12\u201324 months\n    \n  * Average employee age\n    \n  * Employee-only vs employee + spouse + children vs parents\n    \n  * Locations employees are based in\n    \n  * Whether you have senior employees/founders who need higher coverage\n    \n  * Whether you want to cover contractors/consultants\n\nFor a young startup, employee + spouse + children is often a sensible core benefit. Adding parents can materially increase premiums, so consider making parental cover an optional employee-paid/top-up benefit.\n\n### 2\\. Decide the sum insured\n\nFor many startups, I'd evaluate \u20b95\u201310 lakh per employee/family as the starting range rather than choosing a very low \u20b92\u20133 lakh cover simply to minimise premium.\n\nMore important than the headline sum insured are the sub-limits and exclusions.\n\nLook closely at:\n\nFeature\\| What I'd look for  \n\\---\\|---  \nRoom rent\\| No restrictive room-rent cap  \nICU\\| No restrictive sub-limit  \nPre-existing diseases\\| Minimal waiting period / favourable group terms  \nDisease-specific limits\\| Few or none  \nCo-pay\\| Ideally 0%  \nDay-care procedures\\| Broad coverage  \nModern treatments\\| Broad coverage  \nMaternity\\| Useful if workforce needs it  \nNewborn cover\\| Important if maternity is included  \nAmbulance\\| Reasonable limit  \nNetwork hospitals\\| Strong in employees' actual cities  \nRestoration/r\u2026",

      "response": "*   In India, group medical insurance\u2014usually called Group Health Insurance (GHI) or Group Mediclaim\u2014is a health insurance policy that an employer buys for a defined group of employees and, often, their eligible dependants.\n    \n    IRDAI specifically recognizes employer\u2013employee group health insurance products, including renewable group health policies. I IRDAI\n    \n    ### How it works\n    \n    Think of it as a company buying one large health-insurance policy for its workforce, rather than every employee buying an individual policy.\n    \n    Example:\n    \n    A company has 100 employees and buys a group policy with:\n    \n    *   \u20b95 lakh sum insured per employee\n    *   Employee + spouse + 2 children covered\n    *   Cashless hospitalization\n    *   \u20b910 lakh maternity sub-limit\n    *   No employee premium contribution\n    \n    The company pays the insurer a premium for the group. If an employee later has a covered hospitalization costing \u20b93 lakh, the insurer pays the eligible claim (subject to the policy's terms and limits).\n    \n    ### The main parties\n    \n    |Party|What they do|\n    |---|---|\n    |Employer|Buys the policy and generally pays the premium|\n    |Insurer|Provides the insurance and settles eligible claims|\n    |Employee|Gets coverage under the group policy|\n    |TPA|Often handles cashless authorization and claims administration|\n    |Broker|Often helps the employer compare insurers, negotiate terms and administer the policy|\n    \n    The employer is generally the master policyholder, while employees and eligible family members are insured members.\n    \n    ### What determines the premium?\n    \n    The insurer doesn't simply charge a fixed amount per employee. Pricing can depend on things such as:\n    \n    *   Number of employees\n    *   Employee age distribution\n    *   Employee/dependant demographics\n    *   Sum insured\n    *   Previous year's claims\n    *   Benefits selected\n    *   Maternity coverage\n    *   Location/geographical spread\n    *   Ro\u2026",

ate the total annual premium and per-employee cost for your company.",

nt\n        \n    *   AYUSH treatment\n        \n    *   Home/domiciliary treatment\n        \n    *   Cataract limits\n\u2026",

      "response": "*   Group medical insurance\u2014often called Group Health Insurance (GHI) or Group Mediclaim\u2014is a health policy an employer provides to its employees, often with the option to cover eligible family members. In India, group health insurance is a recognized employer\u2013employee insurance arrangement under IRDAI\u2019s framework. I IRDAI+1\n    \n    ### Key benefits for employees\n    \n    1.  Financial protection against medical expenses  \n        It can cover eligible hospitalization and treatment costs, reducing the financial burden of a major illness, surgery, or accident. Typical policies may cover hospital accommodation, doctor fees, surgery, diagnostics, medicines, etc., subject to the policy terms. I IRDAI\n        \n    2.  Employer usually pays the premium  \n        In many companies, the employee gets basic coverage without paying the full premium personally. This makes health insurance accessible even to employees who might not otherwise purchase an individual policy.\n        \n    3.  Family/dependent coverage  \n        Employers can allow employees to add spouses, children, and sometimes parents or parents-in-law, depending on the plan and company rules.\n        \n    4.  Cashless treatment  \n        Where the insurer has a network arrangement, employees may be able to receive cashless treatment at eligible hospitals, subject to authorization and policy conditions. IRDAI specifically advises checking the eligible hospital/network list when evaluating health insurance. I IRDAI\n        \n    5.  Potentially broader coverage than an individual policy  \n        Corporate plans can be negotiated by the employer and may include benefits such as maternity coverage, daycare procedures, wellness programs, or other add-ons. The exact benefits vary significantly between policies.\n        \n    6.  Employee peace of mind  \n        Knowing that a significant medical bill may be covered can reduce financial stress and help employees focus on recovery rather than worrying about treatment c\u2026",

      "prompt": "Pros and cons of group health insurance policy",
      "vol": 10,
      "mentioned": false,
      "cited": false,
      "brands": [],
      "response": "If you mean an employer-provided group health insurance policy in India, it has several advantages, but it is usually best viewed as a supplement rather than your only health insurance.\n\n### Pros\n\n1. Low or no premium for employees  \n   Employers often pay most or all of the premium, making it an inexpensive way to get health cover.\n   \n2. Pre-existing diseases may be covered from day one  \n   Group policies can offer coverage for pre-existing conditions without the long waiting periods commonly found in individual policies. ([Ditto](https://joinditto.in/articles/health-insurance/disadvantages-of-group-health-insurance/?utm_source=chatgpt.com))\n   \n3. Usually easier to obtain  \n   Individual underwriting and medical tests may be less of an issue because the policy covers a group.\n   \n4. Family members can often be added  \n   Depending on the employer's plan, spouse, children and sometimes parents can be covered.\n   \n5. Cashless hospitalisation  \n   If the hospital is in the insurer's network, eligible treatment can generally be handled through cashless claims.\n   \n6. Useful additional protection  \n   It can significantly reduce your out-of-pocket medical expenses, particularly when combined with an individual policy.\n\n### Cons\n\n1. Coverage is linked to your job  \n   The biggest drawback is that you may lose the cover when you resign, retire or otherwise leave the employer. ([Ditto](https://joinditto.in/articles/health-insurance/disadvantages-of-group-health-insurance/?utm_source=chatgpt.com))\n   \n2. Limited control over the policy  \n   Your employer decides the insurer, sum insured, benefits and many policy terms. These can change at renewal.\n   \n3. Coverage may be inadequate  \n   A \u20b93\u20135 lakh cover, for example, can be quickly exhausted by a major hospitalisation, particularly given rising medical costs. ([Express Healthcare](https://www.expresshealthcare.in/news/what-the-workforce-in-tier-2-3-cities-should-know-about-health-insurance/454576/?utm_source=chatgpt.com)\u2026",
      "citedPages": []
    },
