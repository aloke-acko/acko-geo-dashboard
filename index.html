<!DOCTYPE html>
<html lang="en" data-variant="editorial">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ACKO GMC AI Visibility Dashboard</title>
<style>
/* ==========================================================================
   ACKO GEO Dashboard — Design System
   Three variants on a shared dark base. Switch via [data-variant] on <html>.
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* ACKO purple anchor */
  --acko-50:  #f3f0ff;
  --acko-100: #e6dfff;
  --acko-200: #cdbcff;
  --acko-300: #b39aff;
  --acko-400: #9577ff;
  --acko-500: #7c5cff;   /* primary */
  --acko-600: #6a47f0;
  --acko-700: #5734d4;
  --acko-800: #4527a8;
  --acko-900: #2f1c75;
  --acko-orange: #FF6B00;

  /* Neutrals — deep ink */
  --ink-0:  #06060c;
  --ink-1:  #0a0a14;
  --ink-2:  #0f0f1c;
  --ink-3:  #141425;
  --ink-4:  #1c1c30;
  --ink-5:  #25253d;
  --ink-6:  #34344f;
  --ink-7:  #4a4a6a;

  --fg-0:  #ffffff;
  --fg-1:  #e8e8f5;
  --fg-2:  #b8b8d0;
  --fg-3:  #8a8aa8;
  --fg-4:  #5e5e80;

  --good: #4ade80;
  --bad:  #ff6470;
  --warn: #ffb547;
  --info: #5aa9ff;

  --radius-sm: 6px;
  --radius:    10px;
  --radius-lg: 16px;
  --radius-xl: 22px;

  /* Typography defaults (overridden per variant) */
  --font-sans: 'Geist', -apple-system, system-ui, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --font-display: 'Geist', sans-serif;

  --tracking-tight: -0.02em;
  --tracking-normal: 0;
  --tracking-wide: 0.08em;

  /* Card surface defaults */
  --surface: var(--ink-2);
  --surface-2: var(--ink-3);
  --surface-3: var(--ink-4);
  --border: rgba(255,255,255,0.06);
  --border-strong: rgba(255,255,255,0.12);

  --shadow-sm: 0 1px 2px rgba(0,0,0,0.35);
  --shadow:    0 8px 24px rgba(0,0,0,0.4);
  --shadow-lg: 0 24px 60px rgba(0,0,0,0.5);
}

html, body {
  background: var(--ink-0);
  color: var(--fg-1);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* =========================================================================
   VARIANT A — EDITORIAL (default)
   Confident, generous, large display type, subtle gradient washes.
   ========================================================================= */
[data-variant="editorial"] {
  --surface: #0d0d18;
  --surface-2: #14142a;
  --surface-3: #1a1a36;
  --border: rgba(124,92,255,0.10);
  --border-strong: rgba(124,92,255,0.22);
  --font-display: 'Instrument Serif', 'Geist', serif;
}
[data-variant="editorial"] body {
  background:
    radial-gradient(1200px 600px at 0% -10%, rgba(124,92,255,0.18), transparent 60%),
    radial-gradient(900px 500px at 100% 110%, rgba(106,71,240,0.10), transparent 60%),
    var(--ink-0);
  background-attachment: fixed;
}

/* =========================================================================
   VARIANT B — TERMINAL (dense, monospace, hairline rules)
   ========================================================================= */
[data-variant="terminal"] {
  --surface: #08080f;
  --surface-2: #0c0c18;
  --surface-3: #11111f;
  --border: rgba(255,255,255,0.08);
  --border-strong: rgba(124,92,255,0.35);
  --font-sans: 'Geist Mono', ui-monospace, monospace;
  --font-display: 'Geist Mono', monospace;
  --radius: 2px;
  --radius-sm: 0;
  --radius-lg: 4px;
  --radius-xl: 4px;
}
[data-variant="terminal"] body {
  background: var(--ink-0);
}
[data-variant="terminal"] .card { box-shadow: none; }

/* =========================================================================
   VARIANT C — GLOW (soft glassy cards, purple aura)
   ========================================================================= */
[data-variant="glow"] {
  --surface: rgba(20,20,38,0.7);
  --surface-2: rgba(28,28,52,0.7);
  --surface-3: rgba(36,36,68,0.7);
  --border: rgba(255,255,255,0.06);
  --border-strong: rgba(124,92,255,0.4);
  --radius: 18px;
  --radius-lg: 24px;
  --radius-xl: 28px;
}
[data-variant="glow"] body {
  background:
    radial-gradient(900px 500px at 15% 0%, rgba(124,92,255,0.25), transparent 55%),
    radial-gradient(800px 600px at 85% 100%, rgba(60,40,180,0.20), transparent 55%),
    radial-gradient(600px 400px at 50% 50%, rgba(124,92,255,0.06), transparent 60%),
    #050510;
  background-attachment: fixed;
}
[data-variant="glow"] .card {
  backdrop-filter: blur(20px) saturate(140%);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
  background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
  border: 1px solid var(--border);
  box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 30px 60px -20px rgba(0,0,0,0.6);
}
[data-variant="glow"] .kpi { position: relative; overflow: hidden; }
[data-variant="glow"] .kpi::after {
  content: ""; position: absolute; inset: -1px; border-radius: inherit; pointer-events: none;
  background: radial-gradient(400px 200px at var(--mx, 50%) 0%, rgba(124,92,255,0.18), transparent 60%);
}

/* =========================================================================
   APP SHELL
   ========================================================================= */
.app {
  display: grid;
  grid-template-columns: 208px minmax(0, 1fr);
  min-height: 100vh;
}
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: relative; height: auto; }
}
.sidebar {
  position: sticky; top: 0; height: 100vh;
  border-right: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(124,92,255,0.04), transparent 40%), var(--ink-1);
  display: flex; flex-direction: column;
  padding: 22px 16px;
  z-index: 5;
}
[data-variant="terminal"] .sidebar { background: var(--ink-1); }
[data-variant="glow"] .sidebar {
  background: linear-gradient(180deg, rgba(124,92,255,0.08), rgba(0,0,0,0.4));
  backdrop-filter: blur(14px);
}

.sidebar-brand {
  display: flex; align-items: center; gap: 10px;
  padding: 4px 6px 22px 6px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}
.sidebar-brand .acko-wordmark {
  height: 28px; width: auto; display: block;
  color: var(--fg-0);
}
.src-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--fg-2);
  white-space: nowrap;
}

.nav-section {
  margin-bottom: 18px;
}
.nav-section-label {
  text-transform: uppercase; letter-spacing: 0.12em; font-size: 10px;
  color: var(--fg-4); padding: 0 8px 6px; font-weight: 600;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 8px;
  color: var(--fg-2); font-size: 13px; cursor: pointer;
  user-select: none;
  border: 1px solid transparent;
  transition: background .15s ease, color .15s ease, border-color .15s ease;
  white-space: nowrap;
}
.nav-item > span:first-of-type { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.nav-item:hover { background: rgba(255,255,255,0.04); color: var(--fg-1); }
.nav-item.active {
  background: linear-gradient(180deg, rgba(124,92,255,0.16), rgba(124,92,255,0.06));
  color: var(--fg-0);
  border-color: rgba(124,92,255,0.25);
}
.nav-item svg { width: 16px; height: 16px; flex: 0 0 16px; opacity: 0.85; }
.nav-item .badge {
  margin-left: auto; font-size: 10px; padding: 2px 6px; border-radius: 999px;
  background: rgba(124,92,255,0.18); color: var(--acko-200);
  font-family: var(--font-mono); font-weight: 600;
}

.sidebar-footer {
  margin-top: auto;
  padding: 12px;
  border-top: 1px solid var(--border);
  font-size: 11px; color: var(--fg-4);
  display: flex; align-items: flex-start; gap: 8px;
}
.sidebar-footer > div { min-width: 0; flex: 1; }
.sidebar-footer > div > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-footer .dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--good);
  box-shadow: 0 0 8px var(--good);
}

/* Main content */
.main { min-width: 0; padding: 28px 32px 80px; max-width: 100%; overflow-x: hidden; }
@media (max-width: 1100px) { .main { padding: 22px 20px 60px; } }
[data-variant="terminal"] .main { padding: 18px 24px 60px; }

/* =========================================================================
   HEADER
   ========================================================================= */
.page-header {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 24px;
  padding-bottom: 22px; margin-bottom: 22px;
  border-bottom: 1px solid var(--border);
  flex-wrap: nowrap;
}
.page-title {
  font-family: var(--font-display);
  font-size: 28px; font-weight: 600; letter-spacing: var(--tracking-tight);
  line-height: 1.1;
  color: var(--fg-0);
}
[data-variant="editorial"] .page-title {
  font-size: 36px; font-weight: 400; letter-spacing: -0.02em;
}
[data-variant="editorial"] .page-title em {
  font-style: italic; color: var(--acko-300); font-weight: 400;
}
[data-variant="terminal"] .page-title {
  font-size: 22px; text-transform: uppercase; letter-spacing: 0.04em;
}
[data-variant="terminal"] .page-title em { font-style: normal; color: var(--acko-400); }

.page-subtitle {
  margin-top: 8px; color: var(--fg-3); font-size: 13px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
}
.page-subtitle .pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  color: var(--fg-2); font-size: 12px;
  font-family: var(--font-mono);
  white-space: nowrap;
}
.page-subtitle .pill .key { color: var(--fg-4); }
.page-subtitle .pill svg { width: 12px; height: 12px; }

.page-header-left { min-width: 0; flex: 1 1 auto; }
.page-header-left .page-subtitle { row-gap: 8px; }
.header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 14px; border-radius: var(--radius);
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border-strong);
  color: var(--fg-1); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all .15s ease;
  font-family: inherit;
}
.btn:hover { background: rgba(255,255,255,0.08); }
.btn svg { width: 14px; height: 14px; }
.btn.primary {
  background: linear-gradient(180deg, var(--acko-500), var(--acko-700));
  border-color: var(--acko-600);
  color: white;
  box-shadow: 0 6px 18px -4px rgba(124,92,255,0.45);
}
.btn.primary:hover { filter: brightness(1.08); }

/* Period bar */
.period-bar {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 10px 16px; margin-bottom: 22px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 12px;
}
.period-bar .date-pill { white-space: nowrap; }
.period-bar .label {
  text-transform: uppercase; font-size: 10px; letter-spacing: 0.14em;
  color: var(--fg-4); font-weight: 600; padding-right: 4px;
}
.date-pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 12px; border-radius: var(--radius-sm);
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--fg-1); font-family: var(--font-mono); font-size: 12px; cursor: pointer;
}
.date-pill:hover { border-color: var(--border-strong); }
.date-pill svg { width: 12px; height: 12px; opacity: 0.7; }
.range-presets { display: flex; gap: 4px; }
.range-preset {
  padding: 6px 10px; border-radius: var(--radius-sm);
  background: transparent; border: 1px solid transparent;
  color: var(--fg-3); font-size: 11px; cursor: pointer; font-family: var(--font-mono);
}
.range-preset:hover { color: var(--fg-1); }
.range-preset.active { background: rgba(124,92,255,0.14); color: var(--acko-200); border-color: rgba(124,92,255,0.3); }
.compare-toggle {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;
  font-size: 12px; color: var(--fg-2);
  white-space: nowrap;
}
.period-bar .updated {
  margin-left: auto; color: var(--fg-4); font-size: 11px; font-family: var(--font-mono);
  white-space: nowrap;
}
.compare-toggle .switch {
  width: 28px; height: 16px; border-radius: 999px; background: var(--ink-5); position: relative;
  transition: background .15s;
}
.compare-toggle .switch::after {
  content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px;
  border-radius: 50%; background: var(--fg-2); transition: all .15s;
}
.compare-toggle.on .switch { background: var(--acko-600); }
.compare-toggle.on .switch::after { left: 14px; background: white; }

/* =========================================================================
   CARDS
   ========================================================================= */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}
.card-header {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  padding: 18px 22px 12px;
  flex-wrap: wrap;
}
.card-header > div:first-child { min-width: 0; flex: 1; }
.card-title {
  font-size: 14px; font-weight: 600; letter-spacing: -0.01em;
  color: var(--fg-0); display: flex; align-items: center; gap: 10px;
  flex-wrap: wrap;
  min-width: 0;
}
.card-title > span:not(.accent):not(.count) { white-space: nowrap; }
[data-variant="editorial"] .card-title {
  font-family: var(--font-display); font-weight: 400; font-size: 20px; letter-spacing: -0.01em;
}
[data-variant="editorial"] .card-title em { font-style: italic; color: var(--acko-300); }
[data-variant="terminal"] .card-title {
  text-transform: uppercase; font-size: 12px; letter-spacing: 0.12em; font-weight: 600;
}
.card-title .accent {
  display: inline-block; width: 4px; height: 16px; background: var(--acko-500); border-radius: 2px;
}
[data-variant="editorial"] .card-title .accent { display: none; }
.card-subtitle { color: var(--fg-3); font-size: 12px; }
.card-actions { display: flex; gap: 6px; align-items: center; }
.card-body { padding: 6px 22px 22px; }
.card-body.flush { padding: 0; }

/* =========================================================================
   KPI TILES
   ========================================================================= */
.kpi-grid {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px;
  margin-bottom: 28px;
}
@media (max-width: 760px)  { .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi-value { word-break: break-word; }

.kpi {
  position: relative;
  padding: 18px 18px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.kpi.acko {
  border-color: rgba(124,92,255,0.3);
  background: linear-gradient(180deg, rgba(124,92,255,0.08), transparent 50%), var(--surface);
}
[data-variant="terminal"] .kpi.acko {
  background: var(--surface);
  border-color: var(--acko-700);
  border-left: 3px solid var(--acko-500);
}
.kpi-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--fg-3); font-weight: 600;
  display: flex; align-items: center; gap: 6px;
}
.kpi-label .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--acko-500); box-shadow: 0 0 8px var(--acko-500);
}
.kpi-value {
  margin-top: 14px;
  font-family: var(--font-display);
  font-size: 36px; font-weight: 600;
  letter-spacing: -0.03em; line-height: 1;
  color: var(--fg-0);
  font-variant-numeric: tabular-nums;
}
[data-variant="editorial"] .kpi-value {
  font-weight: 400; font-size: 44px; letter-spacing: -0.02em;
}
[data-variant="editorial"] .kpi-value .unit {
  font-style: italic; color: var(--acko-300); font-size: 0.7em;
}
[data-variant="terminal"] .kpi-value {
  font-size: 32px; font-weight: 500;
}
.kpi-value .unit { color: var(--acko-300); margin-left: 2px; }
.kpi-value.text { font-size: 26px; letter-spacing: -0.01em; }
[data-variant="editorial"] .kpi-value.text { font-size: 32px; }
.kpi-caption {
  margin-top: 10px; color: var(--fg-3); font-size: 12px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.kpi-spark {
  display: block;
  height: 26px; width: 100%; margin-top: 8px; opacity: 0.85;
}
.kpi-delta {
  display: inline-flex; align-items: center; gap: 3px;
  font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  padding: 2px 6px; border-radius: 4px;
}
.kpi-delta.up   { color: var(--good); background: rgba(74,222,128,0.10); }
.kpi-delta.down { color: var(--bad);  background: rgba(255,100,112,0.10); }
.kpi-delta svg { width: 10px; height: 10px; }

/* =========================================================================
   BAR CHART (horizontal)
   ========================================================================= */
.bars { display: flex; flex-direction: column; gap: 4px; }
.bar-row {
  display: grid; grid-template-columns: 130px 1fr 64px;
  align-items: center; gap: 14px;
  padding: 6px 4px;
  border-radius: 6px;
  cursor: pointer;
  transition: background .12s;
}
.bar-row:hover { background: rgba(255,255,255,0.03); }
.bar-row.acko .bar-name { color: var(--acko-300); font-weight: 600; }
.bar-name {
  font-size: 13px; color: var(--fg-2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-variant-numeric: tabular-nums;
}
.bar-track {
  height: 22px; background: rgba(255,255,255,0.03);
  border-radius: 4px; overflow: hidden; position: relative;
}
[data-variant="terminal"] .bar-track {
  height: 14px; border-radius: 0;
  background: rgba(255,255,255,0.04);
}
.bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #4d8eff, #5aa9ff);
  border-radius: inherit;
  position: relative;
  transition: width .6s cubic-bezier(.2,.8,.2,1);
}
.bar-row.acko .bar-fill {
  background: linear-gradient(90deg, var(--acko-600), var(--acko-400));
  box-shadow: 0 0 16px rgba(124,92,255,0.4);
}
[data-variant="terminal"] .bar-fill {
  background: var(--info);
}
[data-variant="terminal"] .bar-row.acko .bar-fill { background: var(--acko-500); box-shadow: none; }
.bar-value {
  font-family: var(--font-mono); font-size: 12px; color: var(--fg-1);
  text-align: right; font-variant-numeric: tabular-nums; font-weight: 500;
}
.bar-row.acko .bar-value { color: var(--acko-200); }

/* =========================================================================
   TABLES
   ========================================================================= */
.table-wrap { overflow-x: auto; max-height: 680px; overflow-y: auto; }
.table-wrap::-webkit-scrollbar { width: 6px; }
.table-wrap::-webkit-scrollbar-track { background: var(--ink-2); border-radius: 3px; }
.table-wrap::-webkit-scrollbar-thumb { background: var(--ink-6); border-radius: 3px; }
.table-wrap::-webkit-scrollbar-thumb:hover { background: var(--ink-7); }
.table thead { position: sticky; top: 0; z-index: 5; background: var(--surface); }
.table {
  width: 100%; border-collapse: collapse;
  font-size: 13px;
}
.table th {
  text-align: left; font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.12em; color: var(--fg-3); font-weight: 600;
  padding: 12px 16px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  user-select: none;
}
.table th.sortable { cursor: pointer; }
.table th.sortable:hover { color: var(--fg-1); }
.table th .sort-arrow {
  display: inline-block; margin-left: 4px; opacity: 0.6;
  font-size: 9px;
}
.table td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  color: var(--fg-1);
  vertical-align: middle;
}
.table tr:last-child td { border-bottom: none; }
.table tr:hover td { background: rgba(124,92,255,0.04); }
.table tr.acko td { background: rgba(124,92,255,0.06); }
.table tr.acko td:first-child { box-shadow: inset 3px 0 0 var(--acko-500); }
.table .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.table .url {
  color: var(--acko-300); font-family: var(--font-mono); font-size: 12px;
  display: inline-flex; align-items: center; gap: 6px;
  max-width: 100%;
}
.table .url > span.urltext {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  max-width: 380px; display: inline-block; vertical-align: bottom;
}
.table .url svg { flex-shrink: 0; opacity: 0.6; width: 11px; height: 11px; }
.table .url:hover { text-decoration: underline; }
.table svg { width: 14px; height: 14px; }
.table .url svg { width: 11px; height: 11px; }

.cell-num-pill {
  display: inline-block;

.section-title {
  font-family: var(--font-display);
  font-size: 22px; font-weight: 600; letter-spacing: -0.01em;
  margin: 12px 0 14px; color: var(--fg-0);

[data-variant="editorial"] .section-title {

}
[data-variant="editorial"] .section-title em { font-style: italic; color: var(--acko-300); }
[data-variant="terminal"] .section-title {
  font-size: 13px; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600;
}
.section-title .count {
  font-family: var(--font-mono); font-size: 13px; color: var(--fg-4); font-weight: 400;
}

/* Filter bar */
.filter-bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 14px 22px;
  border-bottom: 1px solid var(--border);
}
.search {
  position: relative; flex: 1; min-width: 240px; max-width: 340px;
}
.search input {
  width: 100%; padding: 8px 12px 8px 32px; border-radius: var(--radius-sm);
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--fg-1); font-size: 13px; font-family: inherit;
  outline: none; transition: border-color .15s;
}
.search input:focus { border-color: var(--acko-600); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--fg-4); }

.filter-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: var(--radius-sm);
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--fg-2); font-size: 12px; cursor: pointer;
  user-select: none;
  font-family: inherit;
}
.filter-chip:hover { color: var(--fg-1); border-color: var(--border-strong); }
.filter-chip.active {
  background: rgba(124,92,255,0.14); color: var(--acko-200); border-color: rgba(124,92,255,0.35);
}
.filter-chip .ct {
  font-family: var(--font-mono); font-size: 10px; opacity: 0.7;
}

/* Volume bucket (small inline bar in table) */
.vol-cell {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 12px;
  font-weight: 500;
}
.vol-cell .vbar {
  width: 60px; height: 4px; border-radius: 999px;
  background: rgba(255,255,255,0.05); position: relative; overflow: hidden;
}
.vol-cell .vbar > span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--info); border-radius: inherit; }
.vol-cell.high   .vbar > span { background: var(--bad); }
.vol-cell.med    .vbar > span { background: var(--warn); }
.vol-cell.low    .vbar > span { background: var(--info); }

/* Drill-down panel */
.drawer-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55);
  backdrop-filter: blur(6px); z-index: 50;
  display: flex; justify-content: flex-end;
  animation: fade .18s ease;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.drawer {
  width: min(780px, 65%); height: 100%;
  background: var(--surface);
  border-left: 1px solid var(--border-strong);
  overflow-y: auto;
  animation: slidein .22s cubic-bezier(.2,.8,.2,1);
}
@keyframes slidein { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.drawer-head {
  padding: 22px 26px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
}
.drawer-head h3 {
  font-family: var(--font-display); font-size: 22px; font-weight: 600;
  letter-spacing: -0.01em; line-height: 1.2;
}
[data-variant="editorial"] .drawer-head h3 { font-weight: 400; font-size: 28px; }
.drawer-head .close {
  background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: var(--radius-sm);
  width: 32px; height: 32px; display: grid; place-items: center; cursor: pointer; color: var(--fg-2);
}
.drawer-body { padding: 22px 26px; display: flex; flex-direction: column; gap: 22px; }
.drawer-stat-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;
}
.drawer-stat {
  padding: 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius);
}
.drawer-stat .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--fg-3); font-weight: 600; }
.drawer-stat .val {
  font-family: var(--font-display); font-size: 24px; font-weight: 600; margin-top: 6px;
  letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
}
.drawer-response-wrap {
  display: grid; grid-template-columns: 1fr 280px; gap: 0;
  border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
  min-height: 200px;
}
@media (max-width: 700px) { .drawer-response-wrap { grid-template-columns: 1fr; } }
.drawer-response {
  padding: 18px 20px; font-size: 13px; line-height: 1.75; color: var(--fg-2);
  white-space: pre-wrap; word-break: break-word; max-height: 480px; overflow-y: auto;
  background: var(--surface-2);
}
.drawer-response::-webkit-scrollbar { width: 5px; }
.drawer-response::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
.drawer-cited-sidebar {

}
.drawer-cited-sidebar h4 {

.cited-link {

.cited-link .cited-title { color: var(--fg-2); display: block; margin-bottom: 4px; font-weight: 500; }

  position: relative;
  padding: 0;
  height: 460px;

.quadrant-svg { width: 100%; height: 100%; display: block; }

.priority-list { display: flex; flex-direction: column; }
.priority-item {
  display: grid; grid-template-columns: 28px 1fr auto auto; gap: 14px;
  padding: 12px 22px; align-items: center;

      "response": "Group health insurance is a health insurance policy that covers a group of people under one common policy, rather than each person buying an individual policy separately. In India, employers commonly provide it to employees, and IRDAI recognizes employer\u2013employee group health insurance products. [irdai.gov.in](https://irdai.gov.in/documents/37343/365525/%E0%A4%9C%E0%A5%80%E0%A4%B5%E0%A4%A8%2B%E0%A4%AC%E0%A5%80%E0%A4%AE%E0%A4%BE%2B%E0%A4%89%E0%A4%A4%E0%A5%8D%E0%A4%AA%E0%A4%BE%E0%A4%A6%E0%A5%8B%E0%A4%82%2B%E0%A4%B8%E0%A4%82%E0%A4%AC%E0%A4%82%E0%A4%A7%E0%A5%80%2B%E0%A4%AE%E0%A4%BE%E0%A4%B8%E0%A5%8D%E0%A4%9F%E0%A4%B0%2B%E0%A4%AA%E0%A4%B0%E0%A4%BF%E0%A4%AA%E0%A4%A4%E0%A5%8D%E0%A4%B0%2B_%2BMaster%2BCircular%2Bon%2BLife%2BInsurance%2BProducts.pdf/d7ca89f3-b894-8c93-3e53-d8caf67a8ba6?t=1733233494424&version=2.1&utm_source=chatgpt.com) \n\n### Simple example\n\nSuppose a company has 100 employees and buys a group health policy from an insurer:\n\n*   The company is usually the policyholder.\n    \n*   Employees are covered as insured members.\n    \n*   The company may also choose to cover spouses, children, or parents, depending on the policy.\n    \n*   If an employee is hospitalized for a covered treatment, the insurer pays eligible expenses according to the policy's terms and limits.\n    \n*   Many group policies provide cashless treatment at network hospitals. [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/Future15/Group%20Health%20Insurance.pdf?utm_source=chatgpt.com) \n    \n\n### Group vs. individual health insurance\n\n|Group health insurance|Individual health insurance|\n|---|---|\n|Usually arranged by an employer/organization|You purchase it yourself|\n|Covers eligible members of a group|Covers you/family you choose|\n|Employer may pay all or part of the premium|You normally pay the premium|\n|Coverage is based on the group policy|Coverage is based on your own policy|\n|May end or change when you leave the organization|Generally remains yours as long as the policy\u2026",

      "prompt": "What is group insurance scheme and how does it work in India?",

      "response": "In India, group insurance is insurance where a single policy is taken for a defined group of people\u2014rather than each person buying a completely separate policy. A common example is employer-provided group health insurance for employees.\n\nIRDAI regulates insurance products and insurers in India, and its current health-insurance framework includes provisions applicable to group health products. [irdai.gov.in](https://irdai.gov.in/health-dept?utm_source=chatgpt.com) \n\n### How group insurance works\n\nSuppose a company has 500 employees:\n\n1.  Company buys a master policy  \n    The employer negotiates with an insurance company and purchases a group policy covering eligible employees.\n    \n2.  Employees become members of the group  \n    Employees are covered according to the policy's eligibility rules. The employer generally acts as the master policyholder.\n    \n3.  Premium is paid  \n    The company may pay the entire premium, or employees may contribute some portion. The premium for health insurance can depend on factors such as age and other relevant risk factors. [irdai.gov.in](https://irdai.gov.in/faqs-on-health-insurance-regulations?utm_source=chatgpt.com) \n    \n4.  Coverage is provided according to the policy  \n    For example, a group health policy might provide \u20b95 lakh of hospitalisation cover per employee, potentially with additional coverage for spouse/children depending on the employer's plan.\n    \n5.  Employee makes a claim when needed  \n    If an employee is hospitalised, they can use the insurer's cashless network where available or submit eligible expenses for reimbursement, subject to the policy's terms, exclusions, deductibles, co-payments, waiting periods, etc.\n    \n6.  Coverage generally ends when eligibility ends  \n    For an employer-sponsored plan, leaving the company will normally cause the employee's group coverage to cease according to the policy rules. Whether any conversion/continuation option is available depends on the particular product and app\u2026",

      "response": "Assuming you mean a group health insurance policy in India\u2014typically the medical insurance an employer provides to employees\u2014here\u2019s the broad picture.\n\n### What group health insurance commonly covers\n\nThe exact benefits depend on the employer's policy, but a typical group mediclaim policy may cover:\n\n*   Hospitalisation expenses for illness or accidental injury, subject to the sum insured.\n    \n*   Pre- and post-hospitalisation expenses, for a specified number of days.\n    \n*   Day-care procedures that don't require a 24-hour hospital stay.\n    \n*   Room rent, ICU and doctor/surgical charges, subject to any limits or sub-limits.\n    \n*   Emergency treatment and ambulance charges, within policy limits.\n    \n*   Pre-existing diseases (PEDs)\u2014often an important advantage of employer group policies, although the exact treatment depends on the policy negotiated by the employer.\n    \n*   Maternity and newborn expenses, if the employer has included maternity benefits.\n    \n*   Dependants, such as spouse and children, if the employer has opted to include them.\n    \n*   AYUSH or other specified treatments, if included under the particular plan.\n    \n*   Sometimes additional benefits such as OPD, dental/vision, infertility treatment, domiciliary care or critical illness, but these are not automatically included.\n    \n\nIRDAI notes that the policy's sum insured, coverage, exclusions, waiting periods, sub-limits, deductibles and co-payments should be checked in the Customer Information Sheet (CIS). [irdai.gov.in](https://irdai.gov.in/health-dept?utm_source=chatgpt.com) \n\n### Common exclusions or limitations\n\nCommon examples include:\n\n1.  Cosmetic/plastic surgery unless medically necessary or required following an accident.\n    \n2.  Treatment for certain non-medical expenses, such as administrative charges or items specifically excluded by the policy.\n    \n3.  Self-inflicted injuries in circumstances specified by the policy.\n    \n4.  Unproven/experimental treatments, depending on \u2026",

CI Lombard, HDFC ERGO, Niva Bupa) and the AYUSH limit shown in your policy, I can explain exactly what it cove\u2026",

      "response": "In India, an employer group health insurance (GHI) policy is a health insurance contract that the company buys for a defined group of employees, usually with an insurer through a broker/intermediary. IRDAI expressly permits employer\u2013employee group health products, including one-year renewable group health insurance. [irdai.gov.in](https://irdai.gov.in/documents/37343/991022/%E0%A4%85%E0%A4%82%E0%A4%97%E0%A5%8D%E0%A4%B0%E0%A5%87%E0%A4%9C%E0%A5%80%2B-%2B%E0%A4%9C%E0%A5%80%E0%A4%B5%E0%A4%A8%2B%E0%A4%AC%E0%A5%80%E0%A4%AE%E0%A4%BE%2B%E0%A4%89%E0%A4%A4%E0%A5%8D%E0%A4%AA%E0%A4%BE%E0%A4%A6%E0%A5%8B%E0%A4%82%2B%E0%A4%B8%E0%A4%82%E0%A4%AC%E0%A4%82%E0%A4%A7%E0%A5%80%2B%E0%A4%AE%E0%A4%BE%E0%A4%B8%E0%A5%8D%E0%A4%9F%E0%A4%B0%2B%E0%A4%AA%E0%A4%B0%E0%A4%BF%E0%A4%AA%E0%A4%A4%E0%A5%8D%E0%A4%B0%2B_%2BMaster%2BCircular%2Bon%2BLife%2BInsurance%2BProducts%2B-%2BEnglish.pdf/56f5b93b-a7c6-30cf-1734-0537e2d8676d?download=true&t=1733233169949&version=1.0&utm_source=chatgpt.com) \n\n### How it works\n\n1\\. The employer buys the policy\n\nThe company decides things such as:\n\n  * Who is covered \u2014 all employees, certain grades, locations, etc.\n    \n  * Sum insured \u2014 e.g. \u20b93 lakh, \u20b95 lakh, \u20b910 lakh per employee/family\n    \n  * Whether spouse and children are included\n    \n  * Whether parents/in-laws are covered\n    \n  * Room-rent limits\n    \n  * Maternity benefits\n    \n  * Pre/post-hospitalisation\n    \n  * Day-care procedures\n    \n  * Waiting periods and exclusions\n    \n  * Network hospitals and cashless treatment\n\nThe insurer prices the policy based on the group's demographics, coverage and expected claims.\n\n2\\. The employer is generally the \"master policyholder\"\n\nEmployees are the insured members/beneficiaries under the group arrangement. Each employee normally receives an insurance certificate/e-card showing their coverage and important conditions. IRDAI's group-policy documentation specifically contemplates adding and deleting members during the policy period and issuing certificates of insurance. \u2026",

ear employees' homes and workplaces|\n\nPolicy documents can impo\u2026",

shless approval does not necessarily mean the entire bill is covered. D\u2026",

y. I IRDAI\n    \n    For a non-network hospital, reimbursement may be possible, subject to the po\u2026",

      "brands": [],
      "response": "A Group Mediclaim Policy (GMC) is a health-insurance policy purchased by an employer to cover employees and, depending on the plan, their dependents. It can be a valuable employee benefit in India. [irdai.gov.in](https://irdai.gov.in/faqs-on-health-insurance-regulations?utm_source=chatgpt.com) \n\n### Key benefits for employees\n\n1.  Financial protection against hospitalization\n    \n    *   Helps pay eligible hospitalization and medical expenses, reducing the employee's out-of-pocket burden.\n        \n    *   Coverage can include hospital room charges, surgery, doctor fees, medicines, diagnostics, ICU, etc., depending on the policy. [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/Max15/Group%20Health%20Insurance.pdf?utm_source=chatgpt.com) \n    \n2.  Coverage for family members\n    \n    *   Many employer GMC plans allow employees to add their spouse, children and/or parents, subject to the employer's chosen policy terms. [finzip.in](https://finzip.in/learn/group-health-insurance-india?utm_source=chatgpt.com) \n    \n3.  Potentially better coverage than an individual policy\n    \n    *   Corporate policies may negotiate broader benefits or limits for the employee group. However, the actual advantages depend heavily on the specific policy.\n    \n4.  Pre-existing disease benefits\n    \n    *   Some GMC policies provide coverage for pre-existing diseases from the beginning of the policy, although this is not automatic for every group policy\u2014employees should check the policy wording. [finzip.in](https://finzip.in/learn/group-health-insurance-india?utm_source=chatgpt.com) \n    \n5.  Cashless treatment\n    \n    *   Where the insurer has a cashless arrangement with the hospital, eligible expenses can be settled directly with the hospital rather than the employee paying the entire bill upfront. [irdai.gov.in](https://irdai.gov.in/c/portal/update_language?languageId=en_US&p_l_id=148&redirect=%2Fhi%2Fweb%2Fpolicy-hold e household expenses, education costs, \u2026",

      "response": "What Is Corporate Insurance?\n----------------------------\n\nCorporate insurance is insurance purchased by a business to protect the company, its employees, assets, and operations against financial losses arising from unexpected events. It is a broad category rather than one single policy, and the coverage is usually tailored to the risks faced by the organisation. [www.tataaig.com](https://www.tataaig.com/knowledge-center/group-health-insurance/corporate-insurance?utm_source=chatgpt.com) \n\nFor example, a company might combine property insurance, liability insurance, employee health insurance, group personal accident insurance, professional liability cover, and business-interruption protection depending on its needs. IRDAI also lists covers such as fire, machinery breakdown, electronic equipment, workers' compensation, public/professional liability, money-in-transit and employee benefit policies among the options available to businesses. [irdai.gov.in](https://irdai.gov.in/non-life2?utm_source=chatgpt.com) \n\n### Main Types of Corporate Insurance\n\n|Type|What it protects|\n|---|---|\n|Group Health Insurance|Employees and, depending on the policy, their families against covered medical expenses|\n|Group Personal Accident|Employees against specified accidental death or disability|\n|Property Insurance|Office buildings, equipment, inventory and other physical assets|\n|Liability Insurance|Claims from customers, third parties or other parties for covered injury, damage or loss|\n|Professional Indemnity|Businesses against certain claims arising from professional errors or negligence|\n|Business Interruption Insurance|Certain lost income and additional expenses following an insured disruption|\n|Workers' Compensation/Employee Compensation|Specified employee injury-related liabilities|\n\n### Benefits of Corporate Insurance\n\n1\\. Protects business finances  \nA major accident, property loss, lawsuit or operational disruption can create substantial       "response": "Who Is Eligible for Group Health Insurance?\n-------------------------------------------\n\nIn India, group health insurance is generally available to members of a defined group, most commonly employees of an organization. The exact eligibility rules depend on the employer\u2019s policy and the insurer\u2019s terms. [irdai.gov.in](https://irdai.gov.in/health-dept?utm_source=chatgpt.com) \n\n### Commonly eligible people\n\n1.  Employees\n    \n    *   Full-time employees are typically the primary insured members.\n        \n    *   Depending on the employer's policy, certain other employee categories may also be included.\n    \n2.  Spouse or partner\n    \n    *   Many group policies allow an employee's spouse or eligible partner to be covered. [irdai.gov.in](https://irdai.gov.in/documents/37343/931203/UIIHLGP21251V022021_2020-2021.pdf/1016f2e6-25fd-7f0e-a426-d71ac3813c48?t=1668590261125&version=1.1&utm_source=chatgpt.com) \n    \n3.  Dependent children\n    \n    *   Children can often be included, subject to the policy's age and dependency requirements.\n        \n    *   The permitted age can vary significantly between policies. [irdai.gov.in](https://irdai.gov.in/documents/37343/931203/UIIHLGP21251V022021_2020-2021.pdf/1016f2e6-25fd-7f0e-a426-d71ac3813c48?t=1668590261125&version=1.1&utm_source=chatgpt.com) \n    \n4.  Parents or parents-in-law\n    \n    *   Some employer plans allow employees to add parents or parents-in-law, although this is not universal and may involve an additional premium or separate coverage limits. [irdai.gov.in](https://irdai.gov.in/documents/37343/931203/UIIHLGP21251V022021_2020-2021.pdf/1016f2e6-25fd-7f0e-a426-d71ac3813c48?t=1668590261125&version=1.1&utm_source=chatgpt.com) \n    \n5.  Members of other eligible groups\n    \n    *   Group health insurance isn't limited to employer-employee groups. IRDAI also recognizes certain homogeneous non-employer groups, such as professional/trade associations, cooperative societies, and some government-sponsored groups. [irdai.gov.in\u2026",
      "citedPages": [
        {
          "url": "https://irdai.gov.in/health-dept",
          "title": "HEALTH DEPT - IRDAI"
        },
        {
          "url": "https://irdai.gov.in/documents/37343/931203/UIIHLGP21251V022021_2020-2021.pdf/1016f2e6-25fd-7f0e-a426-d71ac3813c48?t=1668590261125&version=1.1",

 families may continue coverage temporarily through COBRA if the plan is subject to COBRA. [www\u2026",

      "response": "Assuming you mean India, an employer with 10\u201350 employees should look at group mediclaim (Group Health Insurance/GHI) as both an employee-benefit decision and a compliance/HR-cost issue.\n\n### What employers should know\n\n1.  Group health insurance is generally available for employer\u2013employee groups.  \n    IRDAI regulations expressly permit employer\u2013employee group health products, including one-year renewable group health insurance. [irdai.gov.in](https://irdai.gov.in/documents/37343/365525/%E0%A4%9C%E0%A5%80%E0%A4%B5%E0%A4%A8%2B%E0%A4%AC%E0%A5%80%E0%A4%AE%E0%A4%BE%2B%E0%A4%89%E0%A4%A4%E0%A5%8D%E0%A4%AA%E0%A4%BE%E0%A4%A6%E0%A5%8B%E0%A4%82%2B%E0%A4%B8%E0%A4%82%E0%A4%AC%E0%A4%82%E0%A4%A7%E0%A5%80%2B%E0%A4%AE%E0%A4%BE%E0%A4%B8%E0%A5%8D%E0%A4%9F%E0%A4%B0%2B%E0%A4%AA%E0%A4%B0%E0%A4%BF%E0%A4%AA%E0%A4%A4%E0%A5%8D%E0%A4%B0%2B_%2BMaster%2BCircular%2Bon%2BLife%2BInsurance%2BProducts.pdf/d7ca89f3-b894-8c93-3e53-d8caf67a8ba6?t=1733233494424&version=2.1&utm_source=chatgpt.com) \n    \n2.  Don't confuse mediclaim with ESIC.  \n    For establishments covered by the Employees' State Insurance framework, the applicable employee-count and wage conditions need to be checked separately. A private group mediclaim policy doesn't automatically replace statutory ESI obligations.\n    \n3.  For 10\u201350 employees, negotiate rather than simply buying the cheapest plan.  \n    At this size, employers should compare:\n    \n    *   \u20b93 lakh, \u20b95 lakh, \u20b910 lakh+ sum insured\n        \n    *   Individual vs family-floater coverage\n        \n    *   Spouse/children/parents eligibility\n        \n    *   Room-rent restrictions\n        \n    *   ICU limits\n        \n    *   Waiting periods for pre-existing diseases\n        \n    *   Maternity/newborn cover\n        \n    *   Day-care procedures\n        \n    *   Pre/post-hospitalisation\n        \n    *   Cashless hospital network in employees' locations\n        \n    *   Co-payments and deductibles\n        \n    *   Disease/sub-limits\n        \n    *   Claim servicing/TPA quali\u2026",

      "prompt": "group health insurance policy for 10 to 50 employees: what should employers know?",

      "response": "If you mean India, a group health insurance (GHI) policy can be a very useful employee benefit for a company with 10\u201350 employees. There isn't a single \u201c10\u201350 employee\u201d policy design; insurers and brokers will price it based on the employee census, ages, locations, coverage and claims history.\n\nIRDAI regulations expressly recognize employer\u2013employee group health insurance products, including one-year renewable group health policies. [irdai.gov.in](https://irdai.gov.in/documents/37343/991022/%E0%A4%85%E0%A4%82%E0%A4%97%E0%A5%8D%E0%A4%B0%E0%A5%87%E0%A4%9C%E0%A5%80%2B-%2B%E0%A4%9C%E0%A5%80%E0%A4%B5%E0%A4%A8%2B%E0%A4%AC%E0%A5%80%E0%A4%AE%E0%A4%BE%2B%E0%A4%89%E0%A4%A4%E0%A5%8D%E0%A4%AA%E0%A4%BE%E0%A4%A6%E0%A5%8B%E0%A4%82%2B%E0%A4%B8%E0%A4%82%E0%A4%AC%E0%A4%82%E0%A4%A7%E0%A5%80%2B%E0%A4%AE%E0%A4%BE%E0%A4%B8%E0%A5%8D%E0%A4%9F%E0%A4%B0%2B%E0%A4%AA%E0%A4%B0%E0%A4%BF%E0%A4%AA%E0%A4%A4%E0%A5%8D%E0%A4%B0%2B_%2BMaster%2BCircular%2Bon%2BLife%2BInsurance%2BProducts%2B-%2BEnglish.pdf/56f5b93b-a7c6-30cf-1734-0537e2d8676d?download=true&t=1733233169949&version=1.0&utm_source=chatgpt.com) \n\n### What employers should focus on\n\n|Area|What to decide|\n|---|---|\n|Who is covered|All employees, probationers, directors, dependants, etc.|\n|Sum insured|Common choices are \u20b93 lakh, \u20b95 lakh, \u20b97.5 lakh or \u20b910 lakh per employee/family, depending on budget|\n|Family coverage|Employee only vs employee + spouse + children; parents can substantially increase premium|\n|Room rent|Prefer no restrictive room-rent cap where affordable|\n|Pre-existing diseases|Check whether covered from day one or subject to a waiting period|\n|Maternity|Check limits, waiting period, normal/C-section limits and newborn coverage|\n|Co-pay|Lower/no co-pay is generally better for employees|\n|Sub-limits|Look carefully at cataract, maternity, specific diseases and other treatment limits|\n|Cashless hospitals|Check hospitals near employees' homes and workplaces, not just a national hospital count|\n|TPA/service|Claims support can matter a\u2026",

      "prompt": "What does group health insurance policy cover and what are common exclusions?",
      "vol": 20,
      "mentioned": false,
      "cited": false,
      "brands": [],
      "response": "A group health insurance policy is health insurance purchased by an employer or organization for a group of people\u2014typically employees and sometimes their spouses, children, or parents. The exact benefits depend on the employer\u2019s policy wording and insurer.\n\n### What it commonly covers\n\n|Coverage|What it usually means|\n|---|---|\n|Hospitalisation|Room, doctor, surgery, medicines, diagnostics and other eligible expenses during inpatient treatment, subject to limits.|\n|Day-care procedures|Treatments that don't require a 24-hour hospital stay, such as certain chemotherapy, dialysis or cataract procedures. [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/BHARTI15/Group%20Health%20Insurance%20Policy.pdf?utm_source=chatgpt.com) |\n|Pre/post-hospitalisation|Eligible medical expenses immediately before and after a covered hospitalisation, for specified periods. [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/BHARTI15/Group%20Health%20Insurance%20Policy.pdf?utm_source=chatgpt.com) |\n|Cashless treatment|At network hospitals, the insurer/TPA may settle eligible expenses directly with the hospital.|\n|Maternity|Pregnancy, delivery and sometimes newborn expenses\u2014only if the employer has included maternity cover.|\n|Newborn/baby cover|Often available from birth, subject to the policy's terms and limits.|\n|Ambulance|Road ambulance charges, usually with a specified limit.|\n|AYUSH treatment|Some policies cover eligible Ayurveda, Yoga, Unani, Siddha and Homeopathy treatment, subject to conditions.|\n|Additional benefits|Depending on the employer's plan: room-rent upgrades, critical illness, personal accident, domiciliary treatment, etc.|\n\nIRDAI-hosted group policy wordings illustrate that coverage can include hospitalisation, day-care and domiciliary treatment, but the sum insured, sub-limits and conditions are policy-specific. [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/BHARTI15/Group%20Health%20Insurance%20Policy.pd\u2026",

      "brands": [],
      "response": "If you mean \u201cHow can HR use a Group Mediclaim/Group Health Insurance (GMC) policy as an HR tool to improve employee satisfaction, retention and overall benefits?\u201d , there are several good approaches.\n\nIn India, HR should treat GMC as more than just an annual insurance purchase. IRDAI\u2019s current health-insurance framework provides the regulatory backdrop for health policies, including group health insurance. [irdai.gov.in](https://irdai.gov.in/web/guest/circulars?filterDepartment=HLT&filtersApplied=true&utm_source=chatgpt.com) [irdai.gov.in](https://irdai.gov.in/circulars?_com_irdai_document_media_IRDAIDocumentMediaPortlet_delta=60&_com_irdai_document_media_IRDAIDocumentMediaPortlet_filterEntities=AGENTS&_com_irdai_document_media_IRDAIDocumentMediaPortlet_resetCur=false&p_p_id=com_irdai_document_media_IRDAIDocumentMediaPortlet&p_p_lifecycle=0&p_p_mode=view&p_p_state=normal&utm_source=chatgpt.com) \n\n### 1\\. Improve the policy design\n\nHR can negotiate for benefits employees actually value:\n\n  * Higher base sum insured\n    \n  * Employee + spouse + children + parents options\n    \n  * Lower or zero room-rent restrictions\n    \n  * Reduced disease-specific sub-limits\n    \n  * Maternity benefits\n    \n  * Newborn coverage\n    \n  * Day-care procedures\n    \n  * Pre- and post-hospitalisation coverage\n    \n  * Mental-health benefits\n    \n  * Ambulance coverage\n    \n  * Home healthcare where appropriate\n    \n  * Better cashless hospital network\n\nKey point: Don't select the cheapest premium. Compare coverage + exclusions + claim experience + service quality + network.\n\n### 2\\. Give employees choice\n\nA strong model is:\n\nCompany-paid base cover + employee-paid voluntary top-up.\n\nFor example:\n\nBenefit\\| Company provides\\| Employee can buy  \n\\---\\|---\\|---  \nEmployee GMC\\| \u20b95 lakh\\| \u2014  \nSpouse/children\\| Included\\| \u2014  \nParents\\| Basic cover / optional\\| Additional cover  \nSuper top-up\\| \u2014\\| \u20b910\u201325 lakh  \nPersonal accident\\| \u20b95\u201310 lakh\\| Additional  \nCritical illness\\| \u2014\\| Optional\n  \nTh\u2026",

      "vol": 20,

      "response": "If you mean group health/medical insurance (Group Mediclaim/GMC) for an Indian employer with 10\u201350 employees, here\u2019s what employers should know as of 2026:\n\n### 1\\. There is generally no \u201c10\u201350 employee\u201d statutory coverage level\n\nGroup health insurance is not required simply because a company has 10, 20, or 50 employees. There is also no regulator-prescribed minimum sum insured based on company size. The appropriate cover is a business/benefit decision. [www.pazcare.com](https://www.pazcare.com/blog/group-health-insurance-coverage-guide-by-company-size-in-india-3l-to-50l?utm_source=chatgpt.com) \n\nIRDAI does, however, regulate group insurance products and requires a genuine relationship between the group members and the policyholder; employer\u2013employee groups are a standard permitted category. [irdai.gov.in](https://irdai.gov.in/documents/37343/365525/%E0%A4%9C%E0%A5%80%E0%A4%B5%E0%A4%A8%2B%E0%A4%AC%E0%A5%80%E0%A4%AE%E0%A4%BE%2B%E0%A4%89%E0%A4%A4%E0%A5%8D%E0%A4%AA%E0%A4%BE%E0%A4%A6%E0%A5%8B%E0%A4%82%2B%E0%A4%B8%E0%A4%82%E0%A4%AC%E0%A4%82%E0%A4%A7%E0%A5%80%2B%E0%A4%AE%E0%A4%BE%E0%A4%B8%E0%A5%8D%E0%A4%9F%E0%A4%B0%2B%E0%A4%AA%E0%A4%B0%E0%A4%BF%E0%A4%AA%E0%A4%A4%E0%A5%8D%E0%A4%B0%2B_%2BMaster%2BCircular%2Bon%2BLife%2BInsurance%2BProducts.pdf/d7ca89f3-b894-8c93-3e53-d8caf67a8ba6?t=1733233494424&version=2.1&utm_source=chatgpt.com) \n\n### 2\\. What a typical policy can cover\n\nFor a small employer, the policy can cover:\n\n*   Employees\n    \n*   Spouse and children\n    \n*   Parents/parents-in-law, if the employer chooses\n    \n*   Hospitalisation and related medical expenses\n    \n*   Cashless treatment through the insurer/TPA network\n    \n*   Often pre-existing diseases from day one, depending on the negotiated policy\n    \n*   Optional maternity, newborn, critical illness, personal accident and top-up benefits\n    \n\nThe exact terms matter enormously\u2014don't compare policies solely on the \u20b95 lakh/\u20b910 lakh headline cover. [finzip.in](https://finzip.in/learn/group-health-insurance-indi\u2026",

      "response": "*   If you mean India, group medical insurance for a 10\u201350 employee company can be a very useful benefit\u2014but the cheapest policy is often not the best one.\n    \n    A group health policy is generally an employer-sponsored master policy covering employees and, if chosen, dependants. IRDAI permits employer\u2013employee group health products, including one-year renewable group health insurance. I IRDAI\n    \n    What employers should know\n    --------------------------\n    \n    ### 1\\. Decide what you're actually trying to cover\n    \n    For a 10\u201350 person company, I'd decide these first:\n    \n    *   Employee-only vs. family cover \u2014 spouse and children are relatively common; parent coverage can materially increase premiums.\n    *   Base sum insured \u2014 e.g. \u20b93 lakh, \u20b95 lakh, \u20b910 lakh or more per employee/family.\n    *   Individual vs. family floater \u2014 a family floater shares the sum insured among family members.\n    *   Maternity \u2014 particularly important if this is a meaningful employee benefit.\n    *   OPD \u2014 consultations, pharmacy and diagnostics; don't assume a hospitalization policy covers these.\n    *   Mental-health/modern-treatment coverage where relevant.\n    *   Room-rent restrictions, co-pays and disease sub-limits.\n    \n    The policy wording matters more than the headline \"\u20b95 lakh cover.\"\n    \n    ### 2\\. Don't assume group insurance has the same waiting periods as retail insurance\n    \n    One attraction of employer group insurance is that insurers may offer pre-existing-disease coverage from day one and waive or reduce certain waiting periods. But this is not something to assume universally\u2014it depends on the negotiated policy.\n    \n    Maternity is a particularly important example: many group policies waive or substantially shorten maternity waiting periods, but there is no general rule guaranteeing that every group policy does so. P pazcare.com       "response": "Yes. Group health insurance in India can cover pre-existing diseases (PEDs), but it depends on the specific group policy.\n\n  * A pre-existing disease generally means a condition that was diagnosed, treated, or medically advised about during the specified period before the policy started. [irdai.gov.in](https://irdai.gov.in/faqs-on-health-insurance-regulations?utm_source=chatgpt.com) [irdai.gov.in](https://irdai.gov.in/document-detail?documentId=392476&utm_source=chatgpt.com) \n    \n  * Group policies may have a waiting period for PEDs , but the employer's negotiated policy can sometimes provide coverage from day one or a shorter waiting period.\n    \n  * Under current IRDAI rules, insurers are required to offer products catering to people with existing medical conditions and pre-existing diseases, although the exact coverage depends on the product/policy terms. [irdai.gov.in](https://irdai.gov.in/health-dept?utm_source=chatgpt.com) \n    \n  * IRDAI guidance says the PED waiting period in a health policy cannot exceed 36 months under the current framework, while older policy wordings may show 48 months; therefore, you should rely on the current policy document/CIS for your particular group plan. [irdai.gov.in](https://irdai.gov.in/health-dept?utm_source=chatgpt.com) [irdai.gov.in](https://irdai.gov.in/faqs-on-health-insurance-regulations?utm_source=chatgpt.com) \n    \n  * Don't hide a pre-existing condition when providing information to the insurer/TPA, as nondisclosure can cause claim disputes or rejection. [irdai.gov.in](https://irdai.gov.in/health-dept?utm_source=chatgpt.com) \n\nExample: If your employer's group policy specifically says \u201cpre-existing diseases covered from day 1,\u201d then diabetes, hypertension, thyroid disease, etc. that existed before joining can generally be covered, subject to the policy's other exclusions, limits, and claim conditions.\n\nIf you tell me the insurance company and group policy name (e.g., Star Health, ICICI Lombard, HDFC ERGO, Niva Bupa),\u2026",

      "response": "If you mean group medical insurance provided by an employer in India, the claim process is generally straightforward. The exact rules depend on your employer\u2019s policy and insurer/TPA, but the usual process is:\n\n### Step-by-step group medical insurance claim process\n\n1\\. Check your policy coverage\nBefore treatment, check:\n- Sum insured available\n- Whether the hospital is a network hospital\n- Room-rent limits\n- Waiting periods/exclusions\n- Copay or deductible, if any\n- Whether the treatment is covered\n\nYour HR/insurance desk can usually provide the policy details and TPA contact number.\n\n2\\. Choose the type of claim\n\nThere are two main options:\n\nCashless claim:  \nYou use a network hospital. The insurer/TPA settles the eligible hospital bill directly with the hospital.\n\nReimbursement claim:  \nYou pay the hospital yourself and later submit the bills and documents to the insurer/TPA for reimbursement.\n\nIRDAI's health-insurance framework recognizes both cashless and reimbursement processes. [irdai.gov.in](https://irdai.gov.in/web/guest/circulars?filterDepartment=HLT&filtersApplied=true&utm_source=chatgpt.com) \n\n---\n\n### 3\\. For planned hospitalization \u2014 inform the insurer/TPA\n\nBefore admission, contact the TPA/insurer or your company's insurance desk.\n\nGive them:\n- Employee/member ID\n- Patient's name\n- Health-card details\n- Hospital name\n- Diagnosis/treatment\n- Expected admission date\n- Doctor's details, if requested\n\nFor a cashless claim, the hospital's insurance/TPA desk normally submits the pre-authorization/cashless request.\n\n### 4\\. Hospital submits the cashless request\n\nThe hospital sends the required medical information and estimated treatment cost to the TPA/insurer.\n\nThe TPA reviews:\n- Whether the patient is covered\n- Whether the treatment is covered\n- Available sum insured\n- Policy limits/exclusions\n- Estimated expenses\n\nThe request may be approved, partially approved, or rejected, or additional information may be requested.\n\n### 5\\. Get admitted and undergo tre\u2026",

      "response": "A group mediclaim policy is a health-insurance policy taken by an organisation\u2014usually an employer\u2014for a group of people such as employees and, often, their dependents. The exact benefits depend on the policy negotiated with the insurer.\n\n### Advantages\n\n1.  Lower cost\n    \n    *   Group policies are generally cheaper than buying separate individual policies because the employer purchases cover for many people at once.\n        \n    *   Employees may get substantial coverage at little or no personal premium.\n    \n2.  Easier to obtain\n    \n    *   There is usually less individual underwriting than with a personal policy.\n        \n    *   Depending on the scheme, employees may get coverage even when obtaining an individual policy could be more difficult or expensive.\n    \n3.  Coverage for family members\n    \n    *   Many employer policies allow spouses, children and sometimes parents to be included, although the terms and additional premium vary.\n    \n4.  Useful coverage from day one\n    \n    *   Some employer group policies provide relatively favourable terms for pre-existing diseases and waiting periods compared with individual policies. However, this is policy-specific, so the actual wording should be checked.\n    \n5.  Cashless hospitalisation\n    \n    *   If the insurer has a cashless arrangement with the hospital, eligible treatment can be settled directly with the hospital, subject to the policy terms.\n    \n6.  Portability/migration options\n    \n    *   IRDAI-regulated health insurance rules provide migration/portability mechanisms in certain circumstances. For example, IRDAI policy documents state that an individual member of a group health policy can have a right to migrate to an individual or family-floater policy with the same insurer, subject to applicable guidelines and terms. [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/Future15/Group%20Health%20Insurance.pdf?utm_source=ch 's published group health policy documents show that benefits, limits, exclusions and eligibility a\u2026",

ia_IRDAIDocumentMediaPortlet_cur=2&_com_irdai_document_medi\u2026",

      "mentioned": false,
      "cited": false,
      "brands": [],
      "response": "Group medical insurance is a health insurance policy that an employer provides to its employees, often extending coverage to eligible family members. In India, group health insurance is a recognized form of employer-employee insurance, and employer-paid health insurance can generally be tax-exempt for employees when it meets the applicable conditions. [irdai.gov.in](https://irdai.gov.in/health-dept?utm_source=chatgpt.com) \n\n### Key benefits for employees\n\n1. Lower or zero personal cost  \n   The employer typically pays all or most of the premium, allowing employees to receive health coverage without purchasing an individual policy themselves.\n   \n2. Coverage for family members  \n   Many employer plans allow employees to include spouses, children and sometimes parents or other dependants, depending on the policy.\n   \n3. Protection against large medical bills  \n   Hospitalisation, surgery, diagnostics and related medical expenses can be covered up to the policy's sum insured and subject to its terms and limits. [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/Max15/Group%20Health%20Insurance.pdf?utm_source=chatgpt.com) \n   \n4. Cashless hospitalisation  \n   Depending on the insurer and hospital network, employees may be able to receive treatment through a cashless facility rather than paying the entire hospital bill upfront. [irdai.gov.in](https://irdai.gov.in/c/portal/update_language?languageId=en_US&p_l_id=148&redirect=%2Fhi%2Fweb%2Fpolicy-holder%2Fhealth-insurance&utm_source=chatgpt.com) \n   \n5. Potentially better access to coverage  \n   Group policies are purchased for a pool of employees rather than individually, which can make obtaining coverage easier than buying a personal policy, particularly for employees who might otherwise face underwriting or waiting-period considerations. However, the exact terms vary by policy, so this should not be assumed for every group plan.\n   \n6. Tax advantage  \n   In India, employer-paid premiums for qualifyin\u2026",

      "response": "*   Yes. In India, a company can buy a Group Mediclaim / Group Health Insurance (GHI) policy that covers employees and optionally their dependants. You can purchase it directly from an IRDAI-registered insurer or through an IRDAI-registered insurance intermediary/broker. I IRDAI+1\n    \n    How to buy it\n    -------------\n    \n    1.  Decide who you want to cover\n        \n        *   Employees only, or employees + spouse + children + parents.\n        *   Decide whether the company pays 100% of the premium or employees contribute toward dependent/parent coverage.\n        *   Define eligibility: permanent employees, probationers, executives, etc.\n    2.  Choose the coverage\n        \n        A practical starting point for many Indian companies is:\n        \n        *   \u20b95 lakh or \u20b910 lakh base cover per employee/family\n        *   No or low room-rent restriction\n        *   Minimal disease-specific sub-limits\n        *   Low/no co-payment\n        *   Maternity cover if relevant\n        *   Newborn-child cover\n        *   Pre-existing diseases covered from day one, if you can negotiate it\n        *   Large cashless hospital network\n        *   Optional parental coverage\n        \n        Don't select a policy based purely on the premium. IRDAI specifically recommends checking room/ICU limits, waiting periods, exclusions, sub-limits, co-payments and the cashless hospital network. I IRDAI\n        \n    3.  Get quotes from several insurers/brokers\n        \n        Give each one the same employee census and coverage requirements so you can compare like-for-like quotations.\n        \n        Your employee census normally needs information such as:\n        \n        *   Employee count\n        *   Age/gender\n        *   Employee/dependant relationship\n        *   Dependants' ages\n        *   Existing coverage and claims history, if applicable\n        *   Desired sum insured\n    4.  Compare the policy wording\u2014not     {
      "prompt": "What is group insurance policy and how does it work in India?",
      "vol": 10,
      "mentioned": false,
      "cited": false,
      "brands": [],
      "response": "In India, a group insurance policy is an insurance policy that covers a group of people under one master policy , rather than each person buying a separate policy.\n\nA common example is the group health insurance provided by an employer to its employees. IRDAI recognizes both individual and group health insurance products, and group members must receive a Customer Information Sheet explaining key coverage, exclusions, limits, waiting periods, claims process, etc. [irdai.gov.in](https://irdai.gov.in/health-dept?utm_source=chatgpt.com) [irdai.gov.in](https://irdai.gov.in/faqs-on-health-insurance-regulations?utm_source=chatgpt.com) \n\n### How it works \u2014 simple example\n\nSuppose you work for ABC Pvt. Ltd.:\n\n  1. Company buys the policy  \n     ABC negotiates with an insurance company and purchases a group health policy covering, say, 500 employees.\n     \n  2. You become a member  \n     You are enrolled as an insured member. Depending on the employer's plan, your spouse, children and/or parents may also be covered.\n     \n  3. There is a defined sum insured  \n     For example, you might get \u20b95 lakh individual coverage or be part of a family cover of \u20b95 lakh/\u20b910 lakh.\n     \n  4. You pay little or nothing\u2014or sometimes part of the premium  \n     The employer may pay the entire premium, or employees may pay an additional amount for dependents or enhanced coverage.\n     \n  5. You make a claim when needed  \n     If you are hospitalized for a covered treatment, you can generally use a network hospital for cashless treatment or submit eligible expenses for reimbursement, subject to the policy terms.\n     \n  6. The employer is usually the master policyholder  \n     The insurer has a master contract with the employer/group, while you are an insured member under that contract.\n\n### Group insurance vs individual insurance\n\nFeature\\| Group health insurance\\| Individual health insurance  \n\\---\\|---\\|---  \nWho buys it?\\| Employer/organization\\| You  \nWho is policyholder?\\| Usually employer/\u2026",

      "response": "*   In India, group medical insurance (usually called a Group Health Insurance / Group Mediclaim Policy) is health insurance that an employer buys for its employees as a group rather than each employee buying an individual policy.\n    \n    IRDAI expressly permits group health insurance for employer\u2013employee groups. I IRDAI\n    \n    ### How it works\n    \n    1\\. Employer chooses a policy\n    \n    The company approaches an insurer, often through an insurance broker, and chooses things such as:\n    \n    *   \u20b93 lakh / \u20b95 lakh / \u20b910 lakh+ sum insured per employee\n    *   Employee-only or employee + spouse + children + parents\n    *   Room-rent limits\n    *   Maternity coverage\n    *   Pre-existing disease coverage\n    *   Day-care procedures\n    *   Ambulance expenses\n    *   Corporate/network hospital coverage\n    *   Co-pay and deductibles\n    *   Optional top-up/super top-up\n    \n    The exact benefits, exclusions and limits are defined in the policy. I IRDAI\n    \n    2\\. The company pays the premium\n    \n    For example, suppose a company has 100 employees and buys:\n    \n    > \u20b95 lakh health cover per employee + spouse + 2 children\n    \n    The insurer calculates one group premium based on the group's characteristics and selected benefits. The employer normally pays the premium, although some employers allow employees to pay extra for optional family members or enhanced coverage.\n    \n    3\\. Employees get individual coverage under the master policy\n    \n    The company is generally the master policyholder. Employees are members/insured persons under that policy and receive an insurance certificate/e-card showing their coverage.\n    \n    Adding and removing employees during the policy period is generally possible under group policies. I IRDAI\n    \n    4\\. Employee uses the insurance when hospitalized\n    \n    There are typically two ways:\n    \n    *   Cashless: Employee goes to a network hospital; the insurer/TPA settles eligible expenses directly with the hospital.\n\u2026",

ation expenses\n    *   Day-care procedures\n    *   Ambulance\n    *   Mat\u2026",

      "response": "If you mean group health insurance (GHI) provided by an employer in India, a reasonable 2026 budgeting range is:\n\n|Coverage|Typical premium / employee / year\\*|\n|---|---|\n|Basic \u20b93\u20135 lakh cover|\u20b94,000\u2013\u20b99,000|\n|Standard \u20b95\u201310 lakh cover|\u20b99,000\u2013\u20b918,000|\n|Comprehensive \u20b910 lakh+ with add-ons|\u20b918,000\u2013\u20b930,000+|\n|Family/dependent coverage|Often \u20b915,000\u2013\u20b940,000+ total per employee|\n\nThese are indicative market ranges, not guaranteed quotes. Recent 2026 estimates put the broader employer range around \u20b910,000\u2013\u20b925,000 per employee/year, while some basic SME plans can be considerably cheaper. [www.pazcare.com](https://www.pazcare.com/blog/how-much-does-group-health-insurance-cost-an-employer-per-person?utm_source=chatgpt.com) \n\n### Example for a company\n\nFor 100 employees, you might budget approximately:\n\n*   Basic: \u20b94\u20139 lakh/year\n    \n*   Good mid-range plan: \u20b99\u201318 lakh/year\n    \n*   Premium/comprehensive: \u20b918\u201330 lakh+/year\n    \n\nGST is generally added to the quoted base premium; one current 2026 calculator example shows 18% GST separately. [www.ethika.co.in](https://www.ethika.co.in/group-health-insurance-premium-calculator?utm_source=chatgpt.com) \n\n### What changes the price most?\n\nThe insurer will mainly look at:\n\n*   Average age of employees\n    \n*   Number of employees/dependents covered\n    \n*   Sum insured (\u20b93L, \u20b95L, \u20b910L, etc.)\n    \n*   Whether parents are included\n    \n*   Maternity coverage\n    \n*   OPD benefits\n    \n*   Pre-existing disease coverage\n    \n*   Previous claims history\n    \n*   Company/employee location and hospital network\n    \n*   Size of the employee group\n    \n\nFor a practical employer budget, I'd use \u20b910,000\u2013\u20b915,000 per employee/year for a decent standard policy, then get quotes from 2\u20134 insurers/brokers. Current market estimates support that as a reasonable starting point. [www.pazcare.com](https://www.pazcare.com/blog/how-much-does-group-health-insurance-cost-an-employer-per-person?utm_source=chatgpt.com) \n\nIf you tell me number of employees + a\u2026",

      "response": "*   If you mean group health insurance for your employees, the process in India is fairly straightforward. A company generally buys a Group Mediclaim / Group Health Insurance (GHI) policy from an IRDAI-registered insurer, often through a licensed insurance broker/intermediary. IRDAI confirms that general and health insurers can offer group health insurance products. I IRDAI+1\n    \n    ### How to buy it\n    \n    1.  Decide your employee coverage\n        *   Number of employees\n        *   Employee-only or employee + spouse + children/parents\n        *   Sum insured, e.g. \u20b93 lakh, \u20b95 lakh, \u20b910 lakh per employee/family\n        *   Whether maternity, newborn, OPD, dental, etc. should be covered\n        *   Whether you want employer-paid or employee-contributory coverage\n        \n    2.  Prepare employee data\n        \n        Typically you'll need information such as:\n        \n        *   Employee names/IDs\n        *   Date of birth/age\n        *   Gender\n        *   Dependants, if included\n        *   Location\n        *   Existing insurance and claims information, where requested\n        \n    3.  Get quotes from 3\u20135 insurers/brokers\n        \n        Don't compare only the premium. Ask each provider for the same coverage structure so you can compare properly.\n        \n        \n    4.  Pay particular attention to these terms\n        \n        *   Room-rent limits\n        *   ICU limits\n        *   Disease-wise sub-limits\n        *   Co-payment\n        *   Pre-existing disease coverage\n        *   Waiting periods\n        *   Maternity limits/waiting period\n        *   Day-care procedures\n        *   Ambulance coverage\n        *   Cashless hospital network\n        *   Claim settlement/service process\n        *   Addition/deletion of employees during the policy year\n        \n        These are specifically among the items IRDAI advises policy buyers to examine. I IRDAI\n        \n        \n    5.  Select the insurer and submit the proposal\n        \n        The insurer will assess\u2026",

      "response": "If you mean an employee group insurance scheme in India \u2014such as group health insurance or group life insurance\u2014the claim process usually works like this:\n\n### Step-by-step group insurance claim process\n\n1\\. Check that you are covered\n\n  * Confirm that you were enrolled in the employer's group policy.\n    \n  * Check your Certificate of Insurance / e-card , policy number, coverage amount, exclusions, and validity.\n    \n  * For employer-employee group policies, the employer is generally the master policyholder , while employees are members of the group. [www.caalley.com](https://www.caalley.com/irdai_mc/MC_Protection_of_Policyholders_interests_2024.pdf?utm_source=chatgpt.com) \n\n2\\. Inform the employer/HR or insurer\n\n  * Tell your HR/insurance desk about the claim as soon as possible.\n    \n  * For health insurance, you may contact the TPA (Third-Party Administrator) or insurer.\n    \n  * For life insurance, the nominee/beneficiary normally initiates the death claim, often with assistance from the employer.\n\n3\\. Obtain the claim form\n\n  * Get the appropriate claim form from HR, the insurer, or TPA.\n    \n  * Complete it accurately and sign it.\n    \n  * The exact process depends on whether it is a health, life, accidental death, disability, or other benefit.\n\n4\\. Collect supporting documents\n\nFor a group health claim , documents commonly include:\n\n  * Health insurance/e-card\n    \n  * Claim form\n    \n  * Hospital bills and receipts\n    \n  * Discharge summary\n    \n  * Prescriptions and medical reports\n    \n  * Investigation reports\n    \n  * ID/KYC and bank details, where required\n\nFor a group life/death claim , commonly required documents include:\n\n  * Claim form\n    \n  * Death certificate\n    \n  * Insured member's employment/leave records, where applicable\n    \n  * Nominee's ID and bank details\n    \n  * FIR/police report for applicable accidental or unnatural deaths\n    \n  * Post-mortem report where applicable\n\nThe exact documents are determined by the policy; insurers shou\u2026",

      "response": "If you mean a group health insurance scheme\u2014such as one provided by an employer to employees\u2014it generally covers medical expenses for enrolled members, but the exact benefits depend on the policy purchased by the employer.\n\n### What it commonly covers\n\n- Hospitalization: Room, nursing, doctor/surgeon fees, medicines, diagnostics, and other eligible hospital expenses, up to the sum insured.\n- Day-care procedures: Certain procedures that don't require a 24-hour hospital stay.\n- Pre- and post-hospitalization: Eligible medical expenses immediately before and after hospitalization, subject to specified limits.\n- Accidental injuries: Treatment resulting from accidents is generally covered, subject to policy terms.\n- Pre-existing diseases: Group policies can sometimes offer more favorable coverage than individual policies, including reduced or waived waiting periods\u2014but this is policy-specific.\n- Maternity: Pregnancy, childbirth and newborn expenses may be included if the employer has negotiated maternity benefits.\n- Dependants: Spouse, children and sometimes parents can be covered if the group scheme allows them.\n- Other benefits: Depending on the plan, this can include ambulance services, domiciliary treatment, mental-health treatment, AYUSH treatment, or OPD benefits.\n\nIRDAI notes that group health products can be offered on both indemnity and benefit bases, and that the policy's Customer Information Sheet should summarize coverage, exclusions, waiting periods, sub-limits and deductibles. [irdai.gov.in](https://irdai.gov.in/health-dept?utm_source=chatgpt.com) \n\n### Common exclusions or limitations\n\nTypical policies may exclude or restrict:\n\n1. Cosmetic procedures unless medically necessary.\n2. Self-inflicted injuries or treatment arising from certain substance abuse.\n3. Unproven/experimental treatments, depending on the policy.\n4. Certain infertility/sterility treatments, unless specifically covered.\n5. Routine dental, spectacles/contact lenses and hearing aids, unless \u2026",

      "brands": [],
      "response": "If you mean group health insurance \u2014such as an employer-provided corporate health policy\u2014it can be very useful, but it also has important limitations.\n\n### Advantages\n\n  1. Lower cost\n\n * Premiums are generally cheaper per person because a large group is insured together.\n   \n * In employer-sponsored plans, the employer may pay all or most of the premium. [economictimes.indiatimes.com](https://economictimes.indiatimes.com/wealth/insure/health-insurance/advantages-and-disadvantages-of-buying-a-group-health-insurance-policy/articleshow/69278359.cms?from=mdr&utm_source=chatgpt.com) [Group Health Insurance Explained: Types & More \\[2026\\]](https://joinditto.in/health-insurance/group-health-insurance/?utm_source=chatgpt.com)\n\n  2. Easy to obtain\n\n * Employees usually don't have to go through the same individual underwriting process as with a personal policy.\n   \n * Enrollment is generally simple.\n\n  3. Pre-existing diseases may be covered from the beginning\n\n * This can be a major advantage for employees or dependants who already have medical conditions. The exact terms depend on the group policy. [Group Health Insurance Explained: Types & More \\[2026\\]](https://joinditto.in/health-insurance/group-health-insurance/?utm_source=chatgpt.com)\n\n  4. Family/dependant coverage\n\n * Many employer plans allow spouses, children and sometimes parents to be included, although the eligibility and premium arrangements vary.\n\n  5. Cashless treatment\n\n * If the hospital is in the insurer's network and the treatment meets policy conditions, cashless hospitalization may be available. [irdai.gov.in](https://irdai.gov.in/health-dept?utm_source=chatgpt.com) \n\n  6. Potentially useful additional benefits\n\n * Depending on the employer's negotiated plan, benefits can include maternity, newborn coverage and other add-ons. [economictimes.indiatimes.com](https://economictimes.indiatimes.com/wealth/insure/health-insurance/advantages-and-d
