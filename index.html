      "prompt": "What are the benefits of group insurance policy for employees?",
      "vol": 10,
      "mentioned": false,
      "cited": false,
      "brands": [],
      "response": "A group insurance policy is an insurance plan arranged by an employer for its employees, often extending coverage to spouses, children, or parents. In India, employer\u2013employee groups can have group health and group term insurance products under IRDAI rules. ([IRDAI](https://irdai.gov.in/documents/37343/365525/%E0%A4%9C%E0%A5%80%E0%A4%B5%E0%A4%A8%2B%E0%A4%AC%E0%A5%80%E0%A4%AE%E0%A4%BE%2B%E0%A4%89%E0%A4%A4%E0%A5%8D%E0%A4%AA%E0%A4%BE%E0%A4%A6%E0%A5%8B%E0%A4%82%2B%E0%A4%B8%E0%A4%82%E0%A4%AC%E0%A4%82%E0%A4%A7%E0%A5%80%2B%E0%A4%AE%E0%A4%BE%E0%A4%B8%E0%A5%8D%E0%A4%9F%E0%A4%B0%2B%E0%A4%AA%E0%A4%B0%E0%A4%BF%E0%A4%AA%E0%A4%A4%E0%A5%8D%E0%A4%B0%2B_%2BMaster%2BCircular%2Bon%2BLife%2BInsurance%2BProducts.pdf/d7ca89f3-b894-8c93-3e53-d8caf67a8ba6?t=1733233494424&version=2.1&utm_source=chatgpt.com))\n\n### Benefits for employees\n\n1. Lower or no personal premium\n   - The employer often pays all or most of the premium, so employees get insurance at little or no direct cost.\n   \n2. Health coverage for family\n   - Many corporate health plans allow employees to add dependants such as spouse, children and sometimes parents.\n   \n3. Financial protection against medical expenses\n   - Hospitalisation and other covered medical expenses can be paid by the insurer rather than coming directly from the employee's savings. ([IRDAI](https://irdai.gov.in/health-dept?utm_source=chatgpt.com))\n   \n4. Potentially easier access to coverage\n   - Group policies can provide benefits that may be difficult or more expensive to obtain individually, depending on the policy\u2014for example, coverage for pre-existing conditions or reduced waiting periods. However, this is policy-specific, so employees should check the actual terms. ([Ditto](https://joinditto.in/articles/health-insurance/employee-health-insurance/?utm_source=chatgpt.com))\n   \n5. Cashless hospitalisation\n   - Where the policy/network supports it, employees can receive treatment at network hospitals without paying the entire eligible hospital bill upfront\u2026",

      "prompt": "What are the advantages and disadvantages of group health insurance policy?",
      "vol": 10,
      "mentioned": false,
      "cited": false,
      "brands": [],
      "response": "A group health insurance policy is a health insurance plan purchased by an organization\u2014usually an employer\u2014to cover a group of people such as employees and, often, their dependents.\n\n### Advantages\n\n1.  Lower premium\n    \n    *   Group policies are generally cheaper than buying separate individual policies because the insurer covers a large group.\n        \n    *   Employers may pay the entire premium or share the cost with employees.\n    \n2.  Coverage may start with fewer restrictions\n    \n    *   Group policies can sometimes offer better terms regarding waiting periods, pre-existing diseases, maternity, etc., depending on the policy negotiated by the employer.\n    \n3.  Family coverage\n    \n    *   Employees can often add their spouse, children, and sometimes parents, subject to the policy terms.\n    \n4.  Easy enrollment\n    \n    *   Employees usually don't have to go through extensive individual underwriting or medical examinations when joining the group.\n    \n5.  Cashless hospitalization\n    \n    *   If the insurer has a network of hospitals, members can generally use cashless treatment according to the policy conditions.\n    \n6.  Useful employee benefit\n    \n    *   For employers, health insurance can help attract and retain employees.\n    \n7.  Some continuity protections\n    \n    *   In India, IRDAI rules provide migration options for individual members of certain group health policies when they leave the group or the group policy is modified/withdrawn. [irdai.gov.in](https://irdai.gov.in/health-dept?utm_source=chatgpt.com) \n        \n\n### Disadvantages\n\n1.  Coverage is linked to the group\n    \n    *   The biggest drawback is that your coverage is usually connected to your employment or membership in the group.\n        \n    *   If you leave your job, the employer's group policy may no longer cover you.\n    \n2.  Employer controls the policy\n    \n    *   The employer generally chooses the insurer, sum insured, coverage features, deductibles, and many other terms.\n\u2026",

      "response": "*   If you mean a group insurance scheme in India\u2014for example, insurance provided by an employer to employees\u2014the claim process is usually straightforward. The exact procedure depends on whether it is group health insurance, group life insurance, personal accident, etc.\n    \n    ### Group health insurance claim \u2014 step by step\n    \n    1\\. Check your coverage\n    \n    *   Get your group insurance/health card or policy details from your employer/HR.\n    *   Check the sum insured, exclusions, waiting periods, co-pay, room-rent limits and network hospitals. IRDAI says group-policy members should receive a Customer Information Sheet explaining these key features. I IRDAI\n    \n    2\\. Inform HR/insurer/TPA\n    \n    *   Contact your employer's insurance desk, insurer or TPA as soon as hospitalization is planned or occurs.\n    *   Keep your employee/member ID and policy/group policy number ready.\n    *   Your particular policy may specify a deadline for claim notification, so don't delay.\n    \n    3\\. Decide between cashless and reimbursement\n    \n    Cashless claim\n    \n    *   Go to a network hospital.\n    *   Give the hospital your insurance/employee ID.\n    *   The hospital sends a pre-authorisation request to the insurer/TPA.\n    *   Once approved, the insurer pays the eligible amount directly to the hospital. You pay amounts not covered by the policy, such as applicable co-pay, exclusions or expenses above the approved amount. I IRDAI+1\n    \n    Reimbursement claim\n    \n    *   You pay the hospital bill yourself.\n    *   Submit the claim form and supporting documents to the insurer/TPA according to your policy's procedure.\n    *   The insurer assesses the claim and reimburses the admissible amount into the eligible bank account.\n    \n    4\\. Collect all documents  \n    Common documents include:\n    \n    *   Claim form\n    *   Insurance/employee ID\n    *   Discharge summary\n    *   Original hospital bills and receipts\n    *   Investigation/diagnostic reports\n    *   Do\u2026",

      "prompt": "Advantages Of Group Health Insurance",
      "vol": 10,
      "mentioned": false,
      "cited": false,
      "brands": [],
      "response": "*   Advantages of Group Health Insurance\n    ------------------------------------\n    \n    Group health insurance is a policy that covers a defined group\u2014commonly employees of a company\u2014under a single master policy. In India, IRDAI recognizes group health insurance as an available form of health insurance for employer\u2013employee and certain other eligible groups. I IRDAI+1\n    \n    ### Key advantages\n    \n    1.  Lower cost\n        *   Group plans can provide health coverage at a lower effective cost than buying individual policies separately.\n        *   Employers often pay some or all of the premium.\n        \n    2.  Coverage for employees and dependents\n        *   Depending on the policy, employees may be able to cover spouses, children, parents, or other eligible dependents.\n        \n    3.  Easy enrollment\n        *   Employees generally don't have to independently shop for and arrange a policy; the employer manages the group arrangement.\n        \n    4.  Potentially broader benefits\n        *   Corporate plans may include hospitalization, daycare procedures, maternity benefits, OPD benefits, and other features depending on the policy selected. Coverage varies significantly by plan. I IRDAI+1\n        \n    5.  Financial protection against medical expenses\n        *   Health insurance can reduce the financial impact of covered hospitalization and medical expenses, subject to the policy's terms, limits, exclusions, and co-payments. I IRDAI\n        \n    6.  Employee retention and satisfaction\n        *   For employers, health insurance is a valuable employee benefit that can help attract and retain employees. T The Economic Times\n        \n    7.  Convenient claims support\n        *   Group policies commonly provide structured claims and cashless-treatment processes through the insurer/TPA and the network of eligible hospitals.\n    \n    ### Important limitation\n    \n    Group insurance shouldn't necessarily be treated as a replacement for personal health insurance. E\u2026",

      "vol": 10,

      "brands": [],
      "response": "If you mean group medical/health insurance provided by an employer in India, the claim process is generally like this. The exact deadlines and documents depend on your employer\u2019s policy, insurer, and TPA, so check your e-card/policy wording too. ([IRDAI](https://old.irdai.gov.in/ADMINCMS/cms/NormalData_Layout.aspx?mid=27.3.8&page=PageNo4220&utm_source=chatgpt.com))\n\n### Step-by-step claim process\n\n1\\. Check your insurance details\n- Find your health/e-card or policy certificate.\n- Note your policy/certificate number, member ID, insurer and TPA.\n- Check your sum insured, room-rent limit, co-pay, exclusions and network hospitals.\n\n2\\. Choose the type of claim\n\nThere are two main options:\n\nA. Cashless claim \u2014 usually at a network hospital.  \nThe insurer/TPA pays the eligible hospital bill directly, subject to policy terms and approval.\n\nB. Reimbursement claim \u2014 you pay the hospital first and later submit the bills/documents to the insurer/TPA for reimbursement. ([IRDAI](https://irdai.gov.in/documents/37343/931203/UIIHLIP21114V032021_2020-2021.pdf/6080fe1a-eb5c-8d05-3166-0d46918789ee?download=true&t=1668590512524&version=1.1&utm_source=chatgpt.com))\n\n---\n\n### Cashless claim\n\n3\\. For planned hospitalization, inform the TPA/insurer\nBefore admission, contact the TPA or the insurance desk at the hospital. The hospital normally helps submit the cashless/pre-authorization request.\n\n4\\. Submit pre-authorization documents\nThe hospital sends details such as:\n- Patient/member information\n- Doctor's diagnosis\n- Proposed treatment\n- Estimated hospital expenses\n- Relevant medical reports\n\nThe insurer/TPA reviews the request and may approve it, ask for additional information, or reject the cashless request. ([IRDAI](https://irdai.gov.in/documents/37343/931203/UIIHLIP21085V012021_2020-2021.pdf/42be207f-8277-0a08-3260-1e925f533c3b?download=true&t=1668152300174&version=1.1&utm_source=chatgpt.com))\n\n5\\. Get treatment\n\nOnce approved, treatment proceeds under the policy's coverage limits.\n\n\u2026",

      "prompt": "What does group insurance scheme cover and what are common exclusions?",
      "vol": 10,
      "mentioned": false,

      "response": "If you mean group health insurance \u2014for example, health insurance provided by an employer\u2014it generally covers medical expenses for employees and sometimes their dependants. The exact benefits depend heavily on the employer\u2019s policy and insurer.\n\n### What group health insurance commonly covers\n\n  * Hospitalisation: Expenses for inpatient treatment, including room, nursing, doctor/surgeon fees, medicines, ICU, etc., subject to the policy limits.\n    \n  * Day-care procedures: Certain treatments that don't require a 24-hour hospital stay.\n    \n  * Pre- and post-hospitalisation: Medical tests, consultations and medicines for a specified period before and after hospitalisation.\n    \n  * Accidental injuries: Treatment resulting from accidents is generally covered, subject to policy terms.\n    \n  * Dependants: Many employer plans allow spouses, children and sometimes parents/parents-in-law to be added.\n    \n  * Pre-existing diseases (PEDs): Group policies can be more generous than individual policies and may cover existing conditions from the start, but this is not automatic \u2014you need to check the specific policy.\n    \n  * Maternity/newborn benefits: Often available in employer plans, sometimes with limits, waiting periods or exclusions.\n    \n  * Cashless treatment: Treatment at the insurer/TPA's network hospitals can often be taken without paying the covered amount upfront.\n\nIRDAI requires the policy's Customer Information Sheet to spell out coverage, exclusions, sub-limits, deductibles and waiting periods, including for members of group policies. [irdai.gov.in](https://irdai.gov.in/health-dept?utm_source=chatgpt.com) \n\n### Common exclusions or limitations\n\nTypical ones include:\n\n  1. Cosmetic/plastic surgery when done for appearance rather than medically necessary treatment.\n     \n  2. Self-inflicted injuries or treatment arising from certain intentional acts.\n     \n  3. Non-medical hospital expenses suc es/default/files/pib2149347.pdf?utm_source=chatgpt.com) \n\nSo an\u2026",

      "response": "Yes. IPD (In-Patient Department) hospitalization is generally covered under group health insurance in India, provided the treatment meets the policy\u2019s terms.\n\nTypically, IPD coverage can include:\n\n*   Hospital room and ICU charges\n    \n*   Doctor/surgeon fees\n    \n*   Medicines, diagnostics, operation-theatre charges\n    \n*   Pre- and post-hospitalization expenses, if specified\n    \n*   Eligible day-care procedures\n    \n\nIRDAI notes that hospitalization is the most common form of health-insurance coverage, and group health policies can provide hospitalization benefits. [irdai.gov.in](https://irdai.gov.in/c/portal/update_language?languageId=en_US&p_l_id=148&redirect=%2Fhi%2Fweb%2Fpolicy-holder%2Fhealth-insurance&utm_source=chatgpt.com) \n\nBut check your specific employer policy for:\n\n*   Sum insured\n    \n*   Room-rent/ICU limits\n    \n*   Co-pay or deductibles\n    \n*   Waiting periods/exclusions\n    \n*   Whether your hospital is in the cashless network\n    \n*   Whether a particular treatment/procedure is covered\n    \n\nIf by IPD you mean inpatient hospitalization, tell me your insurance company/policy name (or share the policy document), and I can tell you exactly what is covered.",

      "prompt": "What Are GMC and GPA Insurance Policy?",
      "vol": 10,
      "mentioned": false,
      "cited": false,
      "brands": [],
      "response": "GMC and GPA are two common insurance benefits provided by employers in India. They protect you in different situations.\n\nFeature\\| GMC\\| GPA  \n\\---\\|---\\|---  \nFull form\\| Group Medical Coverage / Group Mediclaim\\| Group Personal Accident  \nMain purpose\\| Covers medical/hospital expenses\\| Pays compensation for accidents  \nCovers illness?\\| \u2705 Yes, subject to policy terms\\| \u274c No  \nCovers accidental injury?\\| \u2705 Medical treatment can be covered\\| \u2705 Yes  \nAccidental death\\| Medical bills may be covered\\| \u2705 Lump-sum benefit  \nDisability from accident\\| Treatment may be covered\\| \u2705 Lump-sum benefit, depending on severity  \nTypical beneficiaries\\| Employee + eligible family members\\| Usually employee  \nPayment type\\| Usually cashless/reimbursement of eligible medical bills\\| Usually a fixed/lump-sum benefit\n  \n### 1\\. GMC \u2014 Group Medical Coverage\n\nGMC is essentially group health insurance provided through your employer. If you or an eligible dependent gets sick or needs hospitalization, the policy can pay eligible medical expenses according to its terms. It may include hospitalization, surgeries, daycare procedures, and pre/post-hospitalization expenses. [www.aon.com](https://www.aon.com/apac/india/solutions/gmc-gpa-gtl?utm_source=chatgpt.com) [www.tataaig.com](https://www.tataaig.com/knowledge-center/group-health-insurance/what-is-a-gmc-policy?utm_source=chatgpt.com) \n\nExample:  \nYou develop appendicitis and need surgery costing \u20b92 lakh. If your GMC has a \u20b95 lakh sum insured and the treatment is covered, the insurer may pay the eligible hospital bill through cashless treatment or reimbursement.\n\n### 2\\. GPA \u2014 Group Personal Accident\n\nGPA is accident-specific insurance. It generally provides a financial benefit if an accident causes accidental death, permanent/partial disability, or other covered consequences. The benefit is usually based on the sum insured and the type/severity of the injury\u2014not simply the hospital bill. [www.iadvl.org](https://www.iadvl.org/gpa?utm_sourc\u2026",

      "brands": [],
      "response": "In India, Group Health Insurance and Family Floater Health Insurance are different concepts, although a group policy can itself offer a family-floater option.\n\n### Key difference\n\n|Feature|Group Health Insurance|Family Floater Insurance|\n|---|---|---|\n|Who buys it?|Usually employer/organization|Individual/family|\n|Who is covered?|Employees and sometimes dependents|Family members included in the policy|\n|Sum insured|Depends on employer's policy; can be individual or floater|One common sum insured shared by family|\n|Example|Employer gives \u20b95 lakh cover to employee + spouse + children|You buy \u20b910 lakh cover shared by you, spouse & children|\n|Premium|Often partly/fully paid by employer|Paid by you|\n|Control over policy|Mostly employer decides terms|You choose insurer, cover and features|\n|What happens if you leave employer?|Group cover generally ends, subject to policy terms/options|Continues as long as you renew|\n|Customization|Usually limited|Generally much greater|\n|Best for|Employee benefits/low-cost additional coverage|Long-term family protection|\n\nA family floater means the insured amount is shared by the covered family members. For example, with a \u20b910 lakh floater, one family member could potentially use \u20b97 lakh and another \u20b93 lakh during the policy year; the family's total available amount is \u20b910 lakh. IRDAI-hosted policy wording similarly defines a floater as a shared sum insured for the family. ([IRDAI](https://irdai.gov.in/documents/37343/931203/UIIHLGP21251V022021_2020-2021.pdf/1016f2e6-25fd-7f0e-a426-d71ac3813c48?t=1668590261125&version=1.1&utm_source=chatgpt.com))\n\n### Which is better?\n\nIf your employer provides Group Health Insurance:  \nKeep it\u2014it is valuable and often inexpensive/free\u2014but don't necessarily rely on it as your only health insurance.\n\nA common strategy is:\n\nEmployer Group Health Insurance + Personal Family Floater\n\nWhy? Your employer policy is tied to employment, while your personal policy gives you continuity and control. Some group polici\u2026",

    {
      "prompt": "How does group insurance scheme work for employers in India?",
      "vol": 10,
      "mentioned": false,
      "cited": false,
      "brands": [],
      "response": "In India, a group insurance scheme is an insurance policy an employer buys to cover a defined group of employees\u2014rather than each employee buying an individual policy. IRDAI permits employer\u2013employee group products including group term insurance, group health insurance, and certain group annuity/fund-based products. [irdai.gov.in](https://irdai.gov.in/documents/37343/365525/%E0%A4%9C%E0%A5%80%E0%A4%B5%E0%A4%A8%2B%E0%A4%AC%E0%A5%80%E0%A4%AE%E0%A4%BE%2B%E0%A4%89%E0%A4%A4%E0%A5%8D%E0%A4%AA%E0%A4%BE%E0%A4%A6%E0%A5%8B%E0%A4%82%2B%E0%A4%B8%E0%A4%82%E0%A4%AC%E0%A4%82%E0%A4%A7%E0%A5%80%2B%E0%A4%AE%E0%A4%BE%E0%A4%B8%E0%A5%8D%E0%A4%9F%E0%A4%B0%2B%E0%A4%AA%E0%A4%B0%E0%A4%BF%E0%A4%AA%E0%A4%A4%E0%A5%8D%E0%A4%B0%2B_%2BMaster%2BCircular%2Bon%2BLife%2BInsurance%2BProducts.pdf/d7ca89f3-b894-8c93-3e53-d8caf67a8ba6?t=1733233494424&version=2.1&utm_source=chatgpt.com) \n\n### How it typically works\n\n1\\. Employer chooses the cover\n\nThe company decides what benefits to provide, such as:\n\n*   Group health insurance (GHI): hospitalization and related medical expenses\n    \n*   Group term life insurance: a lump sum paid to the nominee if an employee dies during the coverage period\n    \n*   Group personal accident: accidental death/disability benefits\n    \n*   Group gratuity funding: an insurance-backed arrangement to help fund statutory gratuity liabilities\n    \n\n2\\. Employer buys a master policy\n\nThe employer is generally the master policyholder. Employees and, where permitted, their dependants are enrolled as insured members.\n\nFor example, a company might arrange:\n\n> 500 employees \u00d7 \u20b95 lakh health cover per employee\n\nThe insurer issues one group policy, with individual employees receiving certificates/cards or being listed as insured members.\n\n3\\. Who pays the premium?\n\nThere are several possibilities:\n\n*   Employer pays 100% \u2014 common for basic employee health/life cover.\n    \n*   Employer pays employee cover, employee pays for dependants.\n    \n*   Employer and employee share the premium.\n   \u2026",

ium being deductible for income t\u2026",

ures, ICU, implants, etc.|\n|OPD|Useful benefit, but don't sacrifice core hospitalisati\u2026",

      "response": "PPN in Group Health Insurance stands for Preferred Provider Network.\n\nIt is a group of hospitals that have an agreement with the insurer/TPA to provide certain treatments at pre-negotiated package rates , usually with a cashless facility. [www.iibf.org.in](https://www.iibf.org.in/documents/pdf/TermsConditions.pdf?utm_source=chatgpt.com) [www.uiic.in](https://www.uiic.in/UGMS/resources/jsp/grievance_struts/ImageContainer.jsp?imageName=PG0003532024_2024-25+BASE+POLICY.pdf&utm_source=chatgpt.com) \n\n### Simple example\n\nSuppose your company's group health insurance covers a knee surgery:\n\n  * PPN hospital: The insurer and hospital have an agreed package rate for the surgery. You can generally avail cashless treatment , subject to policy terms and pre-authorisation.\n    \n  * Non-PPN hospital: It may still be a network hospital or may require reimbursement, depending on your policy. The agreed PPN package pricing may not apply.\n\n### Why PPN matters to you\n\n  1. Cashless treatment \u2013 the insurer/TPA settles the approved portion directly with the hospital. [irdai.gov.in](https://irdai.gov.in/faqs-on-health-insurance-regulations?utm_source=chatgpt.com) \n     \n  2. Pre-negotiated rates \u2013 helps control hospitalisation costs.\n     \n  3. More predictable billing \u2013 particularly for specified procedures covered under PPN packages.\n     \n  4. Potentially smoother claims \u2013 hospitals familiar with the insurer/TPA's process can make coordination easier.\n\nImportant: PPN does not mean that everything at that hospital is automatically free. Your sum insured, room-rent limits, exclusions, co-pay, deductibles, non-medical expenses, and other policy conditions still apply.\n\nAlso, every PPN hospital is a network hospital, but not every network hospital is necessarily a PPN hospital. [GIPSA: Full Form, PPN, Declaration Form & Meaning \\[2026\\]](https://joinditto.in/articles/health-insurance/general-insurance-public-sector-association/?utm_source=chatgpt.com)\n\nIf you tell me the insurance company\u2026",

      "response": "Yes. In India, an employer can generally claim the premium paid for a group health insurance policy for employees as a business expenditure, provided the expense is incurred wholly and exclusively for business purposes.\n\n### How it works\n\n*   Deduction for employer: The premium is generally deductible under Section 37(1) of the Income-tax Act, 1961, as an employee-related business expense. The current tax return framework specifically treats expenditure that is not wholly and exclusively for business purposes as disallowable under Section 37(1). [www.incometax.gov.in](https://www.incometax.gov.in/iec/foportal/sites/default/files/2026-04/Notification_No_47_2026.pdf?utm_source=chatgpt.com) \n    \n*   No \u20b925,000/\u20b950,000 limit for the employer: The limits commonly associated with Section 80D apply to individuals/HUFs claiming health-insurance deductions. They aren't a cap on an employer's business-expense deduction. The Income Tax Department's current guidance lists the Section 80D limits for individuals. [www.incometax.gov.in](https://www.incometax.gov.in/iec/foportal/help/individual-business-profession?mobile-app=1&utm_source=chatgpt.com) \n    \n*   Employee's tax treatment: Where the employer pays the group medical insurance premium for employees, the treatment can differ depending on the nature and coverage of the policy. The fact that the employer gets a business deduction does not automatically mean the premium becomes taxable salary for the employee.\n    \n*   Documentation: Keep the insurance policy, insurer invoice, payment proof, employee coverage details, and accounting records to substantiate the business expense.\n    \n\nExample: If a company pays \u20b910 lakh for a group mediclaim policy covering its employees, the \u20b910 lakh would ordinarily be deductible as a business expense, reducing taxable business profits by \u20b910 lakh, assuming the expense satisfies the normal requirements of Section 37(1).\n\nOne important distinction: if you're asking whether the employer gets \u2026",

      "response": "If you mean a group health insurance policy in India \u2014for example, health insurance provided by your employer\u2014the cancellation process depends on whether you are the master policyholder (usually the employer) or an individual employee/member.\n\n### If you are an employee/member\n\n  1. Check your certificate of insurance and policy wording.  \n     Group policies are generally held by the employer or other group policyholder, so an individual member may not have the same cancellation rights as the master policyholder.\n     \n  2. Contact your HR/benefits team or the insurer/TPA.  \n     Ask whether you can opt out or terminate your individual coverage and what happens to the premium already paid.\n     \n  3. Submit a written cancellation/opt-out request if permitted. Keep the acknowledgement.\n     \n  4. Ask about continuity/alternative coverage.  \n     If your group cover is ending because you are leaving employment, don't assume that simply cancelling it is the best option. Ask the insurer about moving to an individual policy and preserving applicable continuity benefits.\n\n### If you are the master policyholder\n\nThe policy wording controls the cancellation procedure and refund. Group policy documents can specify advance written notice and may calculate refunds according to how long the policy has been in force. For example, older group-health policy wordings on IRDAI's site contain provisions requiring written notice and applying short-period refund scales; some also restrict refunds where claims have been made. [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/RELIGARE15/Group%20Care%20-%20Policy%20Terms%20Conditions%20-%20NE.pdf?utm_source=chatgpt.com) [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/Max15/Group%20Health%20Insurance.pdf?utm_source=chatgpt.com) \n\nSo, before cancelling:\n\n  * Check the cancellation/termination clause.\n    \n  * Confirm the required notice period.\n    \n  * Check whether a claim has been made or paid\u2026",

\nIf you tell me the insurance company and policy name (for example, Star Heal\u2026",

      "prompt": "What is the Co-Payment Clause in Group Health Insurance?",
      "vol": 0,
      "mentioned": false,
      "cited": false,
      "brands": [],
      "response": "A Co-Payment (Co-Pay) Clause in a Group Health Insurance policy means that the insured employee/member must pay a specified percentage of an admissible medical claim, while the insurer pays the remaining amount. IRDAI defines co-payment as a cost-sharing requirement, and importantly, co-pay does not reduce the policy's Sum Insured. [irdai.gov.in](https://irdai.gov.in/faqs-on-health-insurance-regulations?utm_source=chatgpt.com) [irdai.gov.in](https://irdai.gov.in/health-dept?utm_source=chatgpt.com) \n\n### Simple example\n\nSuppose your company's group health policy has:\n\n  * Sum Insured: \u20b95 lakh\n    \n  * Co-payment: 20%\n    \n  * Admissible hospital bill: \u20b92 lakh\n\nThen:\n\nAmount\\| Who pays  \n\\---\\|---  \n\u20b940,000 (20%)\\| You  \n\u20b91,60,000 (80%)\\| Insurance company  \n\u20b92,00,000\\|  Total admissible claim\n  \nYour \u20b95 lakh Sum Insured remains \u20b95 lakh ; the co-pay simply determines how the particular claim is shared. [irdai.gov.in](https://irdai.gov.in/faqs-on-health-insurance-regulations?utm_source=chatgpt.com) \n\n### What you should check in a group policy\n\nA co-payment clause can apply in different ways depending on the policy wording. Check whether the co-pay applies:\n\n  * to all claims or only certain treatments;\n    \n  * to specific hospitals/treatments/conditions ;\n    \n  * to claims for dependants or senior family members ;\n    \n  * to the entire admissible claim or a particular component.\n\nAlso distinguish co-pay from a deductible. A deductible is a specified amount that the insurer does not pay before coverage kicks in, whereas co-pay is generally a percentage of the admissible claim. [irdai.gov.in](https://irdai.gov.in/health-dept?utm_source=chatgpt.com) \n\nIn short: If your employer's group mediclaim says \u201c20% co-payment,\u201d you should generally expect to bear 20% of the admissible claim , with the insurer paying 80%, subject to the policy's other exclusions, limits and conditions.\n\nIf you share the exact co-payment clause from your company's Group Health Insurance policy , \u2026",

      "response": "If you\u2019re an employer in India, the usual route is to buy a Group Health Insurance (GHI) / Group Mediclaim policy for your employees. IRDAI permits employer\u2013employee groups to have group health insurance products, including one-year renewable policies. ([IRDAI](https://irdai.gov.in/documents/37343/365525/%E0%A4%9C%E0%A5%80%E0%A4%B5%E0%A4%A8%2B%E0%A4%AC%E0%A5%80%E0%A4%AE%E0%A4%BE%2B%E0%A4%89%E0%A4%A4%E0%A5%8D%E0%A4%AA%E0%A4%BE%E0%A4%A6%E0%A5%8B%E0%A4%82%2B%E0%A4%B8%E0%A4%82%E0%A4%AC%E0%A4%82%E0%A4%A7%E0%A5%80%2B%E0%A4%AE%E0%A4%BE%E0%A4%B8%E0%A5%8D%E0%A4%9F%E0%A4%B0%2B%E0%A4%AA%E0%A4%B0%E0%A4%BF%E0%A4%AA%E0%A4%A4%E0%A5%8D%E0%A4%B0%2B_%2BMaster%2BCircular%2Bon%2BLife%2BInsurance%2BProducts.pdf/d7ca89f3-b894-8c93-3e53-d8caf67a8ba6?t=1733233494424&version=2.1&utm_source=chatgpt.com))\n\n### How to buy it\n\n1. Decide who will be covered\n   - All employees or a defined employee category\n   - Spouse and children\n   - Parents/in-laws, if you want to offer them as an optional benefit\n   - New joiners during the policy year\n   \n2. Choose the coverage amount\n   \n   Common employer choices are:\n   - \u20b93 lakh per employee\n   - \u20b95 lakh\n   - \u20b910 lakh+\n   \n   For a small company, \u20b95 lakh base cover + optional parental cover is often a practical starting point.\n   \n3. Compare insurers/brokers\n   \n   Get quotes from several IRDAI-registered insurers or an insurance broker. Don't compare only the premium. Check:\n   - Hospital network\n   - Room-rent restrictions\n   - ICU limits\n   - Pre-existing disease coverage\n   - Waiting periods\n   - Maternity coverage\n   - Newborn coverage\n   - Day-care procedures\n   - Ambulance benefits\n   - Cashless claim process\n   - Claim turnaround/service\n   - Employee additions/deletions during the year\n   - Renewal terms and potential premium increases\n   \n   IRDAI maintains information on approved health insurance products. ([IRDAI](https://old.irdai.gov.in/ADMINCMS/cms/NormalData_Layout.aspx?mid=27.3.8&page=PageNo4220&utm_source=chatgpt.com))\n   \n4. Ask for a\u2026",

      "response": "*   In India, group mediclaim / group health insurance is generally purchased by an employer, association, bank, society, or other eligible group to cover multiple members under one master policy. IRDAI recognises group health products, and health insurance can be structured as either indemnity-based (reimburses eligible medical expenses) or benefit-based (pays a predefined amount). I IRDAI+1\n    \n    ### Main types of group mediclaim plans\n    \n    |Type|Who is covered?|Typical use|\n    |---|---|---|\n    |1\\. Employer\u2013Employee Group Mediclaim|Employees of a company|Standard corporate health insurance|\n    |2\\. Employee + Family Group Mediclaim|Employee + spouse + children, sometimes parents|Most common corporate plan|\n    |3\\. Group Family Floater|Employee and eligible dependants share one sum insured|E.g., \u20b910 lakh shared among 4 family members|\n    |4\\. Individual/Salaried Employee Cover within Group Policy|Each employee gets an individual sum insured|E.g., \u20b95 lakh per employee|\n    |5\\. Group Top-Up|Employees already covered under the base group policy|Adds extra cover after a specified deductible|\n    |6\\. Group Super Top-Up|Employee/family|Extra cover once aggregate medical expenses cross the deductible during the policy year|\n    |7\\. Group Personal Accident + Mediclaim combinations|Employees/members|Health cover combined with accident benefits|\n    |8\\. Group Critical Illness / Disease-Specific Cover|Employees and/or families|Lump-sum or additional cover for specified serious illnesses|\n    |9\\. Voluntary/Optional Group Cover|Employees who opt in and usually pay the additional premium|Higher SI, parents' cover, additional top-up, etc.|\n    |10\\. Association/Institutional Group Health Insurance|Members of an association, professional body, society, etc.|Non-employer groups|\n    \n    ### A key distinction: Individual vs Family Floater\n    \n    A \u20b910 lakh individual group cover means the employee has \u20b910 lakh available for their own claims.\n    \n    A \u20b910 lakh \u2026",

      "response": "Yes \u2014 in most cases, buying a personal top-up/super top-up alongside employer group health insurance is a smart idea, especially if your employer cover is only \u20b95\u201310 lakh.\n\nThe key is choosing the right type.\n\n### Why it makes sense\n\nYour employer's group policy is useful, but it has one major weakness: you can lose it when you leave the job, retire, or the employer changes the policy.\n\nA personal policy stays with you. IRDAI also provides migration/portability mechanisms for health insurance, including for people covered under group policies. ([IRDAI](https://irdai.gov.in/health-dept?utm_source=chatgpt.com))\n\nAlso, medical costs are rising rapidly in India; recent estimates put medical inflation around 12\u201314% annually, making a \u20b95\u201310 lakh corporate cover potentially inadequate for a major hospitalization. ([Reuters](https://www.reuters.com/legal/litigation/india-plans-insurance-reforms-rein-healthcare-costs-sources-say-2026-08-12/?utm_source=chatgpt.com))\n\n### Top-up vs Super Top-up \u2014 important distinction\n\nSuppose your corporate insurance is \u20b95 lakh and you buy another \u20b920 lakh cover with a \u20b95 lakh deductible.\n\nNormal top-up:  \nThe deductible generally applies per hospitalization/claim.\n\nSuper top-up:  \nThe deductible generally applies to aggregate eligible expenses during the policy year.\n\nFor example, with a \u20b95 lakh deductible:\n\n|Medical expenses during year|Normal top-up|Super top-up|\n|---|---:|---:|\n|\u20b93L + \u20b93L|Usually no top-up|Top-up can trigger after \u20b95L aggregate|\n|\u20b98L single hospitalization|Top-up triggers|Top-up triggers|\n|\u20b92L + \u20b92L + \u20b92L|Usually no top-up|Can trigger after \u20b95L aggregate|\n\nSo, I generally prefer a super top-up over a normal top-up when the objective is to supplement employer insurance.\n\n### A structure I like\n\nIf your employer gives you:\n\n\u20b95 lakh group cover\n\nI'd consider something like:\n\n\u20b95L corporate + \u20b920\u201350L personal super top-up\n\nrather than spending a lot of money immediately trying to make your base policy \u20b950 lakh.\n\nSuper top-ups \u2026",

roup policy. Section 80D is an individual/HUF deduction, whereas the employer'\u2026",

      "response": "In India, Group Insurance and ESI (Employees\u2019 State Insurance) are different types of employee benefits.\n\nPoint\\| Group Insurance\\| ESI  \n\\---\\|---\\|---  \nWhat it is\\|  Insurance policy purchased by an employer for employees\\| Government social-security scheme under the ESI Act  \nProvider\\|  Private/general health insurance company\\| ESIC (Employees\u2019 State Insurance Corporation)  \nWho is covered\\|  Employees who meet the employer's policy terms; dependents may also be covered\\| Eligible employees and their families, subject to ESI rules  \nCoverage\\|  Depends on the policy\u2014usually hospitalization/medical expenses; can include other benefits\\| Medical care plus sickness, maternity, disablement, dependants' benefits, etc. [ESI Scheme](https://esic.gov.in/press/ESIC%2520Employers%2520Booklet%2520English.pdf?utm_source=chatgpt.com)\ue201  \nPremium/contribution\\|  Usually paid by employer; sometimes employee contributes\\| Funded by both employer and employee through statutory contributions [EMPLOYEES\u2019 STATE INSURANCE SCHEME OF INDIA](https://esic.gov.in/attachments/citizens_charter/435aa370631fb916efa4a38c94478011.pdf?utm_source=chatgpt.com)\ue201  \nHospital choice\\|  Generally broader network depending on insurer\\| Treatment is through the ESI healthcare system and empanelled arrangements  \nIs it statutory?\\|  Generally a voluntary employee benefit\\| Statutory for establishments/employees who fall within ESI coverage  \nCan it be customized?\\|  Yes\u2014employer can choose sum insured, maternity, parents, room-rent limits, etc.\\| Benefits are prescribed by the ESI framework  \nMain purpose\\|  Private health/insurance protection\\| Comprehensive social security\n  \n### Simple example\n\nSuppose you work for a company:\n\n  * ESI: If you are an ESI-covered employee, you and eligible family members receive ESI benefits, and contributions are deducted/paid according to ESI rules.\n    \n  * Group Mediclaim: Your company may separately give you a \u20b95 lakh group health insurance policy. You can use it \u2026",

      "response": "*   If you\u2019re comparing group health insurance schemes for a growing company in India, don\u2019t choose based on premium alone. The cheapest policy can become expensive for employees when claims arise because of room-rent limits, co-pays, sub-limits, or exclusions. P Plum+1\n    \n    ### 1\\. Compare these areas first\n    \n    |Factor|What to look for|\n    |---|---|\n    |Sum insured|\u20b95 lakh+ per employee/family is a useful starting benchmark; adjust for employee locations and demographics|\n    |Room-rent limit|Prefer no room-rent cap or a sufficiently high limit|\n    |Pre-existing diseases|Ideally Day-1 coverage under the group policy|\n    |Waiting periods|Minimise disease-specific and maternity waiting periods|\n    |Co-pay|Prefer zero co-pay|\n    |Disease sub-limits|Avoid restrictive caps on cataract, cardiac procedures, cancer, etc.|\n    |Hospital network|Check the actual hospitals employees use, city by city\u2014not just the headline network number|\n    |Cashless claims|Check availability and ease of authorisation|\n    |Claims support|Look for dedicated corporate/employee support rather than only a generic call centre|\n    |Maternity/newborn|Check limits, waiting period, newborn coverage and complications|\n    |Parents|Decide whether parents are employer-paid, employee-paid, or excluded|\n    |Dependants|Compare spouse/children eligibility and family-floater rules|\n    |Restoration/recharge|Check whether exhausted cover can be restored and under what conditions|\n    |Consumables|Check whether commonly non-payable hospital items are covered|\n    |Renewal terms|Examine historical premium increases and renewal conditions|\n    |Administration|Compare enrolment, additions/deletions, e-cards, payroll integration and reporting|\n    \n    IRDAI permits employer-employee group health products, including one-year renewable group health insurance products, so annual renewal terms deserve particular attention. I IRDAI\n    \n    ### 2\\. Use a weighted score\u2014not just a quote comparison\n   \u2026",

      "vol": 0,

      "brands": [],
      "response": "Assuming you mean a group health insurance policy in India (for example, insurance provided by an employer), the claim process generally works like this:\n\n### Step-by-step group insurance claim process\n\n1\\. Check that you are covered\n\n*   Confirm that you are enrolled under the employer/group policy.\n    \n*   Check your sum insured, room-rent limits, waiting periods, exclusions, co-pay, and whether your family members are covered.\n    \n*   Keep your insurance/health card or policy/certificate number handy.\n    \n\n2\\. Inform the insurer/TPA  \nAs soon as hospitalization is planned or occurs, notify the insurer/TPA according to the policy's deadline. Exact deadlines vary by policy; some group policies specify notification within 24\u201348 hours. [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/HP1617/FGI_GroupHealthInsurance%28revised%29.pdf?utm_source=chatgpt.com) \n\nUsually, you can do this through:\n\n*   The insurer/TPA helpline\n    \n*   TPA/insurer app or website\n    \n*   The hospital insurance desk\n    \n*   Your employer's HR/insurance team\n    \n\n3\\. Choose cashless or reimbursement\n\nCashless: Go to a network hospital. The hospital sends a pre-authorization request to the insurer/TPA. If approved, the insurer pays the eligible hospital expenses directly, while you pay items such as non-covered expenses, deductibles or co-pay. [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/HP1617/Religare_Care.pdf?utm_source=chatgpt.com) \n\nReimbursement: You pay the hospital yourself and subsequently submit the claim documents to the insurer/TPA for reimbursement.\n\n4\\. For planned hospitalization  \nBefore admission, give the hospital your insurance details and ask its insurance desk to initiate cashless pre-authorization. The insurer checks your coverage and treatment eligibility before approving or declining the request. [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/HP1617/Religare_Care.pdf?utm_source=chatgpt.com) \n\n5\u2026",

      "response": "If you mean \u201cwaiting period in group insurance\u201d , it is the period during which certain benefits or claims are not yet payable after coverage begins.\n\n### What is a waiting period in group insurance?\n\nA waiting period is a specified time after the policy starts (or an employee becomes covered) during which the insurer may not pay claims for certain illnesses, treatments, or conditions.\n\nFor example, a group health policy might state that some illnesses are covered only after 30 days, while particular procedures may have a longer waiting period. IRDAI-hosted group policy documents illustrate both 30-day initial waiting periods and specific 24-month waiting periods. [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/SBI15/Group%20Health%20Insurance%20Policy.pdf?utm_source=chatgpt.com) [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/Max15/Group%20Health%20Insurance.pdf?utm_source=chatgpt.com) \n\n### Common types of waiting periods\n\nType\\| What it means\\| Example  \n\\---\\|---\\|---  \nInitial waiting period\\|  Applies shortly after coverage begins\\| Certain illnesses may not be covered for the first 30 days  \nSpecific disease waiting period\\|  Applies to listed illnesses/treatments\\| A particular procedure may have a 24-month wait  \nPre-existing disease waiting period\\|  Applies to conditions that existed before coverage\\| A pre-existing condition may be covered only after the specified period  \nMaternity waiting period\\|  Applies before maternity-related benefits become payable\\| Often specified separately in the policy  \nAccident-related claims\\|  Often treated differently from ordinary illness claims\\| Some policies waive the initial illness waiting period for accidents\n  \nThe exact periods vary by group policy , so the employer's policy wording and certificate of insurance are more important than any general rule.\n\n### Does every group insurance policy have a waiting period?\n\nNo. Some employer-sponsored group health policies pr\u2026",

  External: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M21 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h6"/></svg>,
  Doc: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>,

function fmtNum(n) { return typeof n === 'number' ? n.toLocaleString('en-US') : n; }
function fmtCompact(n) { return n >= 1000 ? (n/1000).toFixed(n >= 10000 ? 0 : 1).replace(/\.0$/, '') + 'k' : String(n); }

// ─── SPARKLINE ───
function Sparkline({ data, color = 'var(--acko-400)', width = 80, height = 26, seed = 1 }) {
  const points = useMemo(() => {
    if (!data || data.length === 0) return [0.5, 0.5];
    if (data.length === 1) return [data[0], data[0]];
    const min = Math.min(...data);
    const max = Math.max(...data);
    const range = max - min || 1;
    return data.map(v => (v - min) / range);
  }, [data]);
  const pts = points.map((v,i) => [(i/(points.length-1))*width, height - v*(height-4) - 2]);
  const d = pts.map((p,i) => (i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const fillD = d + ` L ${width},${height} L 0,${height} Z`;
  const id = 'sg'+seed;
  return <svg className="kpi-spark" viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none" width="100%" height={height}>
    <defs><linearGradient id={id} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity="0.35"/><stop offset="100%" stopColor={color} stopOpacity="0"/></linearGradient></defs>
    <path d={fillD} fill={`url(#${id})`}/><path d={d} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/>
    <circle cx={pts[pts.length-1][0]} cy={pts[pts.length-1][1]} r="2" fill={color}/>
  </svg>;
}

}

// ─── KPI ───
function Kpi({ label, value, caption, isAcko, sparkData, sparkSeed, delta, deltaDir, info }) {
  const valNode = typeof value === 'string' && value.includes('%')
    ? <>{value.replace('%','')}<span className="unit">%</span></> : value;
  const isText = typeof value === 'string' && (value.includes('/') || /[A-Za-z]/.test(value));
  return <div className={'kpi '+(isAcko?'acko':'')}>
    <div className="kpi-label">{isAcko && <span className="dot"/>}{label}{info && <InfoTip text={info}/>}</div>
    <div className={'kpi-value '+(isText?'text':'')}>{valNode}</div>
    <Sparkline data={sparkData} seed={sparkSeed||1} color={isAcko?'var(--acko-400)':'var(--info)'}/>
    <div className="kpi-caption"><span>{caption}</span>
      {delta && <span className={'kpi-delta '+(deltaDir==='up'?'up':'down')}>{deltaDir==='up'?<Icon.Up/>:<Icon.Down/>}{delta}</span>}
    </div>
  </div>;
}

function KpiGrid() {
  const k = window.GEO_DATA.kpis;
  const [periodA] = window.__periodA || [null];
  const [periodB] = window.__periodB || [null];
  const [comparing] = window.__comparing || [false];

  // ─── Helper: get KPI snapshot for a date (from KPI_HISTORY) ───
  const getKpi = (date) => {
    if(!date || !window.KPI_HISTORY) return null;
    if(window.KPI_HISTORY[date]) return window.KPI_HISTORY[date];
    const dates = Object.keys(window.KPI_HISTORY).sort();
    // Try closest earlier date first
    const earlier = dates.filter(d => d <= date);
    if(earlier.length) return window.KPI_HISTORY[earlier[earlier.length-1]];
    // If no earlier date exists, use closest later date
    const later = dates.filter(d => d > date);
    return later.length ? window.KPI_HISTORY[later[0]] : null;
  };
  const kpiA = getKpi(periodA);
  const kpiB = comparing ? getKpi(periodB) : null;

  // ─── SoV ───
  const sovA = periodA && window.SOV_HISTORY[periodA] ? window.SOV_HISTORY[periodA]["Acko"] : k.shareOfVoice.value;
  const sovB = periodB && comparing && window.SOV_HISTORY[periodB] ? window.SOV_HISTORY[periodB]["Acko"] : null;

  const getRank = (date) => {
    if(!date || !window.SOV_HISTORY[date]) return null;
    const sorted = Object.entries(window.SOV_HISTORY[date]).sort((a,b)=>b[1]-a[1]);
    return {rank: sorted.findIndex(e=>e[0]==="Acko")+1, total: sorted.length};
  };
  const rankA = getRank(periodA);
  const sovCaption = rankA ? `Rank #${rankA.rank} of ${rankA.total} brands` : k.shareOfVoice.caption;

  const sovDelta = comparing && sovB !== null ? (sovA - sovB).toFixed(1) : null;
  const sovDeltaDir = sovDelta > 0 ? 'up' : sovDelta < 0 ? 'down' : null;

  // ─── Mentioned ───
  const mentA = kpiA ? kpiA.mentioned_count : parseInt(k.mentioned.value);
  const mentTotalA = kpiA ? kpiA.mentioned_total : parseInt(k.mentioned.value.split('/')[1]);
  const mentVal = `${mentA}/${mentTotalA}`;
  const mentPct = mentTotalA > 0 ? Math.round(mentA/mentTotalA*100) : 0;
  const mentCaption = `${mentPct}% of AI responses`;
  const mentDeltaRaw = comparing && kpiB ? mentA - kpiB.mentioned_count : (k.mentioned.delta ? parseInt(k.mentioned.delta) : null);
  const mentDelta = mentDeltaRaw !== null && mentDeltaRaw !== 0 ? (mentDeltaRaw > 0 ? '+' : '') + mentDeltaRaw : null;
  const mentDeltaDir = mentDeltaRaw > 0 ? 'up' : mentDeltaRaw < 0 ? 'down' : null;

  // ─── Cited ───
  const citeA = kpiA ? kpiA.cited_count : parseInt(k.cited.value);
  const citeTotalA = kpiA ? kpiA.cited_total : parseInt(k.cited.value.split('/')[1]);
  const citeVal = `${citeA}/${citeTotalA}`;
  const citePct = citeTotalA > 0 ? Math.round(citeA/citeTotalA*100) : 0;
  const citeCaption = `acko.com linked in ${citePct}% responses`;
  const citeDeltaRaw = comparing && kpiB ? citeA - kpiB.cited_count : (k.cited.delta ? parseInt(k.cited.delta) : null);
  const citeDelta = citeDeltaRaw !== null && citeDeltaRaw !== 0 ? (citeDeltaRaw > 0 ? '+' : '') + citeDeltaRaw : null;
  const citeDeltaDir = citeDeltaRaw > 0 ? 'up' : citeDeltaRaw < 0 ? 'down' : null;

  // ─── Total AI Search Volume ───
  const volA = kpiA ? kpiA.total_volume : k.aiSearchVol.value;
  const volTotalA = kpiA ? kpiA.mentioned_total : parseInt(String(k.aiSearchVol.caption).match(/\d+/)?.[0] || '0');
  const volCaption = `Across ${volTotalA} tracked prompts`;
  const volDeltaRaw = comparing && kpiB ? volA - kpiB.total_volume : null;
  const volDelta = volDeltaRaw !== null && volDeltaRaw !== 0 ? (volDeltaRaw > 0 ? '+' : '') + fmtNum(Math.abs(volDeltaRaw)) : null;
  const volDeltaDir = volDeltaRaw > 0 ? 'up' : volDeltaRaw < 0 ? 'down' : null;

  // ─── Volume Reach ───
  const vrA = kpiA ? kpiA.volume_reach : k.volumeReach.value;
  const vrPct = volA > 0 ? Math.round(vrA/volA*100) : 0;
  const vrCaption = `${vrPct}% of total volume`;
  const vrDeltaRaw = comparing && kpiB ? vrA - kpiB.volume_reach : (k.volumeReach.delta ? parseInt(String(k.volumeReach.delta).replace(/,/g,'')) : null);
  const vrDelta = vrDeltaRaw !== null && vrDeltaRaw !== 0 ? (vrDeltaRaw > 0 ? '+' : '') + fmtNum(Math.abs(vrDeltaRaw)) : null;
  const vrDeltaDir = vrDeltaRaw > 0 ? 'up' : vrDeltaRaw < 0 ? 'down' : null;

  // ─── Top Competitor ───
  const getTopComp = (date) => {
    if(!date || !window.SOV_HISTORY[date]) return null;
    const sorted = Object.entries(window.SOV_HISTORY[date]).sort((a,b)=>b[1]-a[1]);
    return {name: sorted[0][0], sov: sorted[0][1].toFixed(1)};
  };
  const topA = getTopComp(periodA);
  const topB = getTopComp(periodB);
  const topDelta = comparing && topA && topB ? (parseFloat(topA.sov) - parseFloat(topB.sov)).toFixed(1) : null;
  const topDeltaDir = topDelta > 0 ? 'up' : topDelta < 0 ? 'down' : null;

  // ─── Build sparkline data from real history ───
  const buildSparkData = (extractor) => {
    const sovDates = Object.keys(window.SOV_HISTORY || {});
    const kpiDates = Object.keys(window.KPI_HISTORY || {});
    const allDates = [...new Set([...sovDates, ...kpiDates])].sort();
    return allDates.map(d => extractor(d)).filter(v => v !== null && v !== undefined);
  };

  const sparkSov = buildSparkData(d => {
    if(window.SOV_HISTORY[d] && window.SOV_HISTORY[d]["Acko"] !== undefined) return window.SOV_HISTORY[d]["Acko"];
    const kpi = window.KPI_HISTORY[d];
    return kpi && kpi.sov !== undefined ? kpi.sov : null;
  });
  const sparkMent = buildSparkData(d => { const kpi = window.KPI_HISTORY[d]; return kpi ? kpi.mentioned_count : null; });
  const sparkCite = buildSparkData(d => { const kpi = window.KPI_HISTORY[d]; return kpi ? kpi.cited_count : null; });
  const sparkVol = buildSparkData(d => { const kpi = window.KPI_HISTORY[d]; return kpi ? kpi.total_volume : null; });
  const sparkVr = buildSparkData(d => { const kpi = window.KPI_HISTORY[d]; return kpi ? kpi.volume_reach : null; });
  const sparkTopComp = buildSparkData(d => {
    if(!window.SOV_HISTORY[d]) return null;
    const sorted = Object.entries(window.SOV_HISTORY[d]).sort((a,b)=>b[1]-a[1]);
    return sorted.length ? sorted[0][1] : null;
  });

  return <div className="kpi-grid">
    <Kpi label="ACKO Share of Voice" value={sovA.toFixed?sovA.toFixed(1)+'%':sovA+'%'} caption={sovCaption} isAcko sparkData={sparkSov} sparkSeed={1} delta={sovDelta?sovDelta+'pp':null} deltaDir={sovDeltaDir} info="Percentage of all AI-generated responses (across tracked prompts) where ACKO appears, relative to all brand appearances. Higher SoV = ACKO dominates more AI conversations."/>
    <Kpi label="ACKO Mentioned" value={mentVal} caption={mentCaption} isAcko sparkData={sparkMent} sparkSeed={2} delta={mentDelta} deltaDir={mentDeltaDir} info="Number of tracked AI prompts where 'ACKO' is explicitly named in the response text. Format: mentioned / total prompts tracked."/>
    <Kpi label="ACKO Cited" value={citeVal} caption={citeCaption} isAcko sparkData={sparkCite} sparkSeed={3} delta={citeDelta} deltaDir={citeDeltaDir} info="Number of tracked AI prompts where acko.com is linked as a source in the response. Being cited means the AI treats ACKO's content as authoritative."/>
    <Kpi label="Total AI Search Volume" value={fmtNum(volA)} caption={volCaption} sparkData={sparkVol} sparkSeed={4} delta={volDelta} deltaDir={volDeltaDir} info="Combined monthly search volume of all tracked prompts. Represents the total addressable audience asking these questions in AI search."/>
    <Kpi label="ACKO Volume Reach" value={fmtNum(vrA)} caption={vrCaption} isAcko sparkData={sparkVr} sparkSeed={5} delta={vrDelta} deltaDir={vrDeltaDir} info="Monthly search volume of prompts where ACKO is mentioned. Shows how much of the total AI search audience is actually seeing ACKO in answers."/>
    <Kpi label="Top Competitor" value={topA?topA.name:k.topCompetitor.value} caption={topA?topA.sov+'% SoV':k.topCompetitor.caption} sparkData={sparkTopComp} sparkSeed={6} delta={topDelta?topDelta+'pp':null} deltaDir={topDeltaDir} info="The brand with the highest Share of Voice across all tracked prompts. This is the dominant player ACKO is competing against in AI responses."/>
  </div>;
}

          <div className="bar-value">{formatValue?formatValue(d[valueKey]):d[valueKey]}</div>
        </div>
      </Tip>;
    })}
  </div>;
}

      </div>
      <div><div style={{fontSize:10,textTransform:'uppercase',letterSpacing:'0.12em',color:'var(--fg-3)',fontWeight:600,marginBottom:10}}>Status</div>
        <div style={{padding:14,background:'var(--surface-2)',border:'1px solid var(--border)',borderRadius:'var(--radius)',fontSize:13,lineHeight:1.6}}>
          {row.mentioned&&row.cited&&<span style={{color:'var(--good)'}}>✓ ACKO is performing well — both mentioned and cited.</span>}
          {!row.mentioned&&!row.cited&&<span style={{color:'var(--bad)'}}>✗ ACKO is missing entirely from this response.</span>}
          {!row.mentioned&&row.cited&&<span style={{color:'var(--warn)'}}>◐ ACKO is cited but not mentioned by name.</span>}
          {row.mentioned&&!row.cited&&<span style={{color:'var(--warn)'}}>◐ ACKO is mentioned but not cited as a source.</span>}
        </div>
      </div>
      <div><div style={{fontSize:10,textTransform:'uppercase',letterSpacing:'0.12em',color:'var(--fg-3)',fontWeight:600,marginBottom:10}}>ChatGPT response {links.length>0&&<span style={{fontWeight:400,color:'var(--fg-4)',textTransform:'none',letterSpacing:0,fontSize:11,marginLeft:6}}>{links.length} source{links.length!==1?'s':''} cited</span>}</div>
        {resp ? <div className="drawer-response-wrap">
          <div className="drawer-response">{resp}</div>
          {links.length>0 && <div className="drawer-cited-sidebar">
            <h4>Cited pages ({links.length})</h4>
            {sortedLinks.map((l,i)=><a key={i} className={'cited-link'+(l.url.toLowerCase().includes('acko.com')?' acko-link':'')} href={l.url} target="_blank" rel="noopener noreferrer">
              <span className="cited-title">{l.title||'Untitled'}</span>
              <span className="cited-url">{l.url}</span>
            </a>)}
          </div>}
        </div> : <div className="drawer-no-response">Response data not available for this prompt.</div>}
      </div>
    </div>
  </div></div>;
}

function volBucket(v) { return v>=5000?{cls:'high'}:v>=1500?{cls:'med'}:{cls:'low'}; }

function PromptsCard() {
  const data = window.GEO_DATA.prompts;
  const [search, setSearch] = useState('');
  const [filter, setFilter] = useState('all');
  const [sort, setSort] = useState({key:'vol',dir:'desc'});
  const [active, setActive] = useState(null);
  const maxVol = Math.max(...data.map(d=>d.vol));
  const counts = {all:data.length, mentioned:data.filter(d=>d.mentioned).length, notMentioned:data.filter(d=>!d.mentioned).length, cited:data.filter(d=>d.cited).length, notCited:data.filter(d=>!d.cited).length};
  const rows = useMemo(()=>{
    let r = data;
    if(filter==='mentioned') r=r.filter(d=>d.mentioned);
    if(filter==='notMentioned') r=r.filter(d=>!d.mentioned);
    if(filter==='cited') r=r.filter(d=>d.cited);
    if(filter==='notCited') r=r.filter(d=>!d.cited);
    if(search){const q=search.toLowerCase();r=r.filter(d=>d.prompt.toLowerCase().includes(q)||d.brands.some(b=>b.toLowerCase().includes(q)));}
    r=[...r].sort((a,b)=>{const dir=sort.dir==='desc'?-1:1;if(sort.key==='vol')return(a.vol-b.vol)*dir;if(sort.key==='prompt')return a.prompt.localeCompare(b.prompt)*dir;return 0;});
    return r;
  },[filter,search,sort]);
  const setSortKey=(k)=>setSort(s=>s.key===k?{...s,dir:s.dir==='desc'?'asc':'desc'}:{key:k,dir:'desc'});
  const arrow=(k)=>sort.key===k?<span className="sort-arrow">{sort.dir==='desc'?'▼':'▲'}</span>:<span className="sort-arrow">⇅</span>;
  return <div className="card">
    <div className="card-header"><div><div className="card-title"><span className="accent"/><span>Prompt-Level Breakdown</span><InfoTip text="Every tracked AI search prompt with its monthly search volume, whether ACKO is mentioned in the response, and whether acko.com is cited as a source. Filter to find gaps and opportunities."/><span className="count">{rows.length} of {data.length} prompts</span></div></div></div>
    <div className="filter-bar">
      <div className="search"><Icon.Search/><input placeholder="Search prompts or brands…" value={search} onChange={e=>setSearch(e.target.value)}/></div>
      {[['all','All Prompts'],['mentioned','ACKO Mentioned'],['notMentioned','ACKO Not Mentioned'],['cited','ACKO Cited'],['notCited','ACKO Not Cited']].map(([k,l])=>
        <button key={k} className={'filter-chip '+(filter===k?'active':'')} onClick={()=>setFilter(k)}>{l} <span className="ct">{counts[k]}</span></button>
      )}
    </div>
    <div className="table-wrap"><table className="table"><thead><tr>
      <th className="sortable" onClick={()=>setSortKey('prompt')}>Prompt {arrow('prompt')}</th>
      <th className="num sortable" style={{width:160}} onClick={()=>setSortKey('vol')}>AI Volume {arrow('vol')}</th>
      <th style={{width:110}}>Mentioned</th><th style={{width:110}}>Cited</th><th>Brands Present</th><th style={{width:36}}></th>
    </tr></thead><tbody>
      {rows.map(r=>{const b=volBucket(r.vol);return <tr key={r.prompt} onClick={()=>setActive(r)} style={{cursor:'pointer'}}>
        <td style={{maxWidth:480}}>{r.prompt}</td>
        <td className="num"><span className={'vol-cell '+b.cls}><span className="vbar"><span style={{width:(r.vol/maxVol)*100+'%'}}/></span>{fmtNum(r.vol)}</span></td>
        <td>{r.mentioned?<span className="tag-yes">Yes</span>:<span className="tag-no">No</span>}</td>
        <td>{r.cited?<span className="tag-yes">Yes</span>:<span className="tag-no">No</span>}</td>
        <td>{r.brands.length?r.brands.map(b=><span key={b} className={'brand-chip '+(b==='Acko'?'acko':'')}>{b}</span>):<span className="dim">—</span>}</td>
        <td style={{color:'var(--fg-4)',textAlign:'right'}}>›</td>
      </tr>;})}
    </tbody></table></div>
    <PromptDrawer row={active} onClose={()=>setActive(null)}/>
  </div>;
}

// ─── GAP ANALYSIS ───
function GapQuadrant() {
  const data = window.GEO_DATA.prompts;
  const W=720,H=420,PAD=50;
  const maxVol = Math.max(...data.map(d=>d.vol));
  const score=(d)=>(d.mentioned?1.5:0)+(d.cited?1.5:0);
  const points = data.map((d,i)=>{
    const lx=Math.log10(d.vol+10),lxMax=Math.log10(maxVol+10);
    const x=PAD+(lx/lxMax)*(W-PAD*2), y=H-PAD-(score(d)/3)*(H-PAD*2);
    return {...d,x,y,score:score(d),idx:i};
  });
  const [hover,setHover]=useState(null);
  return <div className="quadrant"><svg className="quadrant-svg" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid meet">
    <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" strokeWidth="1"/></pattern>
      <linearGradient id="qbg-tl" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stopColor="rgba(74,222,128,0.08)"/><stop offset="100%" stopColor="transparent"/></linearGradient>
      <linearGradient id="qbg-br" x1="1" y1="1" x2="0" y2="0"><stop offset="0%" stopColor="rgba(255,100,112,0.10)"/><stop offset="100%" stopColor="transparent"/></linearGradient>
    </defs>
    <rect width={W} height={H} fill="url(#grid)"/>
    <rect x={W/2} y={PAD} width={W/2-PAD} height={(H-PAD*2)/2} fill="url(#qbg-tl)"/>
    <rect x={W/2} y={H/2} width={W/2-PAD} height={(H-PAD*2)/2} fill="url(#qbg-br)"/>
    <line x1={PAD} y1={H-PAD} x2={W-PAD} y2={H-PAD} stroke="rgba(255,255,255,0.15)"/>
    <line x1={PAD} y1={PAD} x2={PAD} y2={H-PAD} stroke="rgba(255,255,255,0.15)"/>
    <line x1={W/2} y1={PAD} x2={W/2} y2={H-PAD} stroke="rgba(255,255,255,0.06)" strokeDasharray="3 4"/>
    <line x1={PAD} y1={H/2} x2={W-PAD} y2={H/2} stroke="rgba(255,255,255,0.06)" strokeDasharray="3 4"/>
    <text x={W-PAD-12} y={PAD+18} textAnchor="end" fill="var(--good)" fontSize="11" fontFamily="var(--font-mono)" letterSpacing="0.08em">★ HIGH-VOLUME WINS</text>
    <text x={W-PAD-12} y={H-PAD-10} textAnchor="end" fill="var(--bad)" fontSize="11" fontFamily="var(--font-mono)" letterSpacing="0.08em">⚠ HIGH-VOLUME GAPS</text>
    <text x={PAD+12} y={PAD+18} fill="var(--fg-4)" fontSize="11" fontFamily="var(--font-mono)">LOW-VOL WINS</text>
    <text x={PAD+12} y={H-PAD-10} fill="var(--fg-4)" fontSize="11" fontFamily="var(--font-mono)">LOW-VOL GAPS</text>
    <text x={W/2} y={H-14} textAnchor="middle" fill="var(--fg-3)" fontSize="11" fontFamily="var(--font-mono)">AI SEARCH VOLUME →</text>
    <text x={16} y={H/2} textAnchor="middle" fill="var(--fg-3)" fontSize="11" fontFamily="var(--font-mono)" transform={`rotate(-90 16 ${H/2})`}>ACKO PERFORMANCE →</text>
    {points.map(p=>{
      const color=p.mentioned&&p.cited?'var(--good)':!p.mentioned&&!p.cited?'var(--bad)':'var(--warn)';
      const r=5+Math.log10(p.vol+10);
      return <g key={p.idx} onMouseEnter={()=>setHover(p)} onMouseLeave={()=>setHover(null)} style={{cursor:'pointer'}}>
        <circle cx={p.x} cy={p.y} r={r+4} fill={color} opacity="0.15"/><circle cx={p.x} cy={p.y} r={r} fill={color} opacity="0.85" stroke="var(--ink-1)" strokeWidth="1.5"/>
      </g>;
    })}
    {hover && <g pointerEvents="none">
      <rect x={Math.min(hover.x+12,W-280)} y={Math.max(hover.y-50,10)} width="270" height="48" rx="6" fill="#000" stroke="var(--border-strong)"/>
      <text x={Math.min(hover.x+22,W-270)} y={Math.max(hover.y-32,28)} fill="var(--fg-1)" fontSize="11">{hover.prompt.length>40?hover.prompt.slice(0,38)+'…':hover.prompt}</text>
      <text x={Math.min(hover.x+22,W-270)} y={Math.max(hover.y-16,44)} fill="var(--fg-3)" fontSize="10" fontFamily="var(--font-mono)">vol {fmtNum(hover.vol)} · {hover.mentioned?'mentioned':'no mention'} · {hover.cited?'cited':'no citation'}</text>
    </g>}
  </svg></div>;
}

function PriorityList() {
  const missing = window.GEO_DATA.gapsMissing;
  const wins = window.GEO_DATA.gapsWins;
  const items = [...missing.map(m=>({...m,type:'miss'})), ...wins.map(w=>({...w,type:'win',brands:[]}))].sort((a,b)=>b.vol-a.vol);
  return <div className="priority-list">{items.map((it,i)=>
    <div key={it.prompt+i} className="priority-item">
      <div className="priority-rank">{String(i+1).padStart(2,'0')}</div>
      <div><div className="priority-prompt">{it.prompt}</div>
        {it.brands&&it.brands.length>0&&<div style={{marginTop:4}}><span className="dim" style={{fontSize:11,marginRight:6}}>Competitors:</span>{it.brands.map(b=><span key={b} className="brand-chip">{b}</span>)}</div>}
      </div>
      <div className="priority-vol">{fmtNum(it.vol)}</div>
      <div className={'priority-tag '+(it.type==='miss'?'miss':'win')}>{it.type==='miss'?'Gap':'Win'}</div>
    </div>
  )}</div>;
}

function GapAnalysisSection() {
  const [view,setView]=useState('quadrant');
  return <div className="card">
    <div className="card-header"><div><div className="card-title"><span className="accent"/><span>Gap Analysis</span><InfoTip text="Visualises where ACKO is winning (mentioned + cited) vs missing (neither mentioned nor cited) across all tracked prompts. High-volume gaps in the bottom-right quadrant are top priorities for GEO optimisation."/></div><div className="card-subtitle">Where ACKO is winning vs missing across tracked prompts</div></div>
      <div className="card-actions"><button className={'filter-chip '+(view==='quadrant'?'active':'')} onClick={()=>setView('quadrant')}>Quadrant</button><button className={'filter-chip '+(view==='list'?'active':'')} onClick={()=>setView('list')}>Priority list</button></div>
    </div>
    {view==='quadrant'?<><GapQuadrant/><div className="quad-legend">
      <span><span className="lg-dot" style={{background:'var(--good)'}}/>ACKO mentioned + cited</span>
      <span><span className="lg-dot" style={{background:'var(--warn)'}}/>Mentioned or cited (partial)</span>
      <span><span className="lg-dot" style={{background:'var(--bad)'}}/>ACKO missing</span>
      <span style={{marginLeft:'auto',color:'var(--fg-4)'}}>Bubble size = log(volume)</span>
    </div></>:<PriorityList/>}
  </div>;
}

// ─── APP ───
function App() {
  const [active, setActive] = useState('overview');
  const dates = Object.keys(window.SOV_HISTORY).sort();
  const periodAState = useState(dates[dates.length-1]);
  const periodBState = useState(dates.length>1 ? dates[dates.length-2] : dates[0]);
  const comparingState = useState(false);
  const [updateTick, setUpdateTick] = useState(0);
  window.__periodA = periodAState;
  window.__periodB = periodBState;
  window.__comparing = comparingState;
  window.__triggerUpdate = () => setUpdateTick(t=>t+1);
  const periodA = periodAState[0];
  const periodB = periodBState[0];
  const comparing = comparingState[0];
  // Track scroll position to highlight sidebar
  useEffect(()=>{
    const handler=()=>{
      const sections=['overview','brands','domains','prompts','gaps'];
      for(let i=sections.length-1;i>=0;i--){
        const el=document.getElementById('section-'+sections[i]);
        if(el&&el.getBoundingClientRect().top<200){setActive(sections[i]);break;}
      }
    };
    const main=document.querySelector('.main');
    if(main) main.addEventListener('scroll',handler);
    window.addEventListener('scroll',handler);
    return ()=>{if(main)main.removeEventListener('scroll',handler);window.removeEventListener('scroll',handler);};
  },[]);

  return <div className="app">
    <Sidebar active={active} onNav={setActive}/>
    <main className="main">
      <div id="section-overview" className="scroll-anchor"/>
      <Header/>
      <PeriodBar/>
      <KpiGrid/>

      <div id="section-brands" className="scroll-anchor"/>
      <div className="row-2col"><ShareOfVoiceCard/><MentionsCard/></div>

      <div id="section-domains" className="scroll-anchor"/>
      <div className="row-2col"><DomainsCard/><AckoPagesCard/></div>

      <div id="section-prompts" className="scroll-anchor"/>
      <div style={{marginBottom:24}}><PromptsCard/></div>

      <div id="section-gaps" className="scroll-anchor"/>
      <GapAnalysisSection/>

      <div style={{marginTop:60,padding:'24px 0',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between',color:'var(--fg-4)',fontSize:11,fontFamily:'var(--font-mono)'}}>
        <span>ACKO GEO · Report {window.GEO_DATA.meta.reportId} · Source {window.GEO_DATA.meta.source}</span>
        <span>© 2026 Acko · Generated {window.GEO_DATA.meta.generatedAt}</span>
      </div>
    </main>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
