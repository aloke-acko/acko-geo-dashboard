      "response": "A group insurance policy is an insurance plan purchased by an employer to cover a group of employees, often with options to include their dependents. In India, group health policies can cover expenses such as hospitalization, surgery, diagnostics, medicines, and certain pre- and post-hospitalization expenses, depending on the policy terms. [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/Max15/Group%20Health%20Insurance.pdf?utm_source=chatgpt.com) \n\n### Key benefits for employees\n\n1. Health and financial protection  \n   It helps employees manage large medical expenses without having to pay the entire cost from their own savings.\n   \n2. Coverage for family members  \n   Many employer plans allow employees to add spouses, children, and sometimes parents, providing broader family protection.\n   \n3. Lower cost than individual insurance  \n   Because the employer buys coverage for a group, the cost per person can often be more favorable than purchasing an equivalent individual policy.\n   \n4. Access to broader benefits  \n   Depending on the plan, employees may receive hospitalization, day-care treatment, pre/post-hospitalization, critical illness, accident, or preventive-health benefits. [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/BHARTI15/Group%20Health%20Insurance%20Policy.pdf?utm_source=chatgpt.com) \n   \n5. Convenient administration  \n   The employer generally handles enrollment and premium administration, making it easier for employees than arranging a separate policy themselves.\n   \n6. Employee retention and job satisfaction  \n   Insurance is a valuable employee benefit. A good health-insurance package can make employees feel more financially secure and valued by their employer.\n   \n7. Reduced financial stress  \n   Unexpected illness or hospitalization can create significant financial pressure. Insurance provides a safety net, allowing employees to focus more on recovery.\n   \n8. Potential tax benefits  \n   Depending on h\u2026",

      "prompt": "How are group health insurance premiums calculated?",
      "vol": 10,
      "mentioned": false,
      "cited": false,
      "brands": [],
      "response": "Group health insurance premiums are usually calculated by estimating the expected healthcare cost of the entire group, then adding expenses, risk margins, and applicable taxes. In India, IRDAI says pricing can consider age and other relevant risk factors, while insurers also use actuarial data such as morbidity, past claims, expenses, and medical inflation. [irdai.gov.in](https://irdai.gov.in/faqs-on-health-insurance-regulations?utm_source=chatgpt.com) \n\n### The main factors\n\n1. Number of people covered\n   - Employees\n   - Spouses and children\n   - Parents, if included  \n     More covered people generally means a higher total premium.\n   \n2. Age profile\n   A group with an older average age will generally cost more because expected healthcare utilisation tends to be higher. Age is explicitly a pricing factor under IRDAI's health-insurance pricing principles. [irdai.gov.in](https://irdai.gov.in/faqs-on-health-insurance-regulations?utm_source=chatgpt.com) \n   \n3. Sum insured\n   For example, \u20b93 lakh, \u20b95 lakh or \u20b910 lakh per employee.\n   \n   Higher coverage generally produces a higher premium.\n   \n4. Past claims experience\n   This can be particularly important for an established corporate group. If the group's claims have been high relative to its premium, the insurer may price the renewal higher; favourable claims experience can work in the opposite direction. [www.zurichkotak.com](https://www.zurichkotak.com/knowledge-center/health-insurance/how-is-group-health-insurance-premium-calculated?utm_source=chatgpt.com) \n   \n5. Benefits and policy design\n   Premium changes depending on whether you include things such as:\n   - Maternity\n   - Newborn coverage\n   - Parents\n   - OPD\n   - Room-rent limits\n   - Disease sub-limits\n   - Deductibles/co-payments\n   - Higher hospital/network coverage\n   \n6. Occupation and employee risk\n   The nature of the workforce can affect expected claims\u2014for example, an office-based workforce versus employees in more physically hazardous occupation\u2026",

      "response": "Yes\u2014IPD (In-Patient Department) treatment is generally covered under group health insurance , provided the treatment meets the policy\u2019s hospitalization conditions.\n\nTypically covered expenses can include:\n\n  * Hospital room and nursing charges\n    \n  * Doctor/surgeon/consultant fees\n    \n  * ICU charges\n    \n  * Medicines, investigations, OT charges\n    \n  * Certain implants and procedures\n    \n  * Pre- and post-hospitalization expenses, if included in the policy\n\nIRDAI-hosted group mediclaim policy documents describe coverage for medically necessary hospitalization as an inpatient, subject to the policy\u2019s sum insured, limits, exclusions and conditions. [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/United15/Group_Health_Policy.pdf?utm_source=chatgpt.com) [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/United15/UI_Health_Royal_Group_Health_Insurance_Scheme.pdf?utm_source=chatgpt.com) \n\nImportant: IPD does not automatically mean every hospital admission is covered. Your employer's specific group policy may have exclusions, room-rent limits, disease/procedure sub-limits, waiting periods, co-pay, or network-hospital requirements.\n\nIf you tell me what treatment/procedure you mean by IPD (or share the relevant page of your group health policy), I can tell you whether it is likely to be covered and what expenses may be payable.",

      "response": "If you mean employer-sponsored group health insurance in India for a company with roughly 10\u201350 employees, it can be a very practical employee benefit\u2014but the policy wording matters much more than simply comparing premiums.\n\n### What employers should know\n\n1\\. There is no special \u201c10\u201350 employee\u201d product requirement.  \nGroup health insurance can cover an employer\u2013employee group, and insurers price group health policies based on factors such as age and other relevant risk characteristics. [irdai.gov.in](https://irdai.gov.in/faqs-on-health-insurance-regulations?utm_source=chatgpt.com) \n\n2\\. Decide exactly what you are covering\nFor a small company, common structures are:\n- Employee only\n- Employee + spouse\n- Employee + children\n- Employee + spouse + children\n- Optional parent/parent-in-law cover, usually paid partly or wholly by the employee\n\nYou should also decide whether every employee gets the same sum insured or whether different grades receive different limits.\n\n3\\. Pay close attention to the actual benefits\nDon't choose based solely on the \u20b9X lakh sum insured. Compare:\n- Room-rent limits\n- ICU limits\n- Co-payments\n- Deductibles\n- Disease/sub-limits\n- Pre- and post-hospitalisation coverage\n- Day-care procedures\n- Ambulance\n- Maternity and newborn cover\n- Pre-existing disease waiting periods\n- Cashless hospital network\n- Claim process/TPA\n- Restoration/reinstatement of the sum insured\n- Employee/dependent eligibility\n- Coverage when an employee joins or leaves during the year\n\nIRDAI maintains health-insurance regulations and an official list of registered health insurers. [irdai.gov.in](https://irdai.gov.in/faqs-on-health-insurance-regulations?utm_source=chatgpt.com) \n\n4\\. Maternity can materially change the price.  \nIf your workforce is relatively young, maternity coverage can be valuable, but check the waiting period, maternity limit, newborn coverage and number of deliveries covered rather than assuming \u201cmaternity included\u201d means comprehensive coverage.\n\n5\\. Ask\u2026",

      "response": "In India, Group Health Insurance and Family Floater Health Insurance are different concepts, although a group policy can itself offer a family-floater option.\n\n### Key difference\n\n|Feature|Group Health Insurance|Family Floater Insurance|\n|---|---|---|\n|Who buys it?|Usually employer/organization|Individual/family|\n|Who is covered?|Employees and sometimes dependents|Family members included in the policy|\n|Sum insured|Depends on employer's policy; can be individual or floater|One common sum insured shared by family|\n|Example|Employer gives \u20b95 lakh cover to employee + spouse + children|You buy \u20b910 lakh cover shared by you, spouse & children|\n|Premium|Often partly/fully paid by employer|Paid by you|\n|Control over policy|Mostly employer decides terms|You choose insurer, cover and features|\n|What happens if you leave employer?|Group cover generally ends, subject to policy terms/options|Continues as long as you renew|\n|Customization|Usually limited|Generally much greater|\n|Best for|Employee benefits/low-cost additional coverage|Long-term family protection|\n\nA family floater means the insured amount is shared by the covered family members. For example, with a \u20b910 lakh floater, one family member could potentially use \u20b97 lakh and another \u20b93 lakh during the policy year; the family's total available amount is \u20b910 lakh. IRDAI-hosted policy wording similarly defines a floater as a shared sum insured for the family. ([IRDAI](https://irdai.gov.in/documents/37343/931203/UIIHLGP21251V022021_2020-2021.pdf/1016f2e6-25fd-7f0e-a426-d71ac3813c48?t=1668590261125&version=1.1&utm_source=chatgpt.com))\n\n### Which is better?\n\nIf your employer provides Group Health Insurance:  \nKeep it\u2014it is valuable and often inexpensive/free\u2014but don't necessarily rely on it as your only health insurance.\n\nA common strategy is:\n\nEmployer Group Health Insurance + Personal Family Floater\n\nWhy? Your employer policy is tied to employment, while your personal policy gives you continuity and control. Some group polici\u2026",

oyee goes to a network hospital; the insurer/TPA settles eli\u2026",

ility. The amount depends on the policy's sum insured and the type/severity of the injury. [\u2026",

      "prompt": "What are the benefits of group insurance scheme for employees?",
      "vol": 10,
      "mentioned": false,
      "cited": false,
      "brands": [],
      "response": "*   A group insurance scheme for employees is an insurance policy arranged by an employer for a group of employees, often with options to cover dependents. In India, group health policies can cover expenses such as hospitalization, surgery, diagnostics, medicines, and certain pre/post-hospitalization costs, depending on the policy terms. I IRDAI+1\n    \n    ### Key benefits for employees\n    \n    1.  Financial protection\n        *   Helps employees manage large medical or accidental expenses without bearing the entire cost themselves.\n        *   Reduces the financial stress associated with hospitalization.\n        \n    2.  Lower cost\n        *   Group insurance is generally negotiated for a group rather than purchased individually, which can make coverage more affordable.\n        \n    3.  Coverage for family members\n        *   Many employer schemes allow employees to include spouses, children, and sometimes parents, subject to the employer's policy.\n        \n    4.  Broader benefits\n        *   Depending on the plan, employees may receive hospitalization, day-care treatment, pre- and post-hospitalization expenses, accident cover, critical illness benefits, or preventive health check-ups. I IRDAI+1\n        \n    5.  Access to healthcare\n        *   Insurance can make it easier for employees to seek appropriate medical treatment without delaying care because of cost.\n        \n    6.  Employee retention and satisfaction\n        *   Health insurance is a valuable employee benefit and can improve employees' perception of the organization's overall compensation package.\n        \n    7.  Protection against unexpected events\n        *   Group schemes can extend beyond health insurance to include personal accident, life, disability, or critical illness protection, depending on what the employer purchases. IRDAI records various group health, accident, and critical-illness products. I IRDAI+1\n    \n    ### Benefits for the employer\n    \n    *   Helps attract and retain employee\u2026",

      "response": "Yes. Generally, an employer in India can claim the premium paid for a group health insurance scheme for employees as a business deduction , subject to the conditions in the Income-tax Act.\n\n### How it works\n\n  * Group health insurance premium: Section 36(1)(ib) specifically allows an employer to deduct premiums paid for health insurance of employees, provided the scheme meets the statutory approval requirements and the premium is paid through a mode other than cash. The current Income Tax Department material confirms this treatment. [incometaxindia.gov.in](https://incometaxindia.gov.in/Documents/Act/Income-tax-Act-2025.pdf?utm_source=chatgpt.com) [www.incometaxindia.gov.in](https://www.incometaxindia.gov.in/documents/20117/42998/Section-36_2025-11-01_01-51-53_884a36_en.pdf/f02a5b0d-d8af-8d4e-15dc-58a0ff1eca4a?t=1779533962856&version=1.0&utm_source=chatgpt.com) \n    \n  * No employee perquisite: For an employer-sponsored health insurance scheme approved by the Central Government/IRDAI, the premium generally isn't taxable as a perquisite for the employee. [www.incometaxindia.gov.in](https://www.incometaxindia.gov.in/en/income-from-salary?utm_source=chatgpt.com) [www.incometaxindia.gov.in](https://www.incometaxindia.gov.in/w/section-17-60?p_l_back_url=%2Fsearch%3Fq%3DSection%2B271C%26sort%3D%26category%3D38320%26category%3D4217857%26delta%3D40%26start%3D21&p_l_back_url_title=Search&utm_source=chatgpt.com) \n    \n  * Section 80D isn't the employer's deduction: Section 80D is primarily a deduction available to individuals/HUFs , not the route an employer-company uses to deduct its group insurance premium. [www.incometaxindia.gov.in](https://www.incometaxindia.gov.in/w/section-80d-62?utm_source=chatgpt.com) \n    \n  * If a particular insurance expense doesn't fall under Section 36(1)(ib), Section 37(1) may potentially apply where the expenditure is wholly and exclusively for business purposes, subject to its conditions. [www.incometaxindia.gov.in](https://www.incometaxindia.\u2026",

      "prompt": "group mediclaim policy for startups in India: how to choose the right plan?",
      "vol": 10,
      "mentioned": false,
      "cited": false,
      "brands": [],
      "response": "*   For an Indian startup, group mediclaim (Group Health Insurance / GHI) is usually worth evaluating as soon as you have a meaningful employee base. The key is not to choose based on premium alone\u2014the cheapest policy can become painful when an employee actually needs hospitalization.\n    \n    ### 1\\. Start with your employee profile\n    \n    Before getting quotes, give every insurer/broker the same data:\n    \n    *   Number of employees\n    *   Age distribution\n    *   Employee-only vs employee + spouse + children + parents\n    *   Locations of employees\n    *   Desired sum insured\n    *   Existing medical conditions/claims experience, if available\n    *   Whether founders/directors should be covered\n    *   Expected headcount growth over the next 12 months\n    \n    This matters because the premium and underwriting can change substantially based on the group's demographics and claims history.\n    \n    ### 2\\. Choose the right sum insured\n    \n    As a starting point, I'd compare:\n    \n    |Option|Typical startup positioning|\n    |---|---|\n    |\u20b93 lakh|Basic / budget|\n    |\u20b95 lakh|Good baseline for many startups|\n    |\u20b97.5\u201310 lakh|Stronger employee benefit|\n    |\u20b910 lakh+|Premium benefit / senior-heavy workforce|\n    \n    Don't look only at the headline \u20b95 lakh or \u20b910 lakh. Check whether there are room-rent caps, disease-wise sub-limits, co-payments and deductibles. IRDAI specifically requires the policy's Customer Information Sheet to disclose exclusions, sub-limits, deductibles and waiting periods. I IRDAI\n    \n    ### 3\\. Pay particular attention to these clauses\n    \n    I'd rank these almost above the insurer's brand name:\n    \n    A. Room-rent limit \u2014 ideally none\n    \n    A \u20b95 lakh policy with a \u20b95,000/day room limit can be substantially less useful than a \u20b95 lakh policy with no room restriction.\n    \n    B. Co-pay \u2014 ideally 0%\n    \n    A 20% co-pay means an employee may have to fund 20% of eligible expenses themselves.\n    \n    C. Disease/treatment sub-limit\u2026",

      "vol": 10,
      "mentioned": false,
      "cited": true,
      "brands": [],
      "response": "PPN in Group Health Insurance stands for Preferred Provider Network.\n\nIt is a group of hospitals that have an agreement with the insurer/TPA to provide certain treatments at pre-negotiated package rates , usually with a cashless facility. [www.iibf.org.in](https://www.iibf.org.in/documents/pdf/TermsConditions.pdf?utm_source=chatgpt.com) [www.uiic.in](https://www.uiic.in/UGMS/resources/jsp/grievance_struts/ImageContainer.jsp?imageName=PG0003532024_2024-25+BASE+POLICY.pdf&utm_source=chatgpt.com) \n\n### Simple example\n\nSuppose your company's group health insurance covers a knee surgery:\n\n  * PPN hospital: The insurer and hospital have an agreed package rate for the surgery. You can generally avail cashless treatment , subject to policy terms and pre-authorisation.\n    \n  * Non-PPN hospital: It may still be a network hospital or may require reimbursement, depending on your policy. The agreed PPN package pricing may not apply.\n\n### Why PPN matters to you\n\n  1. Cashless treatment \u2013 the insurer/TPA settles the approved portion directly with the hospital. [irdai.gov.in](https://irdai.gov.in/faqs-on-health-insurance-regulations?utm_source=chatgpt.com) \n     \n  2. Pre-negotiated rates \u2013 helps control hospitalisation costs.\n     \n  3. More predictable billing \u2013 particularly for specified procedures covered under PPN packages.\n     \n  4. Potentially smoother claims \u2013 hospitals familiar with the insurer/TPA's process can make coordination easier.\n\nImportant: PPN does not mean that everything at that hospital is automatically free. Your sum insured, room-rent limits, exclusions, co-pay, deductibles, non-medical expenses, and other policy conditions still apply.\n\nAlso, every PPN hospital is a network hospital, but not every network hospital is necessarily a PPN hospital. [GIPSA: Full Form, PPN, Declaration Form & Meaning \\[2026\\]](https://joinditto.in/articles/health-insurance/general-insurance-public-sector-association/?utm_source=chatgpt.com)\n\nIf you tell me the insurance company\u2026",

      "prompt": "group medical insurance for startups in India: how to choose the right plan?",
      "vol": 10,
      "mentioned": false,
      "cited": false,
      "brands": [],
      "response": "*   For a startup in India, I\u2019d choose a group health insurance (GHI) plan based on actual claim usability\u2014not just the lowest premium. IRDAI\u2019s current framework recognizes employer\u2013employee group health products, so the key is comparing the policy wording, benefits, exclusions, and servicing quality. I IRDAI+1\n    \n    ### 1\\. Start with the coverage you actually need\n    \n    For most startups, prioritize:\n    \n    |Feature|What I'd look for|\n    |---|---|\n    |Sum insured|\u20b95\u201310 lakh per employee/family as a starting point; higher in metros|\n    |Family coverage|Employee + spouse + children; consider parents separately|\n    |Room-rent limit|Prefer no room-rent cap|\n    |ICU limit|Prefer no restrictive sub-limit|\n    |Co-pay|Ideally 0%|\n    |Disease/procedure sub-limits|Avoid wherever possible|\n    |Pre-existing diseases|Minimal/no waiting period under the group policy|\n    |Maternity|Important if your workforce is relatively young|\n    |Newborn cover|Check whether coverage begins from birth|\n    |Day-care procedures|Broad coverage|\n    |Pre/post-hospitalisation|Look for at least 60/90 days where available|\n    |Ambulance|Meaningful limit rather than a token amount|\n    |Mental-health treatment|Check explicitly|\n    |AYUSH|Check if relevant to employees|\n    |Cashless hospitals|Verify the actual hospitals your employees use|\n    \n    The last point is especially important: a huge network number is less useful than having the right hospitals in Bengaluru, Hyderabad, Mumbai, Delhi, etc.\n    \n    ### 2\\. Pay particular attention to maternity\n    \n    For startups, maternity can make a surprisingly large difference in employee satisfaction.\n    \n    Compare:\n    \n    *   Maternity limit \u2014 e.g. \u20b950,000 vs \u20b91 lakh+\n    *   Normal vs C-section limits\n    *   Waiting period\n    *   Whether the waiting period is waived for existing employees\n    *   Newborn cover\n    *   Complications during pregnancy\n    *   Pre/post-natal expenses\n    *   Adoption coverage, if offered\n   \u2026",

      "prompt": "group health insurance policy for startups in India: how to choose the right plan?",
      "vol": 10,
      "mentioned": false,
      "cited": false,
      "brands": [],
      "response": "*   For a startup in India, the right group health insurance (GHI) plan is not necessarily the cheapest policy per employee. You want a plan that employees can actually use, has sensible exclusions, and remains affordable as your team grows.\n    \n    IRDAI permits employer\u2013employee group health products, including one-year renewable group health policies. I IRDAI\n    \n    ### 1\\. Start with your employee profile\n    \n    Before getting quotes, define:\n    \n    *   Number of employees and expected headcount in 12\u201324 months\n    *   Age distribution\n    *   Cities where employees live\n    *   Whether employees can add spouse + children\n    *   Whether parents/in-laws should be covered\n    *   Whether founders/directors need different coverage\n    *   Existing illnesses and expected maternity requirements\n    *   Whether you have remote employees across India\n    \n    This matters because a 20-person tech startup with mostly employees under 35 has very different needs from a 50-person company with older dependants.\n    \n    ### 2\\. Pick the right base sum insured\n    \n    As a practical starting point, I'd compare at least:\n    \n    |Option|Typical use|\n    |---|---|\n    |\u20b93 lakh|Budget/basic employee cover|\n    |\u20b95 lakh|Good starting point for many startups|\n    |\u20b97.5\u201310 lakh|Stronger employee benefit|\n    |\u20b910 lakh+|Premium benefit / senior-heavy workforce|\n    \n    Don't judge \u20b95 lakh vs \u20b910 lakh purely by premium. Look at room-rent restrictions, disease sub-limits, co-pay and exclusions too.\n    \n    A \u20b910 lakh policy with restrictive sub-limits can be worse than a well-designed \u20b95 lakh policy.\n    \n    ### 3\\. Pay particular attention to these clauses\n    \n    I'd rank these above the insurer's brand name:\n    \n    1.  Room-rent limit \u2014 ideally no restrictive room category.\n    2.  ICU limit \u2014 preferably no separate restrictive cap.\n    3.  Co-pay \u2014 try to avoid mandatory employee co-pay.\n    4.  Disease-wise sub-limits \u2014 minimize or eliminate them.\n    5.  Pre-exi\u2026",

      "response": "Yes. In India, an employer can generally claim the premium paid for a group health insurance policy for its employees as a business deduction, subject to the normal conditions for business expenditure.\n\n### How it works\n\n*   Income-tax deduction: Employee health-insurance premiums are specifically recognized under Section 36(1)(ib) of the Income-tax Act. The current tax-return framework expressly identifies \u201cpremium paid for insurance on the health of employees\u201d under this provision. [www.incometax.gov.in](https://www.incometax.gov.in/iec/foportal/sites/default/files/2026-04/Notification%20No.48_2026.pdf?utm_source=chatgpt.com) \n    \n*   No \u20b925,000/\u20b950,000 limit for the employer: The limits you may see under Section 80D apply to individuals claiming deductions for their own/family health insurance\u2014not to an employer's group medical insurance expense. [www.incometax.gov.in](https://www.incometax.gov.in/iec/foportal/help/individual/return-applicable-1?utm_source=chatgpt.com) \n    \n*   Business purpose: The premium should be incurred in the course of the employer's business and properly recorded. Section 37(1) also requires business expenditure to be incurred wholly and exclusively for business purposes, while disallowing personal/capital expenditure. [www.incometax.gov.in](https://www.incometax.gov.in/iec/foportal/sites/default/files/2026-04/Notification%20No.49_2026.pdf?utm_source=chatgpt.com) \n    \n*   Employees' tax: Where the employer provides group health insurance to employees, the tax treatment for the employee can depend on the nature and terms of the benefit. Simply being deductible to the employer doesn't automatically mean the employee gets an 80D deduction.\n    \n\nExample: If a company pays \u20b910 lakh in a financial year for a group mediclaim policy covering its employees, that \u20b910 lakh can generally be claimed as an expense while computing the company's taxable business income, assuming the statutory conditions are met.\n\nOne important distinction: if you're \u2026",

      "response": "If you mean a group health insurance policy in India \u2014for example, health insurance provided by your employer\u2014the cancellation process depends on whether you are the master policyholder (usually the employer) or an individual employee/member.\n\n### If you are an employee/member\n\n  1. Check your certificate of insurance and policy wording.  \n     Group policies are generally held by the employer or other group policyholder, so an individual member may not have the same cancellation rights as the master policyholder.\n     \n  2. Contact your HR/benefits team or the insurer/TPA.  \n     Ask whether you can opt out or terminate your individual coverage and what happens to the premium already paid.\n     \n  3. Submit a written cancellation/opt-out request if permitted. Keep the acknowledgement.\n     \n  4. Ask about continuity/alternative coverage.  \n     If your group cover is ending because you are leaving employment, don't assume that simply cancelling it is the best option. Ask the insurer about moving to an individual policy and preserving applicable continuity benefits.\n\n### If you are the master policyholder\n\nThe policy wording controls the cancellation procedure and refund. Group policy documents can specify advance written notice and may calculate refunds according to how long the policy has been in force. For example, older group-health policy wordings on IRDAI's site contain provisions requiring written notice and applying short-period refund scales; some also restrict refunds where claims have been made. [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/RELIGARE15/Group%20Care%20-%20Policy%20Terms%20Conditions%20-%20NE.pdf?utm_source=chatgpt.com) [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/Max15/Group%20Health%20Insurance.pdf?utm_source=chatgpt.com) \n\nSo, before cancelling:\n\n  * Check the cancellation/termination clause.\n    \n  * Confirm the required notice period.\       "response": "Yes \u2014 pre-existing diseases (PEDs) can be covered under a group health insurance policy in India , but it depends on the specific policy negotiated by the employer/organization and insurer.\n\n### How it usually works\n\n  * Some group policies cover PEDs from Day 1. This is a major advantage of many employer-provided group health plans.\n    \n  * Other group policies impose a waiting period before PED-related treatment is covered. Older IRDAI-filed group policy wordings, for example, included waiting periods such as 48 months, while others allowed the waiting period to be specified in the policy schedule. [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/Max15/Group%20Health%20Insurance.pdf?utm_source=chatgpt.com) [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/HP1617/CTTK_ProHealthGroupInsurance_BaseCovers.pdf?utm_source=chatgpt.com) \n    \n  * The policy document is decisive. Check the Pre-Existing Disease , Waiting Period , Exclusions , and Coverage sections of your employer's certificate/policy wording.\n    \n  * A PED generally means a disease, condition, or related condition that existed/was diagnosed or treated before the policy's relevant start date; the exact definition can vary by policy wording. [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/HP1617/FGI_GroupHealthInsurance%28revised%29.pdf?utm_source=chatgpt.com) \n\n### Example\n\nSuppose you already have diabetes or hypertension when you join your employer's group health insurance.\n\n  * If the group policy says \u201cPED covered from Day 1\u201d \u2192 hospitalization related to the condition can generally be covered, subject to the policy's other terms.\n    \n  * If it has a PED waiting period \u2192 you may have to complete that period before related claims become payable.\n    \n  * If the condition is specifically excluded \u2192 related treatment won't be covered.\n\nImportant: Don't assume that becau       "response": "If you mean a group health insurance policy provided by an employer, the claim process in India usually works like this. The exact deadlines and documents depend on your insurer/TPA and your specific group policy.\n\n### Step-by-step group insurance claim process\n\n1\\. Check your coverage\n- Get your group insurance certificate/e-card from HR or the insurer/TPA.\n- Check your sum insured, room-rent limits, co-pay/deductible, exclusions, waiting periods, and whether the hospital is in the network.\n- Confirm that the person receiving treatment is actually enrolled under the group policy.\n\n2\\. Inform the insurer/TPA\nAs soon as hospitalization is planned or occurs, notify the insurer/TPA using the number/app/portal mentioned on your insurance card.\n\nFor emergencies, notification may need to happen very quickly. Some group policy wordings specify notification within 24 hours, while the precise requirement depends on the policy. [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/United15/Group_Health_Policy.pdf?utm_source=chatgpt.com) \n\n3\\. Choose between cashless and reimbursement\n\nCashless claim\n- Go to a network hospital.\n- Show your insurance/e-card and ID.\n- The hospital's insurance desk submits a pre-authorization request to the insurer/TPA.\n- The insurer reviews the request and approves, asks for additional information, or rejects it.\n- If approved, the insurer generally pays the eligible amount directly to the hospital. You pay non-covered expenses, deductibles/co-payments, etc. [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/RELIGARE15/Group%20Care%20-%20Policy%20Terms%20Conditions%20-%20NE.pdf?utm_source=chatgpt.com) \n\nReimbursement claim\n- You pay the hospital yourself.\n- Collect the required original bills and medical records.\n- Submit the claim to the insurer/TPA within the deadline specified by your policy.\n- The insurer assesses the claim and reimburses the eligible amount. [old.irdai.gov.in](https://old.irdai.gov.in/AD\u2026",

      "prompt": "What is the Co-Payment Clause in Group Health Insurance?",
      "vol": 0,
      "mentioned": false,
      "cited": false,
      "brands": [],
      "response": "A Co-Payment (Co-Pay) Clause in a Group Health Insurance policy means that the insured employee/member must pay a specified percentage of an admissible medical claim, while the insurer pays the remaining amount. IRDAI defines co-payment as a cost-sharing requirement, and importantly, co-pay does not reduce the policy's Sum Insured. [irdai.gov.in](https://irdai.gov.in/faqs-on-health-insurance-regulations?utm_source=chatgpt.com) [irdai.gov.in](https://irdai.gov.in/health-dept?utm_source=chatgpt.com) \n\n### Simple example\n\nSuppose your company's group health policy has:\n\n  * Sum Insured: \u20b95 lakh\n    \n  * Co-payment: 20%\n    \n  * Admissible hospital bill: \u20b92 lakh\n\nThen:\n\nAmount\\| Who pays  \n\\---\\|---  \n\u20b940,000 (20%)\\| You  \n\u20b91,60,000 (80%)\\| Insurance company  \n\u20b92,00,000\\|  Total admissible claim\n  \nYour \u20b95 lakh Sum Insured remains \u20b95 lakh ; the co-pay simply determines how the particular claim is shared. [irdai.gov.in](https://irdai.gov.in/faqs-on-health-insurance-regulations?utm_source=chatgpt.com) \n\n### What you should check in a group policy\n\nA co-payment clause can apply in different ways depending on the policy wording. Check whether the co-pay applies:\n\n  * to all claims or only certain treatments;\n    \n  * to specific hospitals/treatments/conditions ;\n    \n  * to claims for dependants or senior family members ;\n    \n  * to the entire admissible claim or a particular component.\n\nAlso distinguish co-pay from a deductible. A deductible is a specified amount that the insurer does not pay before coverage kicks in, whereas co-pay is generally a percentage of the admissible claim. [irdai.gov.in](https://irdai.gov.in/health-dept?utm_source=chatgpt.com) \n\nIn short: If your employer's group mediclaim says \u201c20% co-payment,\u201d you should generally expect to bear 20% of the admissible claim , with the insurer paying 80%, subject to the policy's other exclusions, limits and conditions.\n\nIf you share the exact co-payment clause from your company's Group Health Insurance policy , \u2026",

      "response": "If you\u2019re buying health insurance for employees in India, the usual solution is a Group Health Insurance (GHI) / Group Mediclaim policy purchased by the employer for employees and, optionally, their dependants. IRDAI permits group health insurance products for employer\u2013employee groups. [irdai.gov.in](https://irdai.gov.in/documents/37343/365525/%E0%A4%9C%E0%A5%80%E0%A4%B5%E0%A4%A8%2B%E0%A4%AC%E0%A5%80%E0%A4%AE%E0%A4%BE%2B%E0%A4%89%E0%A4%A4%E0%A5%8D%E0%A4%AA%E0%A4%BE%E0%A4%A6%E0%A5%8B%E0%A4%82%2B%E0%A4%B8%E0%A4%82%E0%A4%AC%E0%A4%82%E0%A4%A7%E0%A5%80%2B%E0%A4%AE%E0%A4%BE%E0%A4%B8%E0%A5%8D%E0%A4%9F%E0%A4%B0%2B%E0%A4%AA%E0%A4%B0%E0%A4%BF%E0%A4%AA%E0%A4%A4%E0%A5%8D%E0%A4%B0%2B_%2BMaster%2BCircular%2Bon%2BLife%2BInsurance%2BProducts.pdf/d7ca89f3-b894-8c93-3e53-d8caf67a8ba6?t=1733233494424&version=2.1&utm_source=chatgpt.com) \n\n### How to buy it\n\n  1. Decide who will be covered\n\n * All employees or only certain grades/categories\n   \n * Spouse and children\n   \n * Parents/in-laws, if required\n   \n * New joiners and employees leaving during the year\n\n  2. Choose the coverage amount\n\nCommon employer choices are \u20b93 lakh, \u20b95 lakh, \u20b910 lakh or more per employee/family , depending on your budget and workforce.\n\n  3. Set the important benefits\n\nPay particular attention to:\n\n * Hospitalisation cover\n   \n * Room-rent limits\n   \n * ICU limits\n   \n * Pre- and post-hospitalisation\n   \n * Day-care procedures\n   \n * Ambulance\n   \n * Maternity\n   \n * Newborn baby cover\n   \n * Pre-existing diseases\n   \n * No/low co-payment\n   \n * Cashless hospital network\n   \n * Annual health check-ups\n   \n * Parents' coverage\n\n  4. Get quotations from multiple insurers/brokers\n\nGive them a census containing information such as:\n\n * Number of employees\n   \n * Employee ages\n   \n * Gender\n   \n * Location\n   \n * Dependants to be covered\n   \n * Current policy, if any\n   \n * Previous claims history, if available\n   \n * Desired sum insured\n\nDon't select purely on the lowest premium. Compare the actual policy wordin\u2026",

      "prompt": "Types of group mediclaim policy plans available in India",
      "vol": 0,
      "mentioned": false,
      "cited": false,
      "brands": [],
      "response": "In India, group mediclaim policies are generally health-insurance policies purchased by an organization (such as an employer, association, cooperative, or other eligible group) to cover its members. IRDAI recognizes both indemnity-based and benefit-based health insurance, and group health products can be offered to employer-employee and certain non-employer-employee groups. [irdai.gov.in](https://irdai.gov.in/health-dept?utm_source=chatgpt.com) \n\n### Main types of group mediclaim plans\n\n|Type|Who is covered?|How it works|\n|---|---|---|\n|1\\. Employer\u2013Employee Group Mediclaim|Employees of a company|Employer buys one master policy covering eligible employees.|\n|2\\. Group Family Floater|Employee + spouse + children, sometimes parents|A common sum insured is shared among covered family members.|\n|3\\. Employee + Dependants Plan|Employee and defined dependants|Similar to corporate GMC, but the employer specifies which dependants can be included.|\n|4\\. Group Mediclaim with Parent Cover|Employee + parents/in-laws|Optional extension particularly useful where employees want parental hospitalization coverage.|\n|5\\. Group Personal Accident + Mediclaim Combination|Employees/members|Combines hospitalization insurance with accidental death/disability benefits. These are technically different covers but are often packaged together.|\n|6\\. Group Top-Up / Super Top-Up|Employees or group members|Provides additional hospitalization coverage after a deductible is crossed. Useful for increasing protection without making the base GMC very expensive.|\n|7\\. Association/Affinity Group Health Insurance|Members of eligible associations/professional groups|Coverage is arranged for members sharing a genuine common affiliation. IRDAI permits group health products for certain non-employer-employee homogeneous groups. [irdai.gov.in](https://irdai.gov.in/documents/37343/365525/%E0%A4%9C%E0%A5%80%E0%A4%B5%E0%A4%A8%2B%E0%A4%AC%E0%A5%80%E0%A4%AE%E0%A4%BE%2B%E0%A4%89%E0%A4%A4%E0%A5%8D%E0%A4%AA%E0%A4%BE%E0\u2026",

      "prompt": "Is it Smart to Buy Top-up Health Plan with Group Insurance?",
      "vol": 0,
      "mentioned": false,
      "cited": false,
      "brands": [],
      "response": "Yes \u2014 buying a personal top-up/super top-up health plan in addition to employer-provided group insurance is generally a smart strategy in India , especially if your employer's cover is modest.\n\n### Why it makes sense\n\nYour group insurance should be treated as the first layer , not necessarily your only health insurance.\n\nFor example:\n\n  * Employer group cover: \u20b95 lakh\n    \n  * Personal super top-up: \u20b920\u201330 lakh\n    \n  * Deductible: \u20b95 lakh\n\nIf eligible medical expenses cross the deductible, the super top-up can provide substantial additional protection. The key distinction is that a regular top-up generally applies the deductible to each claim , whereas a super top-up can aggregate eligible claims during the policy year. [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/HP1617/LVGI_HealthConnectSupraPolicy.pdf?utm_source=chatgpt.com) [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/ROYAL15/TOP%20UP%20INSURANCE-HEALTH%20XS%20AND%20SUPER%20HEALTH%20XS%20POLICY.pdf?utm_source=chatgpt.com) \n\n### Top-up vs Super Top-up\n\nFeature\\| Top-up\\| Super Top-up  \n\\---\\|---\\|---  \nDeductible\\| Usually per claim\\| Usually cumulative for the year  \nMultiple hospitalizations\\| Less useful\\| Much more useful  \nPremium\\| Lower\\| Usually somewhat higher  \nBest for\\| One very large hospitalization\\| Multiple claims + large hospitalization\n  \nFor most people already covered by employer insurance, I'd lean toward a super top-up rather than a basic top-up.\n\n### But there's one important issue\n\nDon't choose the deductible simply because it equals your employer's cover.\n\nSuppose your employer gives you \u20b95 lakh, but the group policy has exclusions, room-rent restrictions, co-pay, disease sub-limits, or claim conditions. You need to understand whether the super top-up will recognize expenses that the employer policy doesn't pay.\n\nAlso, employer insurance disappears or may change when you leave the job. That's the biggest reason I wouldn't rely exclusive\u2026",

      "vol": 0,
      "mentioned": false,

      "response": "If you mean group health insurance for employees, the key is to compare the policies on actual employee protection and claims experience, not just the annual premium.\n\nFor a growing company in India, I\u2019d use this framework:\n\n### 1\\. Start with your employee profile\nBefore requesting quotes, define:\n- Current headcount and expected growth over 1\u20133 years\n- Employee age distribution\n- Locations/cities\n- Typical family size\n- Whether you want spouse, children and/or parents covered\n- Desired sum insured, e.g. \u20b95 lakh, \u20b910 lakh, \u20b915 lakh\n- Whether employees can buy additional voluntary cover\n\nGroup health products are permitted for employer\u2013employee groups under IRDAI's framework. [irdai.gov.in](https://irdai.gov.in/documents/37343/365525/%E0%A4%9C%E0%A5%80%E0%A4%B5%E0%A4%A8%2B%E0%A4%AC%E0%A5%80%E0%A4%AE%E0%A4%BE%2B%E0%A4%89%E0%A4%A4%E0%A5%8D%E0%A4%AA%E0%A4%BE%E0%A4%A6%E0%A5%8B%E0%A4%82%2B%E0%A4%B8%E0%A4%82%E0%A4%AC%E0%A4%82%E0%A4%A7%E0%A5%80%2B%E0%A4%AE%E0%A4%BE%E0%A4%B8%E0%A5%8D%E0%A4%9F%E0%A4%B0%2B%E0%A4%AA%E0%A4%B0%E0%A4%BF%E0%A4%AA%E0%A4%A4%E0%A5%8D%E0%A4%B0%2B_%2BMaster%2BCircular%2Bon%2BLife%2BInsurance%2BProducts.pdf/d7ca89f3-b894-8c93-3e53-d8caf67a8ba6?t=1733233494424&version=2.1&utm_source=chatgpt.com) \n\n### 2\\. Compare these features side-by-side\n\n|Feature|What to look for|\n|---|---|\n|Sum insured|\u20b95\u201315L+ depending on workforce and locations|\n|Room-rent limit|Prefer no restrictive room category|\n|ICU limit|Ideally no restrictive sub-limit|\n|Disease/treatment sub-limits|Fewer is better|\n|Co-pay|Ideally 0% for employees|\n|Waiting periods|Ask specifically whether they are waived for the group|\n|Pre-existing diseases|Important for employees and parents|\n|Maternity|Limit, waiting period, normal/C-section coverage|\n|Newborn cover|When coverage begins and limits|\n|Day-care procedures|Look for broad coverage|\n|Pre/post-hospitalisation|Number of days covered|\n|OPD|Useful but usually secondary to hospitalisation cover|\n|Mental health|Check coverage and limits|\n|Ambulance\u2026",

      "response": "If you're comparing group health insurance (GHI/GMC) policies for a growing company in India, don't choose primarily on premium. Compare the actual employee experience, coverage gaps, claims performance, and how easily the policy scales.\n\nRecent Indian guidance similarly emphasizes claim performance, hospital-network quality, TPA/claims service, policy terms, renewal history, and total cost\u2014not just the quoted premium. [www.plumhq.com](https://www.plumhq.com/blog/how-to-compare-group-health-insurance-providers-india?utm_source=chatgpt.com) \n\n### 1\\. Compare these 10 factors\n\n|Factor|What to compare|Good target|\n|---|---|---|\n|Sum insured|\u20b93L/\u20b95L/\u20b910L+ per employee; family floater vs individual|Usually \u20b95\u201310L+ for a growing professional workforce|\n|Pre-existing diseases|Whether covered from Day 1|Day-1 coverage is highly desirable|\n|Room-rent limit|No limit vs % of sum insured|Prefer no room-rent cap|\n|Co-pay|Employee's percentage of eligible claim|0% preferred|\n|Disease sub-limits|Cataract, cancer, cardiac procedures, etc.|Avoid restrictive sub-limits|\n|Maternity|Waiting period + normal/C-section limits|Compare actual \u20b9 limits, not just \"maternity covered\"|\n|Parents|Whether parents can be added and at what premium|Important if this is an employee expectation|\n|Cashless network|Hospitals in employees' major cities|Check your employees' actual preferred hospitals|\n|Claims service|TPA/in-house claims, turnaround time, escalation|Get service commitments in writing|\n|Renewal economics|Past renewal increases and claims/loss experience|Critical for a rapidly growing company|\n\nRoom-rent limits deserve particular attention because they can affect the amount payable on associated hospital expenses, not merely the room charge itself. [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/HP1617/AMHI_GroupAssuranceHealthPlan_OptionalBenefits.pdf?utm_source=chatgpt.com) \n\n### 2\\. Don't       "response": "If you mean \u201cwaiting period in group insurance\u201d , it is the period during which certain benefits or claims are not yet payable after coverage begins.\n\n### What is a waiting period in group insurance?\n\nA waiting period is a specified time after the policy starts (or an employee becomes covered) during which the insurer may not pay claims for certain illnesses, treatments, or conditions.\n\nFor example, a group health policy might state that some illnesses are covered only after 30 days, while particular procedures may have a longer waiting period. IRDAI-hosted group policy documents illustrate both 30-day initial waiting periods and specific 24-month waiting periods. [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/SBI15/Group%20Health%20Insurance%20Policy.pdf?utm_source=chatgpt.com) [old.irdai.gov.in](https://old.irdai.gov.in/ADMINCMS/cms/Uploadedfiles/Max15/Group%20Health%20Insurance.pdf?utm_source=chatgpt.com) \n\n### Common types of waiting periods\n\nType\\| What it means\\| Example  \n\\---\\|---\\|---  \nInitial waiting period\\|  Applies shortly after coverage begins\\| Certain illnesses may not be covered for the first 30 days  \nSpecific disease waiting period\\|  Applies to listed illnesses/treatments\\| A particular procedure may have a 24-month wait  \nPre-existing disease waiting period\\|  Applies to conditions that existed before coverage\\| A pre-existing condition may be covered only after the specified period  \nMaternity waiting period\\|  Applies before maternity-related benefits become payable\\| Often specified separately in the policy  \nAccident-related claims\\|  Often treated differently from ordinary illness claims\\| Some policies waive the initial illness waiting period for accidents\n  \nThe exact periods vary by group policy , so the employer's policy wording and certificate of insurance are more important than any general rule.\n\n### Does every group insurance policy have a waiting period?\n\nNo. Some employer-sponsored group health policies pr\u2026",

      "prompt": "How To Compare Group Health Insurance?",
      "vol": 0,

      "brands": [],
      "response": "*   If you\u2019re comparing group health insurance in India\u2014for example, an employer\u2019s employee + family medical policy\u2014don\u2019t choose based on premium alone. Compare the actual benefits, limits, exclusions, and out-of-pocket costs.\n    \n    ### The key comparison points\n    \n    |Feature|What to compare|Prefer|\n    |---|---|---|\n    |Sum insured|\u20b95L, \u20b910L, \u20b915L, etc. per family/employee|Higher, especially for family cover|\n    |Room-rent limit|No limit vs \u20b9X/day or % of sum insured|No room-rent cap|\n    |ICU limit|Separate ICU cap|No cap|\n    |Co-pay|Percentage of every eligible claim you pay|0% co-pay|\n    |Deductible|Amount you pay before insurance pays|Low/zero|\n    |Pre-existing diseases|Whether covered immediately or after waiting period|Immediate coverage|\n    |Specific disease waiting periods|Cataract, hernia, etc.|None/short|\n    |Maternity|Waiting period, normal/C-section limits, newborn cover|Immediate/short waiting + generous limits|\n    |Pre/post-hospitalisation|Number of days covered|Longer coverage|\n    |Day-care procedures|Number/types covered|Broad coverage|\n    |Sub-limits|Caps on cataract, cancer, surgeries, etc.|Few/no sub-limits|\n    |Network hospitals|Cashless hospitals, particularly near your home/work|Strong local network|\n    |Claim process|Insurer + TPA, cashless process, service record|Simple and responsive|\n    |Family coverage|Spouse, children, parents/parents-in-law|Match your actual needs|\n    |Restoration/recharge|Whether sum insured replenishes after a claim|Yes|\n    |Room upgrade rules|Whether choosing a higher room affects other claim expenses|Minimal/no proportional deductions|\n    \n    Room-rent restrictions are particularly important: older group policy wordings illustrate how a room limit can also affect the amount payable for related hospital expenses, not merely the room itself. I IRDAI+1\n    \n    ### A simple way to score policies\n    \n    Give each policy a score out of 100:\n    \n    *   Coverage & sum insured \u2014 20\n    *   Room/I\u2026",

      "response": "If you\u2019re comparing group medical insurance for a growing company in India , don\u2019t choose primarily on premium. Compare the actual benefits employees can use , the insurer/TPA\u2019s claims experience, and how easily the policy scales as headcount grows.\n\n### 1\\. Start with a standard specification\n\nAsk every insurer/broker to quote on exactly the same basis:\n\n  * Number of employees and dependants\n    \n  * Employee age distribution\n    \n  * Family definition: spouse, children, parents/in-laws\n    \n  * Sum insured options \u2014 e.g. \u20b93L, \u20b95L, \u20b910L per employee/family\n    \n  * Current and expected headcount for the next 1\u20133 years\n    \n  * Locations of employees\n    \n  * Desired maternity coverage\n    \n  * Whether pre-existing diseases should be covered from day one\n\nThis makes quotes genuinely comparable rather than comparing different benefit designs.\n\n### 2\\. Compare these features\n\nFeature\\| What to look for  \n\\---\\|---  \nSum insured\\|  Is it individual or family floater? Is it adequate for your cities?  \nRoom-rent limit\\|  Prefer no room-rent cap or a generous limit. Caps can affect other hospital expenses too.  \nICU limit\\|  Ideally no restrictive sub-limit.  \nCo-pay\\|  Lower is better; ideally zero for employees.  \nDisease/treatment sub-limits\\|  Avoid restrictive caps on cataract, cancer, orthopaedics, etc.  \nWaiting periods\\|  For a corporate plan, negotiate aggressively for waiver/reduction of waiting periods.  \nPre-existing diseases\\|  Day-one coverage is particularly valuable for employee benefits.  \nMaternity\\|  Check normal/C-section limits, waiting period, newborn cover and complications.  \nDay-care procedures\\|  Look for comprehensive coverage rather than a narrow list.  \nPre/post-hospitalisation\\|  Compare the number of days covered.  \nNetwork hospitals\\|  Check the actual hospitals near where employees live\u2014not just the national network count.  \nCashless claims\\|  Examine ease and turnaround time for pre-authorisation.  \nNon-network treatment\\|  Check reimbur\u2026",

function fmtNum(n) { return typeof n === 'number' ? n.toLocaleString('en-US') : n; }
function fmtCompact(n) { return n >= 1000 ? (n/1000).toFixed(n >= 10000 ? 0 : 1).replace(/\.0$/, '') + 'k' : String(n); }

// ─── SPARKLINE ───
function Sparkline({ data, color = 'var(--acko-400)', width = 80, height = 26, seed = 1 }) {
  const points = useMemo(() => {
    if (!data || data.length === 0) return [0.5, 0.5];
    if (data.length === 1) return [data[0], data[0]];
    const min = Math.min(...data);
    const max = Math.max(...data);
    const range = max - min || 1;
    return data.map(v => (v - min) / range);
  }, [data]);
  const pts = points.map((v,i) => [(i/(points.length-1))*width, height - v*(height-4) - 2]);
  const d = pts.map((p,i) => (i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const fillD = d + ` L ${width},${height} L 0,${height} Z`;
  const id = 'sg'+seed;
  return <svg className="kpi-spark" viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none" width="100%" height={height}>
    <defs><linearGradient id={id} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity="0.35"/><stop offset="100%" stopColor={color} stopOpacity="0"/></linearGradient></defs>
    <path d={fillD} fill={`url(#${id})`}/><path d={d} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/>
    <circle cx={pts[pts.length-1][0]} cy={pts[pts.length-1][1]} r="2" fill={color}/>
  </svg>;
}

function Tip({ label, children }) {
  const [show, setShow] = useState(false);
  return <span style={{position:'relative',display:'inline-block'}} onMouseEnter={()=>setShow(true)} onMouseLeave={()=>setShow(false)}>

    {show && <span style={{position:'absolute',bottom:'calc(100% + 6px)',left:'50%',transform:'translateX(-50%)',background:'#000',color:'#fff',fontSize:11,padding:'5px 9px',borderRadius:6,whiteSpace:'nowrap',border:'1px solid var(--border-strong)',zIndex:30,fontFamily:'var(--font-mono)',letterSpacing:0.02}}>{label}</span>}
  </span>;
}

function PeriodBar() {

}

// ─── KPI ───
function Kpi({ label, value, caption, isAcko, sparkData, sparkSeed, delta, deltaDir, info }) {
  const valNode = typeof value === 'string' && value.includes('%')
    ? <>{value.replace('%','')}<span className="unit">%</span></> : value;
  const isText = typeof value === 'string' && (value.includes('/') || /[A-Za-z]/.test(value));
  return <div className={'kpi '+(isAcko?'acko':'')}>
    <div className="kpi-label">{isAcko && <span className="dot"/>}{label}{info && <InfoTip text={info}/>}</div>
    <div className={'kpi-value '+(isText?'text':'')}>{valNode}</div>
    <Sparkline data={sparkData} seed={sparkSeed||1} color={isAcko?'var(--acko-400)':'var(--info)'}/>
    <div className="kpi-caption"><span>{caption}</span>
      {delta && <span className={'kpi-delta '+(deltaDir==='up'?'up':'down')}>{deltaDir==='up'?<Icon.Up/>:<Icon.Down/>}{delta}</span>}
    </div>
  </div>;
}

function KpiGrid() {
  const k = window.GEO_DATA.kpis;
  const [periodA] = window.__periodA || [null];
  const [periodB] = window.__periodB || [null];
  const [comparing] = window.__comparing || [false];

  // ─── Helper: get KPI snapshot for a date (from KPI_HISTORY) ───
  const getKpi = (date) => {
    if(!date || !window.KPI_HISTORY) return null;
    if(window.KPI_HISTORY[date]) return window.KPI_HISTORY[date];
    const dates = Object.keys(window.KPI_HISTORY).sort();
    // Try closest earlier date first
    const earlier = dates.filter(d => d <= date);
    if(earlier.length) return window.KPI_HISTORY[earlier[earlier.length-1]];
    // If no earlier date exists, use closest later date
    const later = dates.filter(d => d > date);
    return later.length ? window.KPI_HISTORY[later[0]] : null;
  };
  const kpiA = getKpi(periodA);
  const kpiB = comparing ? getKpi(periodB) : null;

  // ─── SoV ───
  const sovA = periodA && window.SOV_HISTORY[periodA] ? window.SOV_HISTORY[periodA]["Acko"] : k.shareOfVoice.value;
  const sovB = periodB && comparing && window.SOV_HISTORY[periodB] ? window.SOV_HISTORY[periodB]["Acko"] : null;

  const getRank = (date) => {
    if(!date || !window.SOV_HISTORY[date]) return null;
    const sorted = Object.entries(window.SOV_HISTORY[date]).sort((a,b)=>b[1]-a[1]);
    return {rank: sorted.findIndex(e=>e[0]==="Acko")+1, total: sorted.length};
  };
  const rankA = getRank(periodA);
  const sovCaption = rankA ? `Rank #${rankA.rank} of ${rankA.total} brands` : k.shareOfVoice.caption;

  const sovDelta = comparing && sovB !== null ? (sovA - sovB).toFixed(1) : null;
  const sovDeltaDir = sovDelta > 0 ? 'up' : sovDelta < 0 ? 'down' : null;

  // ─── Mentioned ───
  const mentA = kpiA ? kpiA.mentioned_count : parseInt(k.mentioned.value);
  const mentTotalA = kpiA ? kpiA.mentioned_total : parseInt(k.mentioned.value.split('/')[1]);
  const mentVal = `${mentA}/${mentTotalA}`;
  const mentPct = mentTotalA > 0 ? Math.round(mentA/mentTotalA*100) : 0;
  const mentCaption = `${mentPct}% of AI responses`;
  const mentDeltaRaw = comparing && kpiB ? mentA - kpiB.mentioned_count : (k.mentioned.delta ? parseInt(k.mentioned.delta) : null);
  const mentDelta = mentDeltaRaw !== null && mentDeltaRaw !== 0 ? (mentDeltaRaw > 0 ? '+' : '') + mentDeltaRaw : null;
  const mentDeltaDir = mentDeltaRaw > 0 ? 'up' : mentDeltaRaw < 0 ? 'down' : null;

  // ─── Cited ───
  const citeA = kpiA ? kpiA.cited_count : parseInt(k.cited.value);
  const citeTotalA = kpiA ? kpiA.cited_total : parseInt(k.cited.value.split('/')[1]);
  const citeVal = `${citeA}/${citeTotalA}`;
  const citePct = citeTotalA > 0 ? Math.round(citeA/citeTotalA*100) : 0;
  const citeCaption = `acko.com linked in ${citePct}% responses`;
  const citeDeltaRaw = comparing && kpiB ? citeA - kpiB.cited_count : (k.cited.delta ? parseInt(k.cited.delta) : null);
  const citeDelta = citeDeltaRaw !== null && citeDeltaRaw !== 0 ? (citeDeltaRaw > 0 ? '+' : '') + citeDeltaRaw : null;
  const citeDeltaDir = citeDeltaRaw > 0 ? 'up' : citeDeltaRaw < 0 ? 'down' : null;

  // ─── Total AI Search Volume ───
  const volA = kpiA ? kpiA.total_volume : k.aiSearchVol.value;
  const volTotalA = kpiA ? kpiA.mentioned_total : parseInt(String(k.aiSearchVol.caption).match(/\d+/)?.[0] || '0');
  const volCaption = `Across ${volTotalA} tracked prompts`;
  const volDeltaRaw = comparing && kpiB ? volA - kpiB.total_volume : null;
  const volDelta = volDeltaRaw !== null && volDeltaRaw !== 0 ? (volDeltaRaw > 0 ? '+' : '') + fmtNum(Math.abs(volDeltaRaw)) : null;
  const volDeltaDir = volDeltaRaw > 0 ? 'up' : volDeltaRaw < 0 ? 'down' : null;

  // ─── Volume Reach ───
  const vrA = kpiA ? kpiA.volume_reach : k.volumeReach.value;
  const vrPct = volA > 0 ? Math.round(vrA/volA*100) : 0;
  const vrCaption = `${vrPct}% of total volume`;
  const vrDeltaRaw = comparing && kpiB ? vrA - kpiB.volume_reach : (k.volumeReach.delta ? parseInt(String(k.volumeReach.delta).replace(/,/g,'')) : null);
  const vrDelta = vrDeltaRaw !== null && vrDeltaRaw !== 0 ? (vrDeltaRaw > 0 ? '+' : '') + fmtNum(Math.abs(vrDeltaRaw)) : null;
  const vrDeltaDir = vrDeltaRaw > 0 ? 'up' : vrDeltaRaw < 0 ? 'down' : null;

  // ─── Top Competitor ───
  const getTopComp = (date) => {
    if(!date || !window.SOV_HISTORY[date]) return null;
    const sorted = Object.entries(window.SOV_HISTORY[date]).sort((a,b)=>b[1]-a[1]);
    return {name: sorted[0][0], sov: sorted[0][1].toFixed(1)};
  };
  const topA = getTopComp(periodA);
  const topB = getTopComp(periodB);
  const topDelta = comparing && topA && topB ? (parseFloat(topA.sov) - parseFloat(topB.sov)).toFixed(1) : null;
  const topDeltaDir = topDelta > 0 ? 'up' : topDelta < 0 ? 'down' : null;

  // ─── Build sparkline data from real history ───
  const buildSparkData = (extractor) => {
    const sovDates = Object.keys(window.SOV_HISTORY || {});
    const kpiDates = Object.keys(window.KPI_HISTORY || {});
    const allDates = [...new Set([...sovDates, ...kpiDates])].sort();
    return allDates.map(d => extractor(d)).filter(v => v !== null && v !== undefined);
  };

  const sparkSov = buildSparkData(d => {
    if(window.SOV_HISTORY[d] && window.SOV_HISTORY[d]["Acko"] !== undefined) return window.SOV_HISTORY[d]["Acko"];
    const kpi = window.KPI_HISTORY[d];
    return kpi && kpi.sov !== undefined ? kpi.sov : null;
  });
  const sparkMent = buildSparkData(d => { const kpi = window.KPI_HISTORY[d]; return kpi ? kpi.mentioned_count : null; });
  const sparkCite = buildSparkData(d => { const kpi = window.KPI_HISTORY[d]; return kpi ? kpi.cited_count : null; });
  const sparkVol = buildSparkData(d => { const kpi = window.KPI_HISTORY[d]; return kpi ? kpi.total_volume : null; });
  const sparkVr = buildSparkData(d => { const kpi = window.KPI_HISTORY[d]; return kpi ? kpi.volume_reach : null; });
  const sparkTopComp = buildSparkData(d => {
    if(!window.SOV_HISTORY[d]) return null;
    const sorted = Object.entries(window.SOV_HISTORY[d]).sort((a,b)=>b[1]-a[1]);
    return sorted.length ? sorted[0][1] : null;
  });

  return <div className="kpi-grid">
    <Kpi label="ACKO Share of Voice" value={sovA.toFixed?sovA.toFixed(1)+'%':sovA+'%'} caption={sovCaption} isAcko sparkData={sparkSov} sparkSeed={1} delta={sovDelta?sovDelta+'pp':null} deltaDir={sovDeltaDir} info="Percentage of all AI-generated responses (across tracked prompts) where ACKO appears, relative to all brand appearances. Higher SoV = ACKO dominates more AI conversations."/>
    <Kpi label="ACKO Mentioned" value={mentVal} caption={mentCaption} isAcko sparkData={sparkMent} sparkSeed={2} delta={mentDelta} deltaDir={mentDeltaDir} info="Number of tracked AI prompts where 'ACKO' is explicitly named in the response text. Format: mentioned / total prompts tracked."/>
    <Kpi label="ACKO Cited" value={citeVal} caption={citeCaption} isAcko sparkData={sparkCite} sparkSeed={3} delta={citeDelta} deltaDir={citeDeltaDir} info="Number of tracked AI prompts where acko.com is linked as a source in the response. Being cited means the AI treats ACKO's content as authoritative."/>
    <Kpi label="Total AI Search Volume" value={fmtNum(volA)} caption={volCaption} sparkData={sparkVol} sparkSeed={4} delta={volDelta} deltaDir={volDeltaDir} info="Combined monthly search volume of all tracked prompts. Represents the total addressable audience asking these questions in AI search."/>
    <Kpi label="ACKO Volume Reach" value={fmtNum(vrA)} caption={vrCaption} isAcko sparkData={sparkVr} sparkSeed={5} delta={vrDelta} deltaDir={vrDeltaDir} info="Monthly search volume of prompts where ACKO is mentioned. Shows how much of the total AI search audience is actually seeing ACKO in answers."/>
    <Kpi label="Top Competitor" value={topA?topA.name:k.topCompetitor.value} caption={topA?topA.sov+'% SoV':k.topCompetitor.caption} sparkData={sparkTopComp} sparkSeed={6} delta={topDelta?topDelta+'pp':null} deltaDir={topDeltaDir} info="The brand with the highest Share of Voice across all tracked prompts. This is the dominant player ACKO is competing against in AI responses."/>
  </div>;
}

// ─── BAR CHARTS ───
function BarChart({ data, valueKey, formatValue, max }) {
  const computedMax = max || Math.max(...data.map(d=>d[valueKey]));
  return <div className="bars" style={{padding:'0 22px 22px'}}>
    {data.map(d => {
      const pct = (d[valueKey]/computedMax)*100;
      return <Tip key={d.name||d.brand} label={`${d.name||d.brand} · ${formatValue?formatValue(d[valueKey]):d[valueKey]}`}>
        <div className={'bar-row '+(d.isAcko?'acko':'')} style={{width:'100%'}}>
          <div className="bar-name">{d.name||d.brand}</div>
          <div className="bar-track"><div className="bar-fill" style={{width:Math.max(pct,0.5)+'%'}}/></div>
          <div className="bar-value">{formatValue?formatValue(d[valueKey]):d[valueKey]}</div>
        </div>
      </Tip>;
    })}
  </div>;
}

function ShareOfVoiceCard() {
  const [periodA] = window.__periodA || [null];
  const sovData = useMemo(()=>{
    if(periodA && window.SOV_HISTORY[periodA]){
      const h=window.SOV_HISTORY[periodA];

    <div className="card-header"><div><div className="card-title"><span className="accent"/><span>Share of Voice — All Brands</span><InfoTip text="Share of Voice (SoV) measures how often each brand appears in AI-generated responses relative to all tracked brands. Higher SoV means the brand dominates AI answers for your tracked prompts."/></div><div className="card-subtitle">{sovData.length} brands tracked · {dateLabel}</div></div></div>

}

  const otherLinks = links.filter(l => !l.url.toLowerCase().includes('acko.com'));

  return <div className="drawer-overlay" onClick={onClose}><div className="drawer" onClick={e=>e.stopPropagation()}>

    <div className="drawer-body">
      <div className="drawer-stat-grid">
        <div className="drawer-stat"><div className="label">AI Volume</div><div className="val">{fmtNum(row.vol)}</div></div>
        <div className="drawer-stat"><div className="label">ACKO Mentioned</div><div className="val" style={{color:row.mentioned?'var(--good)':'var(--bad)'}}>{row.mentioned?'Yes':'No'}</div></div>
        <div className="drawer-stat"><div className="label">ACKO Cited</div><div className="val" style={{color:row.cited?'var(--good)':'var(--bad)'}}>{row.cited?'Yes':'No'}</div></div>
      </div>
      <div><div style={{fontSize:10,textTransform:'uppercase',letterSpacing:'0.12em',color:'var(--fg-3)',fontWeight:600,marginBottom:10}}>Brands present</div>

      </div>
      <div><div style={{fontSize:10,textTransform:'uppercase',letterSpacing:'0.12em',color:'var(--fg-3)',fontWeight:600,marginBottom:10}}>Status</div>
        <div style={{padding:14,background:'var(--surface-2)',border:'1px solid var(--border)',borderRadius:'var(--radius)',fontSize:13,lineHeight:1.6}}>
          {row.mentioned&&row.cited&&<span style={{color:'var(--good)'}}>✓ ACKO is performing well — both mentioned and cited.</span>}
          {!row.mentioned&&!row.cited&&<span style={{color:'var(--bad)'}}>✗ ACKO is missing entirely from this response.</span>}
          {!row.mentioned&&row.cited&&<span style={{color:'var(--warn)'}}>◐ ACKO is cited but not mentioned by name.</span>}
          {row.mentioned&&!row.cited&&<span style={{color:'var(--warn)'}}>◐ ACKO is mentioned but not cited as a source.</span>}
        </div>
      </div>
      <div><div style={{fontSize:10,textTransform:'uppercase',letterSpacing:'0.12em',color:'var(--fg-3)',fontWeight:600,marginBottom:10}}>ChatGPT response {links.length>0&&<span style={{fontWeight:400,color:'var(--fg-4)',textTransform:'none',letterSpacing:0,fontSize:11,marginLeft:6}}>{links.length} source{links.length!==1?'s':''} cited</span>}</div>
        {resp ? <div className="drawer-response-wrap">
          <div className="drawer-response">{resp}</div>
          {links.length>0 && <div className="drawer-cited-sidebar">
            <h4>Cited pages ({links.length})</h4>
            {sortedLinks.map((l,i)=><a key={i} className={'cited-link'+(l.url.toLowerCase().includes('acko.com')?' acko-link':'')} href={l.url} target="_blank" rel="noopener noreferrer">
              <span className="cited-title">{l.title||'Untitled'}</span>
              <span className="cited-url">{l.url}</span>
            </a>)}
          </div>}
        </div> : <div className="drawer-no-response">Response data not available for this prompt.</div>}
      </div>
    </div>
  </div></div>;
}

function volBucket(v) { return v>=5000?{cls:'high'}:v>=1500?{cls:'med'}:{cls:'low'}; }

function PromptsCard() {
  const data = window.GEO_DATA.prompts;
  const [search, setSearch] = useState('');
  const [filter, setFilter] = useState('all');
  const [sort, setSort] = useState({key:'vol',dir:'desc'});
  const [active, setActive] = useState(null);
  const maxVol = Math.max(...data.map(d=>d.vol));
  const counts = {all:data.length, mentioned:data.filter(d=>d.mentioned).length, notMentioned:data.filter(d=>!d.mentioned).length, cited:data.filter(d=>d.cited).length, notCited:data.filter(d=>!d.cited).length};
  const rows = useMemo(()=>{
    let r = data;
    if(filter==='mentioned') r=r.filter(d=>d.mentioned);
    if(filter==='notMentioned') r=r.filter(d=>!d.mentioned);
    if(filter==='cited') r=r.filter(d=>d.cited);
    if(filter==='notCited') r=r.filter(d=>!d.cited);
    if(search){const q=search.toLowerCase();r=r.filter(d=>d.prompt.toLowerCase().includes(q)||d.brands.some(b=>b.toLowerCase().includes(q)));}
    r=[...r].sort((a,b)=>{const dir=sort.dir==='desc'?-1:1;if(sort.key==='vol')return(a.vol-b.vol)*dir;if(sort.key==='prompt')return a.prompt.localeCompare(b.prompt)*dir;return 0;});
    return r;
  },[filter,search,sort]);
  const setSortKey=(k)=>setSort(s=>s.key===k?{...s,dir:s.dir==='desc'?'asc':'desc'}:{key:k,dir:'desc'});
  const arrow=(k)=>sort.key===k?<span className="sort-arrow">{sort.dir==='desc'?'▼':'▲'}</span>:<span className="sort-arrow">⇅</span>;
  return <div className="card">
    <div className="card-header"><div><div className="card-title"><span className="accent"/><span>Prompt-Level Breakdown</span><InfoTip text="Every tracked AI search prompt with its monthly search volume, whether ACKO is mentioned in the response, and whether acko.com is cited as a source. Filter to find gaps and opportunities."/><span className="count">{rows.length} of {data.length} prompts</span></div></div></div>
    <div className="filter-bar">
      <div className="search"><Icon.Search/><input placeholder="Search prompts or brands…" value={search} onChange={e=>setSearch(e.target.value)}/></div>
      {[['all','All Prompts'],['mentioned','ACKO Mentioned'],['notMentioned','ACKO Not Mentioned'],['cited','ACKO Cited'],['notCited','ACKO Not Cited']].map(([k,l])=>
        <button key={k} className={'filter-chip '+(filter===k?'active':'')} onClick={()=>setFilter(k)}>{l} <span className="ct">{counts[k]}</span></button>
      )}
    </div>
    <div className="table-wrap"><table className="table"><thead><tr>
      <th className="sortable" onClick={()=>setSortKey('prompt')}>Prompt {arrow('prompt')}</th>
      <th className="num sortable" style={{width:160}} onClick={()=>setSortKey('vol')}>AI Volume {arrow('vol')}</th>
      <th style={{width:110}}>Mentioned</th><th style={{width:110}}>Cited</th><th>Brands Present</th><th style={{width:36}}></th>
    </tr></thead><tbody>
      {rows.map(r=>{const b=volBucket(r.vol);return <tr key={r.prompt} onClick={()=>setActive(r)} style={{cursor:'pointer'}}>
        <td style={{maxWidth:480}}>{r.prompt}</td>
        <td className="num"><span className={'vol-cell '+b.cls}><span className="vbar"><span style={{width:(r.vol/maxVol)*100+'%'}}/></span>{fmtNum(r.vol)}</span></td>
        <td>{r.mentioned?<span className="tag-yes">Yes</span>:<span className="tag-no">No</span>}</td>
        <td>{r.cited?<span className="tag-yes">Yes</span>:<span className="tag-no">No</span>}</td>
        <td>{r.brands.length?r.brands.map(b=><span key={b} className={'brand-chip '+(b==='Acko'?'acko':'')}>{b}</span>):<span className="dim">—</span>}</td>
        <td style={{color:'var(--fg-4)',textAlign:'right'}}>›</td>
      </tr>;})}
    </tbody></table></div>
    <PromptDrawer row={active} onClose={()=>setActive(null)}/>
  </div>;
}

// ─── GAP ANALYSIS ───
function GapQuadrant() {
  const data = window.GEO_DATA.prompts;
  const W=720,H=420,PAD=50;
  const maxVol = Math.max(...data.map(d=>d.vol));
  const score=(d)=>(d.mentioned?1.5:0)+(d.cited?1.5:0);
  const points = data.map((d,i)=>{
    const lx=Math.log10(d.vol+10),lxMax=Math.log10(maxVol+10);
    const x=PAD+(lx/lxMax)*(W-PAD*2), y=H-PAD-(score(d)/3)*(H-PAD*2);
    return {...d,x,y,score:score(d),idx:i};
  });
  const [hover,setHover]=useState(null);
  return <div className="quadrant"><svg className="quadrant-svg" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid meet">
    <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" strokeWidth="1"/></pattern>
      <linearGradient id="qbg-tl" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stopColor="rgba(74,222,128,0.08)"/><stop offset="100%" stopColor="transparent"/></linearGradient>
      <linearGradient id="qbg-br" x1="1" y1="1" x2="0" y2="0"><stop offset="0%" stopColor="rgba(255,100,112,0.10)"/><stop offset="100%" stopColor="transparent"/></linearGradient>
    </defs>
    <rect width={W} height={H} fill="url(#grid)"/>
    <rect x={W/2} y={PAD} width={W/2-PAD} height={(H-PAD*2)/2} fill="url(#qbg-tl)"/>
    <rect x={W/2} y={H/2} width={W/2-PAD} height={(H-PAD*2)/2} fill="url(#qbg-br)"/>
    <line x1={PAD} y1={H-PAD} x2={W-PAD} y2={H-PAD} stroke="rgba(255,255,255,0.15)"/>
    <line x1={PAD} y1={PAD} x2={PAD} y2={H-PAD} stroke="rgba(255,255,255,0.15)"/>
    <line x1={W/2} y1={PAD} x2={W/2} y2={H-PAD} stroke="rgba(255,255,255,0.06)" strokeDasharray="3 4"/>
    <line x1={PAD} y1={H/2} x2={W-PAD} y2={H/2} stroke="rgba(255,255,255,0.06)" strokeDasharray="3 4"/>
    <text x={W-PAD-12} y={PAD+18} textAnchor="end" fill="var(--good)" fontSize="11" fontFamily="var(--font-mono)" letterSpacing="0.08em">★ HIGH-VOLUME WINS</text>
    <text x={W-PAD-12} y={H-PAD-10} textAnchor="end" fill="var(--bad)" fontSize="11" fontFamily="var(--font-mono)" letterSpacing="0.08em">⚠ HIGH-VOLUME GAPS</text>
    <text x={PAD+12} y={PAD+18} fill="var(--fg-4)" fontSize="11" fontFamily="var(--font-mono)">LOW-VOL WINS</text>
    <text x={PAD+12} y={H-PAD-10} fill="var(--fg-4)" fontSize="11" fontFamily="var(--font-mono)">LOW-VOL GAPS</text>
    <text x={W/2} y={H-14} textAnchor="middle" fill="var(--fg-3)" fontSize="11" fontFamily="var(--font-mono)">AI SEARCH VOLUME →</text>
    <text x={16} y={H/2} textAnchor="middle" fill="var(--fg-3)" fontSize="11" fontFamily="var(--font-mono)" transform={`rotate(-90 16 ${H/2})`}>ACKO PERFORMANCE →</text>
    {points.map(p=>{
      const color=p.mentioned&&p.cited?'var(--good)':!p.mentioned&&!p.cited?'var(--bad)':'var(--warn)';
      const r=5+Math.log10(p.vol+10);
      return <g key={p.idx} onMouseEnter={()=>setHover(p)} onMouseLeave={()=>setHover(null)} style={{cursor:'pointer'}}>
        <circle cx={p.x} cy={p.y} r={r+4} fill={color} opacity="0.15"/><circle cx={p.x} cy={p.y} r={r} fill={color} opacity="0.85" stroke="var(--ink-1)" strokeWidth="1.5"/>
      </g>;
    })}
    {hover && <g pointerEvents="none">
      <rect x={Math.min(hover.x+12,W-280)} y={Math.max(hover.y-50,10)} width="270" height="48" rx="6" fill="#000" stroke="var(--border-strong)"/>
      <text x={Math.min(hover.x+22,W-270)} y={Math.max(hover.y-32,28)} fill="var(--fg-1)" fontSize="11">{hover.prompt.length>40?hover.prompt.slice(0,38)+'…':hover.prompt}</text>
      <text x={Math.min(hover.x+22,W-270)} y={Math.max(hover.y-16,44)} fill="var(--fg-3)" fontSize="10" fontFamily="var(--font-mono)">vol {fmtNum(hover.vol)} · {hover.mentioned?'mentioned':'no mention'} · {hover.cited?'cited':'no citation'}</text>
    </g>}
  </svg></div>;
}

function PriorityList() {
  const missing = window.GEO_DATA.gapsMissing;
  const wins = window.GEO_DATA.gapsWins;
  const items = [...missing.map(m=>({...m,type:'miss'})), ...wins.map(w=>({...w,type:'win',brands:[]}))].sort((a,b)=>b.vol-a.vol);
  return <div className="priority-list">{items.map((it,i)=>
    <div key={it.prompt+i} className="priority-item">
      <div className="priority-rank">{String(i+1).padStart(2,'0')}</div>
      <div><div className="priority-prompt">{it.prompt}</div>
        {it.brands&&it.brands.length>0&&<div style={{marginTop:4}}><span className="dim" style={{fontSize:11,marginRight:6}}>Competitors:</span>{it.brands.map(b=><span key={b} className="brand-chip">{b}</span>)}</div>}
      </div>
      <div className="priority-vol">{fmtNum(it.vol)}</div>
      <div className={'priority-tag '+(it.type==='miss'?'miss':'win')}>{it.type==='miss'?'Gap':'Win'}</div>
    </div>
  )}</div>;
}

function GapAnalysisSection() {
  const [view,setView]=useState('quadrant');
  return <div className="card">
    <div className="card-header"><div><div className="card-title"><span className="accent"/><span>Gap Analysis</span><InfoTip text="Visualises where ACKO is winning (mentioned + cited) vs missing (neither mentioned nor cited) across all tracked prompts. High-volume gaps in the bottom-right quadrant are top priorities for GEO optimisation."/></div><div className="card-subtitle">Where ACKO is winning vs missing across tracked prompts</div></div>
      <div className="card-actions"><button className={'filter-chip '+(view==='quadrant'?'active':'')} onClick={()=>setView('quadrant')}>Quadrant</button><button className={'filter-chip '+(view==='list'?'active':'')} onClick={()=>setView('list')}>Priority list</button></div>
    </div>
    {view==='quadrant'?<><GapQuadrant/><div className="quad-legend">
      <span><span className="lg-dot" style={{background:'var(--good)'}}/>ACKO mentioned + cited</span>
      <span><span className="lg-dot" style={{background:'var(--warn)'}}/>Mentioned or cited (partial)</span>
      <span><span className="lg-dot" style={{background:'var(--bad)'}}/>ACKO missing</span>
      <span style={{marginLeft:'auto',color:'var(--fg-4)'}}>Bubble size = log(volume)</span>
    </div></>:<PriorityList/>}
  </div>;
}

// ─── APP ───
function App() {
  const [active, setActive] = useState('overview');
  const dates = Object.keys(window.SOV_HISTORY).sort();
  const periodAState = useState(dates[dates.length-1]);
  const periodBState = useState(dates.length>1 ? dates[dates.length-2] : dates[0]);
  const comparingState = useState(false);
  const [updateTick, setUpdateTick] = useState(0);
  window.__periodA = periodAState;
  window.__periodB = periodBState;
  window.__comparing = comparingState;
  window.__triggerUpdate = () => setUpdateTick(t=>t+1);
  const periodA = periodAState[0];
  const periodB = periodBState[0];
  const comparing = comparingState[0];
  // Track scroll position to highlight sidebar
  useEffect(()=>{
    const handler=()=>{
      const sections=['overview','brands','domains','prompts','gaps'];
      for(let i=sections.length-1;i>=0;i--){
        const el=document.getElementById('section-'+sections[i]);
        if(el&&el.getBoundingClientRect().top<200){setActive(sections[i]);break;}
      }
    };
    const main=document.querySelector('.main');
    if(main) main.addEventListener('scroll',handler);
    window.addEventListener('scroll',handler);
    return ()=>{if(main)main.removeEventListener('scroll',handler);window.removeEventListener('scroll',handler);};
  },[]);

  return <div className="app">
    <Sidebar active={active} onNav={setActive}/>
    <main className="main">
      <div id="section-overview" className="scroll-anchor"/>
      <Header/>
      <PeriodBar/>
      <KpiGrid/>

      <div id="section-brands" className="scroll-anchor"/>
      <div className="row-2col"><ShareOfVoiceCard/><MentionsCard/></div>

      <div id="section-domains" className="scroll-anchor"/>
      <div className="row-2col"><DomainsCard/><AckoPagesCard/></div>

      <div id="section-prompts" className="scroll-anchor"/>
      <div style={{marginBottom:24}}><PromptsCard/></div>

      <div id="section-gaps" className="scroll-anchor"/>
      <GapAnalysisSection/>

      <div style={{marginTop:60,padding:'24px 0',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between',color:'var(--fg-4)',fontSize:11,fontFamily:'var(--font-mono)'}}>
        <span>ACKO GEO · Report {window.GEO_DATA.meta.reportId} · Source {window.GEO_DATA.meta.source}</span>
        <span>© 2026 Acko · Generated {window.GEO_DATA.meta.generatedAt}</span>
      </div>
    </main>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
